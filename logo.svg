<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Hotel Gran Estación">
  <defs>
    <clipPath id="circulo"><circle cx="50" cy="50" r="48"/></clipPath>
  </defs>
  <g clip-path="url(#circulo)">
    <!-- fondo rojo -->
    <rect width="100" height="100" fill="#B52324"/>
    <!-- frente del bus -->
    <rect x="19" y="9" width="62" height="76" rx="11" fill="#FFFFFF"/>
    <rect x="26" y="14" width="48" height="6" rx="3" fill="#B52324"/>
    <rect x="25" y="30" width="50" height="13" rx="1.5" fill="#B52324"/>
    <!-- parrilla -->
    <rect x="35" y="58" width="27" height="25" rx="3" fill="#FFFFFF" stroke="#B52324" stroke-width="2.2"/>
    <path d="M36.5 64 H60.5 M36.5 69.5 H60.5 M36.5 75 H60.5 M36.5 80 H60.5" stroke="#B52324" stroke-width="2"/>
    <!-- rueda / defensa -->
    <rect x="16" y="79" width="10" height="5" rx="2.5" fill="#B52324"/>
    <!-- franja azul diagonal, por encima de la esquina del bus -->
    <path d="M88 26 L100 30 L100 100 L60 100 Z" fill="#0A32AB"/>
    <path d="M88 26 L94 34 L64 100 L54 100 Z" fill="#081F73"/>
    <path d="M86.5 25 L88.5 26.5 L55 100 L52.5 100 Z" fill="#FFFFFF"/>
