    const raw = localStorage.getItem("sb-" + ref + "-auth-token");
    const token = raw ? JSON.parse(raw) : null;
    const id = token && ((token.user && token.user.id) || (token.currentSession && token.currentSession.user && token.currentSession.user.id));
    if (id) return id;
  } catch (e) { /* formato distinto: se intenta abajo */ }
  try {
    const { data } = await supabaseClient.auth.getSession();
    return (data && data.session && data.session.user && data.session.user.id) || null;
  } catch (e) { return null; }
}

// Sin internet: entra con el perfil guardado si la sesión de este navegador es la
// misma persona que guardó la copia local.
async function perfilDesdeCache() {
  const cache = await leerCacheLocal();
  const idSesion = await idUsuarioSesionLocal();
  if (!cache || !idSesion || cache.userId !== idSesion || !cache.perfil || !ROLES[cache.perfil.rol]) {
    state.currentUser = null;
    state.users = [];
    state.loginError = "Sin conexión a internet. Para trabajar sin internet, primero debes haber iniciado sesión con internet en este equipo.";
    return false;
  }
  const p = cache.perfil;
  state.currentUser = {
    id: cache.userId, email: p.email || "", usuario: p.usuario || "", nombre: p.nombre || "Usuario", rol: p.rol,
    horaInicioSesion: inicioTurno(cache.userId),
  };
  state.users = [{ id: cache.userId, usuario: p.usuario || "", nombre: p.nombre || "Usuario", rol: p.rol }];
  state.offline = true;
  return "offline";
}

// opciones.silencioso = recarga en segundo plano (sin pantalla de "Cargando…"),
// usada para ver los cambios hechos desde otros equipos.
async function loadState(opciones) {
  const silencioso = !!(opciones && opciones.silencioso);
  const cambiosAntes = contadorCambiosLocales;
  if (!silencioso) state.loading = true;
  try {
    const profileOk = await loadCurrentProfile();
    if (!profileOk) {
      state.loading = false;
      render();
      return;
    }

    if (!silencioso) {
      // Al abrir la app se recupera la copia de este equipo (con lo que quedó sin
      // enviar, por ejemplo si se trabajó sin internet). Después SIEMPRE se descargan
      // los datos del servidor y esos cambios pendientes se conservan encima.
      const cache = await leerCacheLocal();
      if (cache && cache.userId === state.currentUser.id) aplicarCache(cache);
      if (profileOk === "offline") { terminarCargaConCopiaLocal(); return; }
    } else if (profileOk === "offline") {
      if (!state.offline) { state.offline = true; actualizarBanner(); }
      return;
    }

    const [roomsRes, txRes, consRes, invRes, histRes] = await Promise.all([
      supabaseClient.from("habitaciones").select("*").order("numero"),
      supabaseClient.from("transacciones").select("*").order("hora_ingreso", { ascending: false }),
      supabaseClient.from("consumos").select("*").order("fecha", { ascending: false }),
      supabaseClient.from("inventario").select("*").order("nombre"),
      supabaseClient.from("historico").select("*").order("importado_el", { ascending: false }),
    ]);

    const errors = [roomsRes, txRes, consRes, invRes, histRes].filter((r) => r.error);
    if (errors.length) throw errors[0].error;

    // Comprueba si las columnas nuevas (capacidad / otras_personas / placa) y la tabla
    // pagos_caja ya existen en Supabase.
    const [capProbe, otrasProbe, pagosRes, placaProbe, adicionalesProbe, activosRes, tipoDocProbe, trasladosRes, configRes, detallesProbe, costosProbe, listaProbe, descuentoProbe, motivoProbe, menoresProbe, ivaInvProbe, ivaConsProbe] = await Promise.all([
      supabaseClient.from("habitaciones").select("capacidad").limit(1),
      supabaseClient.from("transacciones").select("otras_personas").limit(1),
      supabaseClient.from("pagos_caja").select("*").order("fecha", { ascending: false }),
      supabaseClient.from("transacciones").select("placa").limit(1),
      supabaseClient.from("transacciones").select("valor_adicionales").limit(1),
      supabaseClient.from("activos").select("*").order("nombre"),
      supabaseClient.from("transacciones").select("tipo_documento").limit(1),
      supabaseClient.from("traslados").select("*").order("fecha", { ascending: false }),
      supabaseClient.from("configuracion").select("*"),
      supabaseClient.from("habitaciones").select("detalles").limit(1),
      supabaseClient.from("inventario").select("costo, porcentaje_utilidad, historial_precios").limit(1),
      supabaseClient.from("habitaciones").select("lista").limit(1),
      supabaseClient.from("transacciones").select("descuento").limit(1),
      supabaseClient.from("transacciones").select("motivo_descuento").limit(1),
      supabaseClient.from("transacciones").select("menores, valor_menores").limit(1),
      supabaseClient.from("inventario").select("iva").limit(1),
      supabaseClient.from("consumos").select("iva").limit(1),
    ]);
    if (trasladosRes.error && esErrorDeRed(trasladosRes.error)) throw trasladosRes.error;
    if (configRes.error && esErrorDeRed(configRes.error)) throw configRes.error;
    if (activosRes.error && esErrorDeRed(activosRes.error)) throw activosRes.error;
    if (pagosRes.error && esErrorDeRed(pagosRes.error)) throw pagosRes.error;
    // Si mientras se descargaban los datos se hizo o se envió un cambio en este equipo,
    // esta recarga se descarta y se repite en el siguiente ciclo (unos segundos).
    if (silencioso && (contadorCambiosLocales !== cambiosAntes || guardadosEnCurso > 0)) return;

    // Cambios de este equipo que aún no están en Supabase. Se calculan ANTES de
    // tocar nada, con la misma "foto" con la que se compararon hasta ahora.
    const pendientes = capturarPendientes();

    state.dbCapacidad = !capProbe.error;
    state.dbOtras = !otrasProbe.error;
    // Columna "placa" en transacciones (ver SQL en el comentario de PLACA). Mientras no
    // exista, la placa se guarda solo dentro de la habitación ocupada.
    state.dbPlaca = !placaProbe.error;
    // Columna "tipo_documento" en transacciones (ver SQL junto a tipoDocumentoDe).
    state.dbTipoDoc = !tipoDocProbe.error;
    // Columna "valor_adicionales" (ver SQL junto a TARIFAS).
    state.dbAdicionales = !adicionalesProbe.error;
    state.dbPagosCaja = !pagosRes.error;
    state.dbActivos = !activosRes.error;
    state.dbTraslados = !trasladosRes.error;
    state.dbConfiguracion = !configRes.error;
    state.dbDetallesHab = !detallesProbe.error;
    // Columnas de costo, % de utilidad e historial en inventario (crear-costos-inventario.sql).
    state.dbCostos = !costosProbe.error;
    // Columnas "lista" (habitaciones) y "descuento" (transacciones), ver crear-lista-descuento.sql.
    state.dbLista = !listaProbe.error;
    state.dbDescuento = !descuentoProbe.error;
    state.dbMotivoDescuento = !motivoProbe.error;
    // Columnas "menores" y "valor_menores" en transacciones (crear-menores-iva.sql).
    state.dbMenores = !menoresProbe.error;
    // Columna "iva" (% de IVA de cada producto) en inventario (crear-menores-iva.sql).
    state.dbIvaInventario = !ivaInvProbe.error;
    // Columna "iva" (% de IVA con el que se vendió) en consumos (crear-menores-iva.sql).
    state.dbIvaConsumos = !ivaConsProbe.error;
    if (activosRes.error) console.warn("La tabla activos (inventario del hotel) no está disponible:", activosRes.error);
    // Se guarda el motivo exacto que dio Supabase, para mostrarlo en el aviso.
    state.errorPagosCaja = pagosRes.error
      ? { code: pagosRes.error.code || "", message: pagosRes.error.message || String(pagosRes.error), hint: pagosRes.error.hint || "" }
      : null;
    if (pagosRes.error) console.warn("Supabase no permitió leer la tabla pagos_caja:", pagosRes.error);
    const capacidadesLocales = leerCapacidadesLocales();

    const servidor = {
      rooms: (roomsRes.data || []).map((r) => normalizeRoom({
        id: r.id,
        number: r.numero,
        piso: r.piso,
        tipo: r.tipo,
        capacidad: (state.dbCapacidad && Number(r.capacidad) >= 1) ? r.capacidad : capacidadesLocales[String(r.id)],
        status: r.status,
        limpia: r.limpia,
        lista: r.lista !== false,
        guest: r.guest,
        detalles: r.detalles && typeof r.detalles === "object" ? r.detalles : {},
      })),
      transactions: (txRes.data || []).map((t) => ({
        id: t.id,
        roomId: t.room_id,
        roomNumber: t.room_number,
        tipoHabitacion: t.tipo_habitacion,
        estado: t.estado,
        nombre: t.nombre,
        cedula: t.cedula,
        tipoDocumento: t.tipo_documento || "",
        descuento: Number(t.descuento) || 0,
        motivoDescuento: t.motivo_descuento || "",
        nacionalidad: t.nacionalidad,
        placa: t.placa || "",
        valorAdicionales: t.valor_adicionales != null ? Number(t.valor_adicionales) || 0 : null,
        menores: Array.isArray(t.menores) ? t.menores : [],
        valorMenores: Number(t.valor_menores) || 0,
        ciudad: t.ciudad,
        telefono: t.telefono,
        personas: t.personas,
        acompNombre: t.acomp_nombre,
        acompTipoDocumento: t.acomp_tipo_documento,
        acompCedula: t.acomp_cedula,
        acompTelefono: t.acomp_telefono,
        acompanantes: Array.isArray(t.otras_personas) ? t.otras_personas : [],
        facturarA: t.facturar_a || "principal",
        horaIngreso: t.hora_ingreso,
        horaSalida: t.hora_salida,
        valorDia: Number(t.valor_dia) || 0,
        dias: t.dias,
        valor: Number(t.valor) || 0,
        formasPago: Array.isArray(t.formas_pago) ? t.formas_pago : [],
        montoPagado: Number(t.monto_pagado) || 0,
        pagado: Boolean(t.pagado),
        usuario: t.usuario || "",
        usuarioCheckout: t.usuario_checkout || "",
      })),
      consumos: (consRes.data || []).map((c) => ({
        id: c.id,
        transactionId: c.transaction_id,
        roomId: c.room_id,
        roomNumber: c.room_number,
        inventarioId: c.inventario_id,
        descripcion: c.descripcion,
        cantidad: Number(c.cantidad) || 0,
        valorUnit: Number(c.valor_unit) || 0,
        valor: Number(c.valor) || 0,
        formaPago: c.forma_pago,
        pagado: c.pagado === false ? false : true,
        fecha: c.fecha,
        usuario: c.usuario || "",
        iva: c.iva != null ? Number(c.iva) : null,
      })),
      inventario: (invRes.data || []).map((i) => ({
        id: i.id,
        nombre: i.nombre,
        categoria: i.categoria,
        precio: Number(i.precio) || 0,
        stock: Number(i.stock) || 0,
        minimo: Number(i.minimo) || 0,
        costo: i.costo != null ? Number(i.costo) : null,
        utilidad: i.porcentaje_utilidad != null ? Number(i.porcentaje_utilidad) : null,
        historial: Array.isArray(i.historial_precios) ? i.historial_precios : [],
        iva: i.iva != null ? Number(i.iva) : null,
      })),
      historico: (histRes.data || []).map((h) => ({
        id: h.id,
        nombre: h.nombre,
        hoja: h.hoja,
        filas: Array.isArray(h.filas) ? h.filas : [],
        importadoEl: h.importado_el,
      })),
      // Si la tabla pagos_caja aún no existe, en el servidor no hay pagos: los de este
      // equipo se conservan como pendientes y se envían cuando la tabla exista.
      pagosCaja: state.dbPagosCaja ? (pagosRes.data || []).map(pagoCajaDesdeFila) : [],
      activos: state.dbActivos ? (activosRes.data || []).map(activoDesdeFila) : [],
      traslados: state.dbTraslados ? (trasladosRes.data || []).map(trasladoDesdeFila) : [],
      configuracion: state.dbConfiguracion ? (configRes.data || []).map(configuracionDesdeFila) : [],
    };

    // Datos del servidor + los cambios pendientes de este equipo encima.
    const quedanPendientes = combinarConServidor(servidor, pendientes);
    descartados.clear();
    state.saveError = state.erroresSync.length > 0;
    state.offline = false;
    state.ultimaSincronizacion = nowLocalInput();
    // Si las tablas de actividad/presencia no existían, se vuelve a probar (por si
    // el administrador ejecutó crear-actividad.sql con la app abierta).
    if (state.dbActividad === false) state.dbActividad = undefined;
    if (state.dbPresencia === false) state.dbPresencia = undefined;
    guardarCacheLocal();
    if (quedanPendientes) persist();
    if (!silencioso) { actualizarPresencia(true); enviarActividadPendiente(); }
  } catch (e) {
    console.error("Error cargando datos de Supabase:", e);
    if (esErrorDeRed(e)) {
      // Sin internet: en segundo plano no se interrumpe nada; al abrir la app se
      // usa la copia guardada en este equipo.
      if (silencioso) { if (!state.offline) { state.offline = true; actualizarBanner(); } return; }
      const cache = await leerCacheLocal();
      if (cache && state.currentUser && cache.userId === state.currentUser.id) {
        aplicarCache(cache);
        terminarCargaConCopiaLocal();
        return;
      }
      state.offline = true;
      state.loginError = "Sin conexión a internet y no hay datos guardados en este equipo todavía.";
    } else {
      // En la recarga de fondo un error no debe interrumpir el trabajo:
      // se deja todo como está y se vuelve a intentar en el siguiente ciclo.
      if (silencioso) return;
      state.saveError = true;
      state.loginError = "No fue posible cargar los datos del hotel desde Supabase.";
    }
  }
  state.loading = false;
  if (silencioso) { renderSiSePuede(); return; }
  render();
}

function terminarCargaConCopiaLocal() {
  state.loading = false;
  if (!state.saveError) state.offline = true;
  render();
}

// Vuelve a dibujar la pantalla conservando la búsqueda de habitaciones y la
// posición de la página (para las recargas en segundo plano).
function renderConservandoPosicion() {
  const busqueda = document.getElementById("buscador-huespedes");
  const textoBusqueda = busqueda ? busqueda.value : "";
  const scrollY = window.scrollY;
  render();
  const nuevaBusqueda = document.getElementById("buscador-huespedes");
  if (nuevaBusqueda && textoBusqueda) {
    nuevaBusqueda.value = textoBusqueda;
    filtrarHabitacionesPorTexto(textoBusqueda);
  }
  window.scrollTo(0, scrollY);
}

// Actualiza solo el aviso de conexión/guardado, sin redibujar toda la pantalla.
function actualizarBanner() {
  const el = document.getElementById("save-banner");
  if (el) el.outerHTML = renderSaveBanner();
  const sync = document.getElementById("estado-sync");
  if (sync) sync.innerHTML = contenidoEstadoSync();
}

// Texto del botón de sincronización del encabezado.
function contenidoEstadoSync() {
  const pendientes = state.currentUser ? contarCambiosPendientes() : 0;
  let texto;
  if (state.offline) texto = "Sin conexión";
  else if (state.erroresSync.length) texto = "Error al guardar";
  else if (pendientes > 0) texto = pendientes + " por enviar";
  else if (state.ultimaSincronizacion) texto = "Sincronizado " + state.ultimaSincronizacion.slice(11, 16);
  else texto = "Sincronizar";
  return "⟳ " + esc(texto);
}

/* ---------- sincronización entre varios equipos ----------
   Cada equipo recuerda cómo estaba cada registro la última vez que lo leyó o lo
   guardó en Supabase ("foto sincronizada"). Al guardar:
     - solo se envían los registros que ESTE equipo cambió (no se reescriben
       con datos viejos los registros que otro equipo modificó mientras tanto);
     - solo se borran los registros que ESTE equipo eliminó (antes se borraba todo
       lo que no estuviera en la pantalla, y eso podía eliminar lo que otro equipo
       acababa de crear).
   Además, cada cierto tiempo se recargan los datos para ver lo que hicieron los demás. */
const TABLAS_SYNC = ["habitaciones", "transacciones", "consumos", "inventario", "historico", "pagos_caja", "activos", "traslados", "configuracion"];
// Tablas opcionales: hasta que se creen en Supabase, sus datos se guardan solo en este equipo.
function tablaExisteEnServidor(t) {
  if (t === "pagos_caja") return !!state.dbPagosCaja;
  if (t === "activos") return !!state.dbActivos;
  if (t === "traslados") return !!state.dbTraslados;
  if (t === "configuracion") return !!state.dbConfiguracion;
  return true;
}
// Tablas en las que la app nunca borra registros (en Supabase el borrado está
// bloqueado con bloquear-pagos-caja.sql).
const TABLAS_SIN_BORRADO = ["pagos_caja", "traslados", "configuracion"];
let fotoSincronizada = {};
TABLAS_SYNC.forEach((t) => { fotoSincronizada[t] = new Map(); });
let guardadosEnCurso = 0;
let contadorCambiosLocales = 0;

// Huella corta de un registro (para comparar sin guardar el registro completo dos veces).
function huella(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36) + ":" + str.length;
}
function huellaFila(fila) { return huella(JSON.stringify(fila)); }

// Tablas que este usuario sincroniza con Supabase en este momento.
function tablasSincronizables() {
  return TABLAS_SYNC.filter((t) =>
    (t !== "historico" || puede("editContabilidad")) &&
    tablaExisteEnServidor(t)
  );
}

// Cuántos registros cambió/creó/borró este equipo que aún no están en Supabase.
function contarCambiosPendientes() {
  if (!state.currentUser) return 0;
  const actuales = filasActuales();
  let n = 0;
  tablasSincronizables().forEach((tabla) => {
    const foto = fotoSincronizada[tabla];
    const ids = new Set();
    actuales[tabla].forEach((f) => { ids.add(f.id); if (foto.get(f.id) !== huellaFila(f)) n++; });
    // Los pagos de caja nunca se borran (bloqueado en Supabase): no cuentan como pendientes.
    if (!TABLAS_SIN_BORRADO.includes(tabla)) foto.forEach((_, id) => { if (!ids.has(id)) n++; });
  });
  return n;
}

function pagoCajaDesdeFila(p) {
  return {
    id: p.id, fecha: p.fecha, concepto: p.concepto || "", beneficiario: p.beneficiario || "",
    categoria: p.categoria || "Otro", soporte: p.soporte || "", valor: Number(p.valor) || 0,
    formaPago: p.forma_pago || "Efectivo", usuario: p.usuario || "",
    registradoEl: fechaLocalDeISO(p.creado_el),
    editadoPor: p.editado_por || "",
    editadoEl: fechaLocalDeISO(p.editado_el),
  };
}
// Convierte una fecha ISO de Supabase (UTC) a "AAAA-MM-DDTHH:MM" en hora local.
function fechaLocalDeISO(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
// Traslado de un huésped de una habitación a otra.
function trasladoDesdeFila(x) {
  return {
    id: x.id, fecha: x.fecha || "", transactionId: x.transaction_id || "", huesped: x.huesped || "",
    deHabitacion: x.de_habitacion || "", aHabitacion: x.a_habitacion || "", usuario: x.usuario || "",
  };
}
function filaTraslado(x) {
  return {
    id: String(x.id), fecha: x.fecha || nowLocalInput(), transaction_id: x.transactionId || null, huesped: x.huesped || null,
    de_habitacion: x.deHabitacion || null, a_habitacion: x.aHabitacion || null, usuario: x.usuario || null,
  };
}
// Textos de configuración (p. ej. la política de tratamiento de datos).
function configuracionDesdeFila(x) {
  return { id: x.id, contenido: x.contenido || "", actualizadoPor: x.actualizado_por || "", actualizadoEl: x.actualizado_el || "" };
}
function filaConfiguracion(x) {
  return { id: String(x.id), contenido: x.contenido || "", actualizado_por: x.actualizadoPor || null, actualizado_el: x.actualizadoEl || null };
}

function activoDesdeFila(a) {
  return {
    id: a.id, nombre: a.nombre || "", categoria: a.categoria || "", ubicacion: a.ubicacion || "",
    cantidad: Number(a.cantidad) || 0, estado: a.estado || "Bueno", observaciones: a.observaciones || "",
    revisadoEl: a.revisado_el || "", actualizadoPor: a.actualizado_por || "",
  };
}
function filaActivo(a) {
  return {
    id: String(a.id), nombre: a.nombre || "", categoria: a.categoria || null, ubicacion: a.ubicacion || null,
    cantidad: Math.max(0, Math.floor(Number(a.cantidad) || 0)), estado: a.estado || "Bueno",
    observaciones: a.observaciones || null, revisado_el: a.revisadoEl || null, actualizado_por: a.actualizadoPor || null,
  };
}
function filaPagoCaja(p) {
  return {
    id: String(p.id), fecha: p.fecha || nowLocalInput(), concepto: p.concepto || "",
    beneficiario: p.beneficiario || null, categoria: p.categoria || null, soporte: p.soporte || null,
    valor: Number(p.valor) || 0, forma_pago: p.formaPago || null, usuario: p.usuario || null,
  };
}

function filaHabitacion(r) {
  return {
    id: String(r.id), numero: String(r.number), piso: String(r.piso || ""),
    tipo: r.tipo, status: r.status, limpia: Boolean(r.limpia), guest: r.guest || null,
    ...(state.dbCapacidad ? { capacidad: capacidadDe(r) } : {}),
    ...(state.dbLista ? { lista: r.lista !== false } : {}),
    // Contenido de la habitación (camas, dotación…), editable en Administración.
    ...(state.dbDetallesHab ? { detalles: r.detalles && typeof r.detalles === "object" ? r.detalles : {} } : {}),
  };
}
function filaTransaccion(t) {
  return {
    id: String(t.id), room_id: t.roomId || null, room_number: t.roomNumber || null,
    tipo_habitacion: t.tipoHabitacion || null, estado: t.estado || "activa",
    nombre: t.nombre || null, cedula: t.cedula || null, nacionalidad: t.nacionalidad || null,
    ciudad: t.ciudad || null, telefono: t.telefono || null, personas: Number(t.personas) || 1,
    acomp_nombre: t.acompNombre || null, acomp_tipo_documento: t.acompTipoDocumento || null, acomp_cedula: t.acompCedula || null, acomp_telefono: t.acompTelefono || null,
    facturar_a: (t.facturarA && t.facturarA !== "principal") ? "acompanante" : "principal",
    ...(state.dbOtras ? { otras_personas: getAcompanantes(t) } : {}),
    ...(state.dbPlaca ? { placa: t.placa || null } : {}),
    ...(state.dbTipoDoc ? { tipo_documento: t.tipoDocumento || null } : {}),
    ...(state.dbDescuento ? { descuento: Number(t.descuento) || 0 } : {}),
    ...(state.dbMotivoDescuento ? { motivo_descuento: t.motivoDescuento || null } : {}),
    ...(state.dbAdicionales ? { valor_adicionales: t.valorAdicionales != null ? Number(t.valorAdicionales) || 0 : null } : {}),
    ...(state.dbMenores ? { menores: menoresDe(t), valor_menores: Number(t.valorMenores) || 0 } : {}),
    hora_ingreso: t.horaIngreso || null, hora_salida: t.horaSalida || null,
    valor_dia: Number(t.valorDia) || 0, dias: Number(t.dias) || 1, valor: Number(t.valor) || 0,
    formas_pago: Array.isArray(t.formasPago) ? t.formasPago : [],
    monto_pagado: Number(t.montoPagado) || 0, pagado: Boolean(t.pagado),
    usuario: t.usuario || null, usuario_checkout: t.usuarioCheckout || null,
  };
}
function filaConsumo(c) {
  if (!c.fecha) c.fecha = new Date().toISOString();
  return {
    id: String(c.id), transaction_id: c.transactionId || null, room_id: c.roomId || null,
    room_number: c.roomNumber || null, inventario_id: c.inventarioId || null,
    descripcion: c.descripcion || "", cantidad: Number(c.cantidad) || 1,
    valor_unit: Number(c.valorUnit) || 0, valor: Number(c.valor) || 0,
    forma_pago: c.formaPago || null, pagado: c.pagado !== false,
    fecha: c.fecha, usuario: c.usuario || null,
    ...(state.dbIvaConsumos ? { iva: ivaPctConsumo(c) } : {}),
  };
}
function filaInventario(i) {
  return {
    id: String(i.id), nombre: i.nombre || "", categoria: i.categoria || "General",
    precio: Number(i.precio) || 0, stock: Math.max(0, Number(i.stock) || 0),
    minimo: Math.max(0, Number(i.minimo) || 0),
    // Costo, % de utilidad e historial de precios (columnas de crear-costos-inventario.sql).
    ...(state.dbCostos ? {
      costo: tieneCosto(i) ? Number(i.costo) : null,
      porcentaje_utilidad: i.utilidad != null && i.utilidad !== "" ? Number(i.utilidad) : null,
      historial_precios: Array.isArray(i.historial) ? i.historial : [],
    } : {}),
    ...(state.dbIvaInventario ? { iva: ivaPctProducto(i) } : {}),
  };
}
function filaHistorico(h) {
  if (!h.importadoEl) h.importadoEl = new Date().toISOString();
  return {
    id: String(h.id), nombre: h.nombre || "", hoja: h.hoja || "",
    filas: Array.isArray(h.filas) ? h.filas : [], importado_el: h.importadoEl,
  };
}

// Filas actuales (según lo que hay en pantalla) de cada tabla.
function filasActuales() {
  return {
    habitaciones: state.rooms.map(filaHabitacion),
    transacciones: state.transactions.map(filaTransaccion),
    consumos: state.consumos.map(filaConsumo),
    inventario: state.inventario.map(filaInventario),
    historico: state.historico.map(filaHistorico),
    pagos_caja: state.pagosCaja.map(filaPagoCaja),
    activos: state.activos.map(filaActivo),
    traslados: state.traslados.map(filaTraslado),
    configuracion: state.configuracion.map(filaConfiguracion),
  };
}

// Cómo se relaciona cada tabla de Supabase con la lista de la app y su "fila".
const TABLA_INFO = {
  habitaciones: { clave: "rooms", fila: filaHabitacion },
  transacciones: { clave: "transactions", fila: filaTransaccion },
  consumos: { clave: "consumos", fila: filaConsumo },
  inventario: { clave: "inventario", fila: filaInventario },
  historico: { clave: "historico", fila: filaHistorico },
  pagos_caja: { clave: "pagosCaja", fila: filaPagoCaja },
  activos: { clave: "activos", fila: filaActivo },
  traslados: { clave: "traslados", fila: filaTraslado },
  configuracion: { clave: "configuracion", fila: filaConfiguracion },
};

// Cambios que el usuario decidió descartar (se reemplazan por la versión del servidor
// en la siguiente recarga). Clave: "tabla:id".
const descartados = new Set();

// Cambios de este equipo que todavía no están en Supabase, tabla por tabla:
// registros nuevos o modificados (cambiados) y registros eliminados (borrados).
function capturarPendientes() {
  const res = {};
  TABLAS_SYNC.filter((t) => t !== "historico" || puede("editContabilidad")).forEach((t) => {
    const info = TABLA_INFO[t];
    const foto = fotoSincronizada[t];
    const cambiados = new Map();
    const ids = new Set();
    state[info.clave].forEach((o) => {
      const f = info.fila(o);
      ids.add(f.id);
      if (descartados.has(t + ":" + f.id)) return;
      if (foto.get(f.id) !== huellaFila(f)) cambiados.set(f.id, o);
    });
    // En tablas sin borrado (pagos de caja) un registro que falte aquí no se borra:
    // en la siguiente recarga vuelve a aparecer con la versión del servidor.
    const borrados = new Set();
    if (!TABLAS_SIN_BORRADO.includes(t)) {
      foto.forEach((_, id) => { if (!ids.has(id) && !descartados.has(t + ":" + id)) borrados.add(id); });
    }
    res[t] = { cambiados, borrados };
  });
  return res;
}

// Pone en pantalla los datos recién descargados y, ENCIMA, los cambios de este
// equipo que aún no se han enviado (así nunca se pierden ni bloquean la recarga).
// Devuelve true si quedan cambios por enviar.
function combinarConServidor(servidor, pendientes) {
  let quedan = false;
  TABLAS_SYNC.forEach((t) => {
    const info = TABLA_INFO[t];
    const lista = servidor[info.clave] || [];
    const foto = new Map();
    // Si la tabla pagos_caja aún no existe, nada de lo local se considera enviado.
    if (tablaExisteEnServidor(t)) {
      lista.forEach((o) => { const f = info.fila(o); foto.set(f.id, huellaFila(f)); });
    }
    const p = pendientes[t];
    let combinada = lista;
    if (p) {
      combinada = lista
        .filter((o) => !p.borrados.has(String(o.id)))
        .map((o) => p.cambiados.get(String(o.id)) || o);
      const idsServidor = new Set(lista.map((o) => String(o.id)));
      p.cambiados.forEach((o, id) => {
        if (!idsServidor.has(id)) combinada.push(o);
        if (foto.get(id) !== huellaFila(info.fila(o))) quedan = true;
      });
      p.borrados.forEach((id) => { if (idsServidor.has(id)) quedan = true; });
    }
    state[info.clave] = combinada;
    fotoSincronizada[t] = foto;
  });
  // Los avisos de error de registros que ya no están pendientes se quitan.
  state.erroresSync = state.erroresSync.filter((e) => {
    const p = pendientes[e.tabla];
    return p && (p.cambiados.has(e.id) || p.borrados.has(e.id)) && !descartados.has(e.tabla + ":" + e.id);
  });
  return quedan;
}

// Nombre entendible de un registro, para los avisos de error.
function describirRegistro(tabla, id) {
  const buscar = (lista) => lista.find((o) => String(o.id) === String(id));
  if (tabla === "habitaciones") { const r = buscar(state.rooms); return r ? "Habitación " + r.number : "Una habitación eliminada"; }
  if (tabla === "transacciones") { const t = buscar(state.transactions); return t ? "Estadía de " + (t.nombre || "un huésped") + " (hab. " + (t.roomNumber || "—") + ")" : "Una estadía eliminada"; }
  if (tabla === "consumos") { const c = buscar(state.consumos); return c ? "Consumo \"" + (c.descripcion || "") + "\" (hab. " + (c.roomNumber || "—") + ")" : "Un consumo eliminado"; }
  if (tabla === "inventario") { const i = buscar(state.inventario); return i ? "Producto \"" + i.nombre + "\"" : "Un producto eliminado"; }
  if (tabla === "historico") { const h = buscar(state.historico); return h ? "Hoja importada \"" + h.hoja + "\"" : "Una hoja importada eliminada"; }
  if (tabla === "traslados") { const x = buscar(state.traslados); return x ? "Traslado de " + (x.huesped || "un huésped") + " (" + x.deHabitacion + " → " + x.aHabitacion + ")" : "Un traslado"; }
  if (tabla === "configuracion") { const d = DOCUMENTOS_LEGALES.find((x) => x.id === String(id)); return d ? d.titulo : "Documento legal"; }
  if (tabla === "activos") { const a = buscar(state.activos); return a ? "Artículo del inventario \"" + a.nombre + "\"" : "Un artículo del inventario eliminado"; }
  if (tabla === "pagos_caja") { const p = buscar(state.pagosCaja); return p ? "Pago de caja \"" + p.concepto + "\" (" + formatCOP(p.valor) + ")" : "Un pago de caja"; }
  return "Un registro";
}

// Explica en palabras simples por qué Supabase rechazó un cambio.
function textoErrorSupabase(error) {
  const msg = String((error && (error.message || error.details)) || error || "");
  const code = (error && error.code) || "";
  if (code === "42501" || /row-level security|permission denied/i.test(msg)) {
    return "Supabase no le da permiso a este usuario para hacer este cambio.";
  }
  if (code === "42703" || /column .* does not exist|Could not find the .* column/i.test(msg)) {
    return "A la tabla de Supabase le falta una columna (" + msg + ").";
  }
  return msg || "Error desconocido.";
}

// Mensaje técnico exacto de Supabase (tabla, código y texto), para poder diagnosticar.
function detalleTecnico(error) {
  if (!error) return "";
  return [error.code, error.message, error.details, error.hint].filter(Boolean).join(" — ").slice(0, 300);
}

// Envía registros nuevos/modificados.
// - Los que ya existen en Supabase (están en la "foto") se envían como MODIFICACIÓN
//   (update): así basta con el permiso de modificar. Con "upsert" Supabase exige
//   además el permiso de CREAR filas, y por eso, por ejemplo, la aseadora no podía
//   marcar una habitación como limpia.
// - Los nuevos se envían con upsert. Si el envío en bloque falla, se reintentan uno
//   por uno: así un registro rechazado no impide que se guarden los demás.
async function enviarCambios(tabla, filas, foto, fallos) {
  const existentes = filas.filter((f) => foto.has(f.id));
  const nuevas = filas.filter((f) => !foto.has(f.id));
  for (const f of existentes) await enviarModificacion(tabla, f, foto, fallos);
  if (nuevas.length) await enviarNuevas(tabla, nuevas, foto, fallos);
}

async function enviarModificacion(tabla, fila, foto, fallos) {
  const { data, error } = await supabaseClient.from(tabla).update(fila).eq("id", fila.id).select("id");
  if (!error && Array.isArray(data) && data.length) { foto.set(fila.id, huellaFila(fila)); return; }
  if (error && esErrorDeRed(error)) throw error;
  if (error) {
    console.error("Supabase rechazó un cambio en " + tabla + ":", error);
    fallos.push({ tabla, id: fila.id, accion: "guardar", descripcion: describirRegistro(tabla, fila.id), mensaje: textoErrorSupabase(error), detalle: detalleTecnico(error) });
    return;
  }
  // No se modificó ninguna fila (otro equipo la borró, o las reglas no dejan verla):
  // se intenta como antes, creándola de nuevo; si tampoco se puede, queda el aviso.
  await enviarNuevas(tabla, [fila], foto, fallos);
}

async function enviarNuevas(tabla, filas, foto, fallos) {
  const { error } = await supabaseClient.from(tabla).upsert(filas, { onConflict: "id" });
  if (!error) { filas.forEach((f) => foto.set(f.id, huellaFila(f))); return; }
  if (esErrorDeRed(error)) throw error;
  if (filas.length === 1) {
    console.error("Supabase rechazó un cambio en " + tabla + ":", error);
    fallos.push({ tabla, id: filas[0].id, accion: "guardar", descripcion: describirRegistro(tabla, filas[0].id), mensaje: textoErrorSupabase(error), detalle: detalleTecnico(error) });
    return;
  }
  for (const f of filas) await enviarNuevas(tabla, [f], foto, fallos);
}

// Lo mismo para los registros que este equipo eliminó.
async function enviarBorrados(tabla, ids, foto, fallos) {
  const { error } = await supabaseClient.from(tabla).delete().in("id", ids);
  if (!error) { ids.forEach((id) => foto.delete(id)); return; }
  if (esErrorDeRed(error)) throw error;
  if (ids.length === 1) {
    console.error("Supabase rechazó un borrado en " + tabla + ":", error);
    fallos.push({ tabla, id: ids[0], accion: "borrar", descripcion: describirRegistro(tabla, ids[0]), mensaje: textoErrorSupabase(error), detalle: detalleTecnico(error) });
    return;
  }
  for (const id of ids) await enviarBorrados(tabla, [id], foto, fallos);
}

/* ---------- actividad de los usuarios ----------
   Cada acción (iniciar/cerrar sesión, crear, modificar o eliminar registros) se
   anota en la tabla "actividad" y cada usuario conectado mantiene su fila en la
   tabla "presencia" (para saber quién está activo). Se ven en Administración →
   Actividad: el creador ve todo; el administrador ve a todos MENOS al creador
   (lo garantizan las reglas de crear-actividad.sql). Las acciones hechas sin
   internet esperan en una cola de este equipo y se envían al volver la conexión. */
const CLAVE_COLA_ACTIVIDAD = "hotel_cola_actividad";
let colaActividad = (function () {
  try { const x = JSON.parse(localStorage.getItem(CLAVE_COLA_ACTIVIDAD) || "[]"); return Array.isArray(x) ? x : []; }
  catch (e) { return []; }
})();
function guardarColaActividad() {
  try { localStorage.setItem(CLAVE_COLA_ACTIVIDAD, JSON.stringify(colaActividad.slice(-500))); } catch (e) { /* sin localStorage */ }
}
function registrarActividad(accion, detalle) {
  if (!state.currentUser) return;
  colaActividad.push({
    id: genId("act"),
    fecha: nowLocalInput(),
    usuario_id: state.currentUser.id,
    usuario: state.currentUser.nombre || state.currentUser.usuario || "",
    rol: state.currentUser.rol,
    accion: String(accion || "").slice(0, 80),
    detalle: String(detalle || "").slice(0, 300),
  });
  guardarColaActividad();
  enviarActividadPendiente();
}
function tablaNoExiste(error) {
  const t = String((error && (error.code + " " + error.message)) || "");
  return /PGRST205|42P01|schema cache|does not exist/i.test(t);
}
let enviandoActividad = false;
async function enviarActividadPendiente() {
  if (enviandoActividad || !state.currentUser || state.dbActividad === false) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) return;
  // Solo se envían las acciones del usuario con sesión (Supabase no deja enviar las de otro).
  const lote = colaActividad.filter((x) => x.usuario_id === state.currentUser.id).slice(0, 100);
  if (!lote.length) return;
  enviandoActividad = true;
  try {
    const enviados = new Set();
    const { error } = await supabaseClient.from("actividad").insert(lote);
    if (!error) lote.forEach((x) => enviados.add(x.id));
    else if (tablaNoExiste(error)) state.dbActividad = false;
    else if (!esErrorDeRed(error)) {
      // Alguno ya estaba guardado (código 23505) u otro problema: se envían uno por uno.
      for (const x of lote) {
        const r = await supabaseClient.from("actividad").insert(x);
        if (!r.error || r.error.code === "23505") enviados.add(x.id);
        else if (esErrorDeRed(r.error)) break;
        else console.warn("No se pudo registrar una actividad:", r.error);
      }
    }
    if (enviados.size) {
      colaActividad = colaActividad.filter((x) => !enviados.has(x.id));
      guardarColaActividad();
    }
  } catch (e) {
    /* sin internet: se reintenta en el siguiente ciclo */
  } finally {
    enviandoActividad = false;
  }
}

// Marca al usuario como conectado (y la hora de su última actividad).
let ultimaPresencia = 0;
async function actualizarPresencia(enLinea) {
  if (!state.currentUser || state.dbPresencia === false) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) return;
  ultimaPresencia = Date.now();
  try {
    const { error } = await supabaseClient.from("presencia").upsert({
      id: state.currentUser.id,
      usuario: state.currentUser.nombre || state.currentUser.usuario || "",
      rol: state.currentUser.rol,
      inicio_sesion: state.currentUser.horaInicioSesion || nowLocalInput(),
      ultima_actividad: new Date().toISOString(),
      en_linea: enLinea !== false,
    }, { onConflict: "id" });
    if (error && tablaNoExiste(error)) state.dbPresencia = false;
  } catch (e) { /* sin internet */ }
}

// Nombre de los registros que se van a eliminar (después ya no se pueden describir).
const nombresEliminados = new Map();
function recordarNombreAntesDeBorrar(tabla, id) {
  nombresEliminados.set(tabla + ":" + id, describirRegistro(tabla, id));
}
const ETIQUETA_TABLA = {
  habitaciones: "habitación", transacciones: "estadía", consumos: "consumo", inventario: "producto",
  historico: "hoja importada", pagos_caja: "pago de caja", activos: "artículo del inventario del hotel",
  traslados: "traslado", configuracion: "documento legal",
};
// Anota en la actividad lo que se acaba de guardar en Supabase. Si son muchos
// registros de una misma tabla (p. ej. al importar), se resume en una sola línea.
function anotarCambiosGuardados(tabla, creados, modificados, eliminados) {
  const etiqueta = ETIQUETA_TABLA[tabla] || tabla;
  const anotar = (verbo, ids, describir) => {
    if (!ids.length) return;
    if (ids.length > 5) { registrarActividad(verbo + " " + ids.length + " registros", "Tabla: " + etiqueta); return; }
    ids.forEach((id) => registrarActividad(verbo + " " + etiqueta, describir(id)));
  };
  anotar("Creó", creados, (id) => describirRegistro(tabla, id));
  anotar("Modificó", modificados, (id) => describirRegistro(tabla, id));
  anotar("Eliminó", eliminados, (id) => {
    const nombre = nombresEliminados.get(tabla + ":" + id);
    nombresEliminados.delete(tabla + ":" + id);
    return nombre || "";
  });
}

async function persist() {
  if (!state.currentUser) return false;
  contadorCambiosLocales++;
  guardadosEnCurso++;
  guardarCapacidadesLocales();
  // Primero se guarda todo en este equipo: así ningún cambio se pierde aunque no
  // haya internet o se cierre la página antes de enviarlo.
  await guardarCacheLocal();
  const fallos = [];

  try {
    if (typeof navigator !== "undefined" && navigator.onLine === false) {
      const err = new Error("Sin conexión a internet");
      err.name = "NetworkError";
      throw err;
    }
    // Los datos de negocio se guardan en Supabase. La seguridad real la aplican
    // las políticas RLS; estas comprobaciones de rol en JS solo controlan la UI.
    const actuales = filasActuales();

    for (const tabla of tablasSincronizables()) {
      const foto = fotoSincronizada[tabla];
      const filas = actuales[tabla];
      const idsActuales = new Set(filas.map((f) => f.id));

      // 1) Registros nuevos o modificados en este equipo.
      const cambiadas = filas.filter((f) => foto.get(f.id) !== huellaFila(f));
      const eranNuevas = new Set(cambiadas.filter((f) => !foto.has(f.id)).map((f) => f.id));
      if (cambiadas.length) await enviarCambios(tabla, cambiadas, foto, fallos);
      // Se anotan en la actividad solo los registros que Supabase aceptó.
      const guardadas = cambiadas.filter((f) => foto.get(f.id) === huellaFila(f)).map((f) => f.id);

      // 2) Registros que este equipo eliminó (estaban en la foto y ya no están).
      //    Nunca se borra algo que este equipo no conocía: eso lo creó otro equipo.
      const borradas = TABLAS_SIN_BORRADO.includes(tabla) ? [] : [...foto.keys()].filter((id) => !idsActuales.has(id));
      if (borradas.length) await enviarBorrados(tabla, borradas, foto, fallos);
      anotarCambiosGuardados(
        tabla,
        guardadas.filter((id) => eranNuevas.has(id)),
        guardadas.filter((id) => !eranNuevas.has(id)),
        borradas.filter((id) => !foto.has(id))
      );
    }

    state.erroresSync = fallos;
    state.saveError = fallos.length > 0;
    state.offline = false;
    if (!fallos.length) state.ultimaSincronizacion = nowLocalInput();
    return fallos.length === 0;
  } catch (e) {
    if (esErrorDeRed(e)) {
      // Sin internet: no es un error. El cambio quedó guardado en este equipo y se
      // enviará automáticamente cuando vuelva la conexión.
      state.offline = true;
    } else {
      console.error("Error guardando en Supabase:", e);
      state.saveError = true;
    }
    return false;
  } finally {
    guardadosEnCurso--;
    // La foto pudo cambiar (registros ya enviados): se actualiza la copia local.
    guardarCacheLocal();
    actualizarBanner();
  }
}

// "Descartar mi cambio": se olvida el cambio de este equipo que Supabase rechazó y
// se vuelve a la versión que hay en el servidor.
async function descartarCambio(claveTablaId) {
  const err = state.erroresSync.find((e) => e.tabla + ":" + e.id === claveTablaId);
  if (!err) return;
  if (!confirm("¿Descartar tu cambio en: " + err.descripcion + "?\n\nSe volverá a mostrar lo que está guardado en el servidor.")) return;
  descartados.add(claveTablaId);
  state.erroresSync = state.erroresSync.filter((e) => e.tabla + ":" + e.id !== claveTablaId);
  state.saveError = state.erroresSync.length > 0;
  actualizarBanner();
  ultimaRecarga = Date.now();
  await loadState({ silencioso: true });
}

// Botón "Sincronizar ahora" del encabezado.
async function sincronizarAhora() {
  if (!state.currentUser || sincronizando) return;
  sincronizando = true;
  const boton = document.getElementById("estado-sync");
  if (boton) boton.innerHTML = icon("clock", 13) + " Sincronizando…";
  try {
    if (contarCambiosPendientes() > 0 && guardadosEnCurso === 0) await persist();
    ultimaRecarga = Date.now();
    await loadState({ silencioso: true });
  } finally {
    sincronizando = false;
    actualizarBanner();
  }
}

// Recarga los datos en segundo plano para ver los cambios de otros equipos.
// Ya NO se salta cuando hay cambios pendientes, ventanas abiertas o alguien
// escribiendo: los datos se actualizan igual (los cambios pendientes se conservan)
// y solo se espera para redibujar la pantalla (ver renderSiSePuede).
async function refrescarDesdeServidor() {
  if (!state.currentUser || state.loading || document.hidden) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) return;
  if (guardadosEnCurso > 0) return;
  await loadState({ silencioso: true });
}

// Ciclo de sincronización: primero intenta enviar lo pendiente y después trae los
// cambios de los otros equipos (aunque algo haya quedado pendiente).
// Nunca corren dos ciclos a la vez, y las recargas por "volver a la ventana" se
// espacian al menos 5 s (al volver se disparan focus y visibilitychange juntos).
let sincronizando = false;
let ultimaRecarga = 0;
const ESPACIO_MIN_RECARGA_MS = 5000;
let ultimasReservas = -1;
async function cicloSincronizacion() {
  if (sincronizando || !state.currentUser || state.loading) return;
  sincronizando = true;
  try {
    const enLinea = !(typeof navigator !== "undefined" && navigator.onLine === false);
    if (enLinea && guardadosEnCurso === 0 && contarCambiosPendientes() > 0) await persist();
    if (enLinea) {
      enviarActividadPendiente();
      // Cada minuto se avisa que el usuario sigue conectado.
      if (Date.now() - ultimaPresencia > 60000) actualizarPresencia(true);
      // Si alguien está mirando Administración → Actividad, se actualiza la lista.
      if (state.tab === "administracion" && state.adminTab === "actividad") cargarActividad();
    }
    // Si a alguna reserva ya le llegó la hora de ingreso, pasa a "Ocupada" en pantalla.
    const reservasAhora = state.rooms.filter(esReservada).length;
    if (reservasAhora !== ultimasReservas) { ultimasReservas = reservasAhora; state.renderPendiente = true; }
    if (enLinea && Date.now() - ultimaRecarga >= ESPACIO_MIN_RECARGA_MS) {
      ultimaRecarga = Date.now();
      await refrescarDesdeServidor();
    } else if (state.renderPendiente) {
      renderSiSePuede();
    }
  } finally {
    sincronizando = false;
  }
}

// Momento de la última tecla escrita en la app: mientras alguien escribe no se
// redibuja la pantalla (se perdería lo que está escribiendo).
let ultimaEscritura = 0;
appEl.addEventListener("input", () => { ultimaEscritura = Date.now(); }, true);
appEl.addEventListener("keydown", () => { ultimaEscritura = Date.now(); }, true);
const ESPERA_TRAS_ESCRIBIR_MS = 15000;

function hayQueEsperarParaDibujar() {
  const hayModal = state.modalRoomId || state.modalUsuarios || state.modalExport || state.modalTurno ||
    state.modalTelefonos || state.modalPagosCaja || state.modalCuentaTx || state.modalAdminRoomId || document.querySelector(".modal-overlay");
  if (hayModal) return true;
  const activo = document.activeElement;
  const enCampo = activo && appEl.contains(activo) && activo.matches("input, textarea, select");
  return !!(enCampo && Date.now() - ultimaEscritura < ESPERA_TRAS_ESCRIBIR_MS);
}

// Redibuja con los datos nuevos si no molesta a nadie; si no, lo deja pendiente
// (se hará al cerrar la ventana o en el siguiente ciclo) y solo actualiza los avisos.
function renderSiSePuede() {
  if (hayQueEsperarParaDibujar()) {
    state.renderPendiente = true;
    actualizarBanner();
  } else {
    renderConservandoPosicion();
  }
}

const REFRESCO_MS = 20000;
setInterval(cicloSincronizacion, REFRESCO_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) cicloSincronizacion(); });
window.addEventListener("focus", cicloSincronizacion);
window.addEventListener("online", cicloSincronizacion);
window.addEventListener("offline", () => { state.offline = true; actualizarBanner(); });

async function initAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) await loadCurrentProfile();
  supabaseClient.auth.onAuthStateChange(async (_event, session) => {
    if (!session) {
      state.currentUser = null;
      state.users = [];
      state.loginSelectedUser = null;
      render();
      return;
    }
    await loadCurrentProfile();
    if (state.currentUser) {
      state.tab = ROLES[state.currentUser.rol].tabs[0] || "habitaciones";
      render();
    }
  });
}

/* ---------- gráficos ----------
   Gráficos en SVG/HTML sin librerías. Reglas que siguen todos:
   - colores fijos por significado (nunca se reasignan al filtrar):
       habitaciones = azul, consumos = naranja, pagos de caja (egresos) = rojo;
   - barras delgadas (máx. 24px) con la punta redondeada y la base recta;
   - leyenda siempre que hay 2 o más series; los textos van en gris/tinta, no en el color de la serie;
   - al pasar el mouse (o tocar) cada barra/punto muestra el detalle (atributo data-tip). */
const VIZ = {
  habitaciones: "#2a78d6",
  consumos: "#eb6834",
  egresos: "#e34948",
  unaSerie: "#2a78d6",
  ink: "#1C2333",
  muted: "#68708A",
  grid: "#E6EAF3",
  base: "#C3CAD9",
};

// Máximo "redondo" del eje y sus marcas (0, 50.000, 100.000…).
function escalaBonita(max, marcas) {
  marcas = marcas || 4;
  if (!(max > 0)) return { max: 1, paso: 1 };
  const bruto = max / marcas;
  const pot = Math.pow(10, Math.floor(Math.log10(bruto)));
  const paso = [1, 2, 2.5, 5, 10].map((m) => m * pot).find((p) => p >= bruto) || 10 * pot;
  return { max: paso * Math.ceil(max / paso), paso };
}

function formatEje(v) {
  const a = Math.abs(v);
  if (a >= 1000000) return (v / 1000000).toLocaleString("es-CO", { maximumFractionDigits: 1 }) + " M";
  if (a >= 1000) return Math.round(v / 1000).toLocaleString("es-CO") + " mil";
  return String(Math.round(v));
}

// Rectángulo con las esquinas de la punta redondeadas (arriba o abajo) y la base recta.
function barraPath(x, y, w, h, haciaArriba) {
  if (h <= 0 || w <= 0) return "";
  const r = Math.min(4, h, w / 2);
  if (haciaArriba) {
    return "M" + x + "," + (y + h) + "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y +
      "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) + "V" + (y + h) + "Z";
  }
  return "M" + x + "," + y + "V" + (y + h - r) + "Q" + x + "," + (y + h) + " " + (x + r) + "," + (y + h) +
    "H" + (x + w - r) + "Q" + (x + w) + "," + (y + h) + " " + (x + w) + "," + (y + h - r) + "V" + y + "Z";
}

function vizLeyenda(series) {
  return '<div class="viz-legend">' +
    series.map((s) => '<span class="viz-key"><span class="viz-swatch" style="background:' + s.color + '"></span>' + esc(s.label) + '</span>').join("") +
  '</div>';
}

function vizVacio(texto) {
  return '<div class="viz-empty">' + esc(texto || "Sin datos para mostrar.") + '</div>';
}

// Columnas apiladas. dias: [{ label, titulo, valores: { clave: número } }]; series: [{ key, label, color }].
// Si hay una serie "abajo" (opts.serieAbajo), se dibuja hacia abajo desde la línea base (egresos).
function vizColumnas(dias, series, opts) {
  opts = opts || {};
  const abajo = opts.serieAbajo || null;
  const arriba = series.filter((s) => !abajo || s.key !== abajo.key);
  const totalArriba = (d) => arriba.reduce((s, se) => s + (Number(d.valores[se.key]) || 0), 0);
  const totalAbajo = (d) => abajo ? (Number(d.valores[abajo.key]) || 0) : 0;
  if (!dias.length || dias.every((d) => totalArriba(d) === 0 && totalAbajo(d) === 0)) return vizVacio(opts.vacio);

  const W = 640, H = opts.alto || 220;
  const pad = { top: 12, right: 8, bottom: 24, left: 52 };
  const innerW = W - pad.left - pad.right, innerH = H - pad.top - pad.bottom;
  // Arriba y abajo comparten el mismo paso de marcas, para que se puedan comparar a simple vista.
  const maxArriba = Math.max(...dias.map(totalArriba));
  const maxAbajo = abajo ? Math.max(...dias.map(totalAbajo)) : 0;
  // opts.enteros: para cantidades (p. ej. traslados) las marcas del eje van de 1 en 1 como mínimo.
  const pasoBase = escalaBonita(Math.max(maxArriba, maxAbajo), maxAbajo > 0 ? 3 : 4).paso;
  const pasoComun = opts.enteros ? Math.max(1, Math.ceil(pasoBase)) : pasoBase;
  // opts.formato: cómo se muestran los valores en el detalle (por defecto, en pesos).
  const fmt = opts.formato || formatCOP;
  const escArriba = { paso: pasoComun, max: Math.max(pasoComun, pasoComun * Math.ceil(maxArriba / pasoComun)) };
  const escAbajo = maxAbajo > 0 ? { paso: pasoComun, max: pasoComun * Math.ceil(maxAbajo / pasoComun) } : { max: 0, paso: 1 };
  const rango = escArriba.max + escAbajo.max;
  const yCero = pad.top + innerH * (escArriba.max / rango);
  const yDe = (v) => yCero - (v / rango) * innerH;
  const slot = innerW / dias.length;
  const bw = Math.min(24, Math.max(4, slot * 0.6));
  const cadaCuanto = Math.ceil(dias.length / 12);

  let grid = "";
  for (let v = 0; v <= escArriba.max + 1e-9; v += escArriba.paso) {
    const y = yDe(v);
    grid += '<line x1="' + pad.left + '" x2="' + (W - pad.right) + '" y1="' + y + '" y2="' + y + '" stroke="' + VIZ.grid + '" stroke-width="1"/>' +
      '<text x="' + (pad.left - 6) + '" y="' + (y + 3) + '" font-size="10" fill="' + VIZ.muted + '" text-anchor="end">' + formatEje(v) + '</text>';
  }
  for (let v = escAbajo.paso; abajo && v <= escAbajo.max + 1e-9; v += escAbajo.paso) {
    const y = yDe(-v);
    grid += '<line x1="' + pad.left + '" x2="' + (W - pad.right) + '" y1="' + y + '" y2="' + y + '" stroke="' + VIZ.grid + '" stroke-width="1"/>' +
      '<text x="' + (pad.left - 6) + '" y="' + (y + 3) + '" font-size="10" fill="' + VIZ.muted + '" text-anchor="end">−' + formatEje(v) + '</text>';
  }

  let marcas = "", etiquetas = "", zonas = "";
  dias.forEach((d, i) => {
    const x = pad.left + i * slot + (slot - bw) / 2;
    // Segmentos hacia arriba, con 2px de separación entre ellos; solo el de arriba lleva punta redondeada.
    let acumulado = 0;
    const visibles = arriba.filter((s) => (Number(d.valores[s.key]) || 0) > 0);
    visibles.forEach((s, j) => {
      const v = Number(d.valores[s.key]) || 0;
      const yTop = yDe(acumulado + v), yBot = yDe(acumulado);
      const hueco = j > 0 ? 2 : 0;
      const h = Math.max(0, yBot - yTop - hueco);
      const esPunta = j === visibles.length - 1;
      marcas += esPunta
        ? '<path d="' + barraPath(x, yTop, bw, h, true) + '" fill="' + s.color + '"/>'
        : '<rect x="' + x + '" y="' + yTop + '" width="' + bw + '" height="' + h + '" fill="' + s.color + '"/>';
      acumulado += v;
    });
    if (abajo && totalAbajo(d) > 0) {
      const h = yDe(-totalAbajo(d)) - yCero;
      marcas += '<path d="' + barraPath(x, yCero + 1, bw, Math.max(0, h - 1), false) + '" fill="' + abajo.color + '"/>';
    }
    if (i % cadaCuanto === 0) {
      etiquetas += '<text x="' + (x + bw / 2) + '" y="' + (H - 6) + '" font-size="10" fill="' + VIZ.muted + '" text-anchor="middle">' + esc(d.label) + '</text>';
    }
    const lineas = [d.titulo || d.label]
      .concat(series.filter((s) => (Number(d.valores[s.key]) || 0) !== 0 || !abajo).map((s) => s.label + ": " + fmt(d.valores[s.key] || 0)));
    if (arriba.length > 1) lineas.push("Total ingresos: " + formatCOP(totalArriba(d)));
    if (abajo) lineas.push("Neto: " + formatCOP(totalArriba(d) - totalAbajo(d)));
    zonas += '<rect class="viz-hit" x="' + (pad.left + i * slot) + '" y="' + pad.top + '" width="' + slot + '" height="' + innerH + '" fill="transparent" data-tip="' + esc(lineas.join("\n")) + '"/>';
  });

  const base = '<line x1="' + pad.left + '" x2="' + (W - pad.right) + '" y1="' + yCero + '" y2="' + yCero + '" stroke="' + VIZ.base + '" stroke-width="1"/>';
  return (series.length > 1 ? vizLeyenda(series) : "") +
    '<svg class="viz-svg" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(opts.titulo || "Gráfico de columnas") + '">' +
      grid + marcas + base + etiquetas + zonas +
    '</svg>';
}

// Línea de porcentaje (0–100 %), con relleno suave y punto final rotulado.
function vizLineaPorcentaje(puntos, opts) {
  opts = opts || {};
  if (!puntos.length) return vizVacio(opts.vacio);
  const W = 640, H = opts.alto || 200;
  const pad = { top: 14, right: 44, bottom: 24, left: 40 };
  const innerW = W - pad.left - pad.right, innerH = H - pad.top - pad.bottom;
  const xDe = (i) => pad.left + (puntos.length === 1 ? innerW / 2 : (i / (puntos.length - 1)) * innerW);
  const yDe = (v) => pad.top + innerH * (1 - Math.max(0, Math.min(100, v)) / 100);
  const color = opts.color || VIZ.unaSerie;
  const cadaCuanto = Math.ceil(puntos.length / 12);

  let grid = "";
  [0, 25, 50, 75, 100].forEach((v) => {
    grid += '<line x1="' + pad.left + '" x2="' + (W - pad.right) + '" y1="' + yDe(v) + '" y2="' + yDe(v) + '" stroke="' + (v === 0 ? VIZ.base : VIZ.grid) + '" stroke-width="1"/>' +
      '<text x="' + (pad.left - 6) + '" y="' + (yDe(v) + 3) + '" font-size="10" fill="' + VIZ.muted + '" text-anchor="end">' + v + '%</text>';
  });
  const linea = puntos.map((p, i) => (i ? "L" : "M") + xDe(i) + "," + yDe(p.valor)).join("");
  const area = linea + "L" + xDe(puntos.length - 1) + "," + yDe(0) + "L" + xDe(0) + "," + yDe(0) + "Z";
  const ult = puntos[puntos.length - 1];
  let etiquetas = "", zonas = "";
  const slot = innerW / Math.max(1, puntos.length - 1);
  puntos.forEach((p, i) => {
    if (i % cadaCuanto === 0) etiquetas += '<text x="' + xDe(i) + '" y="' + (H - 6) + '" font-size="10" fill="' + VIZ.muted + '" text-anchor="middle">' + esc(p.label) + '</text>';
    zonas += '<rect class="viz-hit" x="' + (xDe(i) - slot / 2) + '" y="' + pad.top + '" width="' + slot + '" height="' + innerH + '" fill="transparent" data-tip="' + esc((p.titulo || p.label) + "\n" + (opts.etiqueta || "Valor") + ": " + Math.round(p.valor) + "%" + (p.detalle ? "\n" + p.detalle : "")) + '"/>';
  });
  return '<svg class="viz-svg" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(opts.titulo || "Gráfico de línea") + '">' +
      grid +
      '<path d="' + area + '" fill="' + color + '" fill-opacity="0.10"/>' +
      '<path d="' + linea + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + xDe(puntos.length - 1) + '" cy="' + yDe(ult.valor) + '" r="4.5" fill="' + color + '" stroke="#fff" stroke-width="2"/>' +
      '<text x="' + (xDe(puntos.length - 1) + 8) + '" y="' + (yDe(ult.valor) + 4) + '" font-size="11" font-weight="600" fill="' + VIZ.ink + '">' + Math.round(ult.valor) + '%</text>' +
      etiquetas + zonas +
    '</svg>';
}

// Barras horizontales ordenadas de mayor a menor (una sola serie). items: [{ label, valor, detalle }].
function vizBarrasH(items, opts) {
  opts = opts || {};
  const lista = items.filter((it) => it.valor > 0).sort((a, b) => b.valor - a.valor).slice(0, opts.max || 8);
  if (!lista.length) return vizVacio(opts.vacio);
  const tope = lista[0].valor;
  const total = items.reduce((s, it) => s + Math.max(0, it.valor), 0);
  const formato = opts.formato || formatCOP;
  const color = opts.color || VIZ.unaSerie;
  return '<div class="viz-hbars">' +
    lista.map((it) => {
      const pct = total > 0 ? Math.round((it.valor / total) * 100) : 0;
      return '<div class="viz-hrow" data-tip="' + esc(it.label + "\n" + formato(it.valor) + " (" + pct + "% del total)" + (it.detalle ? "\n" + it.detalle : "")) + '">' +
        '<span class="viz-hlabel">' + esc(it.label) + '</span>' +
        '<span class="viz-htrack"><span class="viz-hbar" style="width:' + Math.max(1.5, (it.valor / tope) * 100) + '%;background:' + color + '"></span></span>' +
        '<span class="viz-hval">' + formato(it.valor) + '</span>' +
      '</div>';
    }).join("") +
  '</div>';
}

// Una barra 100 % dividida en partes (estado de las habitaciones), con leyenda y cantidades.
function vizBarraPartes(partes) {
  const total = partes.reduce((s, p) => s + p.valor, 0);
  if (!total) return vizVacio("Aún no hay habitaciones.");
  return '<div class="viz-parts">' +
      partes.filter((p) => p.valor > 0).map((p) =>
        '<span class="viz-part" style="flex:' + p.valor + ';background:' + p.color + '" data-tip="' + esc(p.label + ": " + p.valor + " (" + Math.round((p.valor / total) * 100) + "%)") + '"></span>'
      ).join("") +
    '</div>' +
    '<div class="viz-parts-legend">' +
      partes.map((p) =>
        '<div class="viz-parts-row"><span class="viz-swatch" style="background:' + p.color + '"></span>' + esc(p.label) +
        '<span class="viz-parts-num">' + p.valor + ' <span style="color:var(--muted);font-weight:400">(' + Math.round((p.valor / total) * 100) + '%)</span></span></div>'
      ).join("") +
    '</div>';
}

// Tooltip compartido: se muestra al pasar el mouse o tocar cualquier elemento con data-tip.
const vizTip = document.createElement("div");
vizTip.className = "viz-tip";
vizTip.setAttribute("role", "tooltip");
document.body.appendChild(vizTip);
function mostrarVizTip(e) {
  const el = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
  if (!el || !(appEl.contains(el) || vizZoom.contains(el))) { vizTip.style.display = "none"; return; }
  vizTip.textContent = el.getAttribute("data-tip");
  vizTip.style.display = "block";
  const x = e.clientX, y = e.clientY;
  const r = vizTip.getBoundingClientRect();
  const left = Math.min(window.innerWidth - r.width - 8, x + 14);
  const top = y + 16 + r.height > window.innerHeight ? y - r.height - 12 : y + 16;
  vizTip.style.left = Math.max(8, left) + "px";
  vizTip.style.top = Math.max(8, top) + "px";
}
document.addEventListener("mousemove", mostrarVizTip);
document.addEventListener("click", mostrarVizTip);
document.addEventListener("scroll", () => { vizTip.style.display = "none"; }, true);

// Ampliar un gráfico: al hacer clic en cualquier gráfico se abre en grande, en una
// ventana encima de la página (con su título, leyenda y detalle al pasar el mouse).
// Se cierra con la X, haciendo clic fuera o con Esc.
const vizZoom = document.createElement("div");
vizZoom.className = "viz-zoom";
vizZoom.setAttribute("role", "dialog");
vizZoom.setAttribute("aria-modal", "true");
vizZoom.style.display = "none";
document.body.appendChild(vizZoom);
function cerrarVizZoom() { vizZoom.style.display = "none"; vizZoom.innerHTML = ""; vizTip.style.display = "none"; }
function abrirVizZoom(panel) {
  const copia = panel.cloneNode(true);
  // En la copia no hay controles (selectores, botones): solo se mira.
  copia.querySelectorAll("select, button, input, form").forEach((x) => x.remove());
  copia.removeAttribute("id");
  copia.classList.add("viz-zoom-panel");
  vizZoom.innerHTML = '<div class="viz-zoom-caja"><button type="button" class="icon-btn viz-zoom-cerrar" title="Cerrar (Esc)">' + icon("x", 20) + '</button></div>';
  vizZoom.querySelector(".viz-zoom-caja").appendChild(copia);
  vizZoom.style.display = "flex";
}
appEl.addEventListener("click", (e) => {
  const t = e.target;
  if (!t || !t.closest) return;
  if (t.closest("select, button, input, textarea, a, label, .modal-overlay")) return;
  const grafico = t.closest(".viz-svg, .viz-hbars, .viz-parts");
  const panel = grafico && grafico.closest(".panel");
  if (panel) abrirVizZoom(panel);
});
vizZoom.addEventListener("click", (e) => {
  if (e.target === vizZoom || (e.target.closest && e.target.closest(".viz-zoom-cerrar"))) cerrarVizZoom();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && vizZoom.style.display !== "none") cerrarVizZoom(); });

/* ---------- datos para los gráficos ---------- */
function diasEntre(desdeKey, hastaKey) {
  const out = [];
  const [y1, m1, d1] = desdeKey.split("-").map(Number);
  const [y2, m2, d2] = hastaKey.split("-").map(Number);
  const d = new Date(y1, m1 - 1, d1), fin = new Date(y2, m2 - 1, d2);
  while (d <= fin) {
    out.push(d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()));
    d.setDate(d.getDate() + 1);
  }
  return out;
}
function diasAtras(n) {
  const d = new Date();
  d.setDate(d.getDate() - (n - 1));
  return diasEntre(d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()), todayKey());
}
// Días del mes elegido (hasta hoy si es el mes actual).
function diasDelMes(mesKey) {
  const [y, m] = mesKey.split("-").map(Number);
  const ultimo = new Date(y, m, 0).getDate();
  const fin = mesKey === todayKey().slice(0, 7) ? todayKey() : mesKey + "-" + pad(ultimo);
  return diasEntre(mesKey + "-01", fin);
}
function etiquetaDia(key) { const [, m, d] = key.split("-"); return Number(d) + "/" + Number(m); }

// Ingresos (habitación por fecha de ingreso + consumos por fecha) y pagos de caja, por día.
function flujoPorDia(dias) {
  const mapa = {};
  dias.forEach((k) => { mapa[k] = { habitaciones: 0, consumos: 0, egresos: 0 }; });
  state.transactions.forEach((t) => { const k = dayKeyOf(t.horaIngreso); if (mapa[k]) mapa[k].habitaciones += Number(t.valor) || 0; });
  state.consumos.forEach((c) => { const k = dayKeyOf(c.fecha); if (mapa[k]) mapa[k].consumos += Number(c.valor) || 0; });
  state.pagosCaja.forEach((p) => { const k = dayKeyOf(p.fecha); if (mapa[k]) mapa[k].egresos += Number(p.valor) || 0; });
  return dias.map((k) => ({ label: etiquetaDia(k), titulo: formatDay(k), valores: mapa[k] }));
}

// Lo mismo que flujoPorDia, pero sumado por mes (los últimos n meses, incluido el actual).
const MESES_NOMBRE = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
function flujoPorMes(n) {
  const hoy = new Date();
  const meses = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    meses.push({ key: d.getFullYear() + "-" + pad(d.getMonth() + 1), mes: d.getMonth(), anio: d.getFullYear() });
  }
  const mapa = {};
  meses.forEach((m) => { mapa[m.key] = { habitaciones: 0, consumos: 0, egresos: 0 }; });
  state.transactions.forEach((t) => { const k = monthKeyOf(t.horaIngreso); if (mapa[k]) mapa[k].habitaciones += Number(t.valor) || 0; });
  state.consumos.forEach((c) => { const k = monthKeyOf(c.fecha); if (mapa[k]) mapa[k].consumos += Number(c.valor) || 0; });
  state.pagosCaja.forEach((p) => { const k = monthKeyOf(p.fecha); if (mapa[k]) mapa[k].egresos += Number(p.valor) || 0; });
  return meses.map((m) => ({ label: MESES_ABREV[m.mes], titulo: MESES_NOMBRE[m.mes] + " " + m.anio, valores: mapa[m.key] }));
}

// % de habitaciones ocupadas cada noche: una estadía ocupa desde el día de ingreso
// hasta el día anterior a la salida (si entra y sale el mismo día, cuenta ese día).
function ocupacionPorDia(dias) {
  const total = state.rooms.length;
  if (!total) return [];
  const hoy = todayKey();
  return dias.map((k) => {
    let ocupadas = 0;
    state.transactions.forEach((t) => {
      const ini = dayKeyOf(t.horaIngreso);
      if (!ini) return;
      const fin = t.estado === "finalizada" ? (dayKeyOf(t.horaSalida) || ini) : (k <= hoy ? "9999-12-31" : ini);
      if (ini <= k && (k < fin || k === ini)) ocupadas++;
    });
    return { label: etiquetaDia(k), titulo: formatDay(k), valor: Math.min(100, (ocupadas / total) * 100), detalle: Math.min(ocupadas, total) + " de " + total + " habitaciones" };
  });
}

// Panel del Resumen: porcentaje de ocupación de cada día del mes actual (hasta hoy)
// y el promedio del mes.
function renderOcupacionDelMes() {
  const mes = todayKey().slice(0, 7);
  const puntos = ocupacionPorDia(diasDelMes(mes));
  const promedio = puntos.length ? Math.round(puntos.reduce((s, p) => s + p.valor, 0) / puntos.length) : 0;
  const mejor = puntos.reduce((m, p) => (!m || p.valor > m.valor ? p : m), null);
  const nombreMes = MESES_NOMBRE[Number(mes.slice(5, 7)) - 1] + " " + mes.slice(0, 4);
  return (
    '<div class="panel" style="margin-bottom:16px">' +
      '<div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px">' +
        '<div><div class="panel-title" style="margin:0">Ocupación del mes — ' + esc(nombreMes) + '</div>' +
          '<div class="panel-sub" style="margin:2px 0 0">Porcentaje de habitaciones ocupadas cada día del mes (hasta hoy).</div></div>' +
        (puntos.length
          ? '<div style="margin-left:auto;text-align:right"><div class="ocupacion-pct">' + promedio + '%</div><div class="muted" style="font-size:12px">promedio del mes' +
              (mejor && mejor.valor > 0 ? ' · día más alto: ' + esc(mejor.label) + ' (' + Math.round(mejor.valor) + '%)' : "") + '</div></div>'
          : "") +
      '</div>' +
      vizLineaPorcentaje(puntos, { etiqueta: "Ocupación", titulo: "Ocupación del mes de " + nombreMes, vacio: "Aún no hay habitaciones registradas." }) +
    '</div>'
  );
}

function sumarPor(lista, claveDe, valorDe) {
  const mapa = {};
  lista.forEach((x) => { const k = claveDe(x); if (k) mapa[k] = (mapa[k] || 0) + (Number(valorDe(x)) || 0); });
  return Object.keys(mapa).map((k) => ({ label: k, valor: mapa[k] }));
}

/* ---------- cálculos derivados ---------- */
function computeStats() {
  const rooms = state.rooms, transactions = state.transactions;
  const total = rooms.length;
  // Una habitación con huésped cuya hora de ingreso aún no llega cuenta como reservada.
  const reservadas = rooms.filter(esReservada).length;
  const ocupadas = rooms.filter((r) => r.status === "ocupada").length - reservadas;
  const vacias = rooms.filter((r) => r.status === "vacia").length;
  const sucias = rooms.filter((r) => r.status === "sucia").length;
  const today = todayKey();
  const thisMonth = today.slice(0, 7);
  const ingresosHoy = transactions.filter((t) => dayKeyOf(t.horaIngreso) === today).reduce((s, t) => s + (Number(t.valor) || 0), 0);
  const ingresosMes = transactions.filter((t) => monthKeyOf(t.horaIngreso) === thisMonth).reduce((s, t) => s + (Number(t.valor) || 0), 0);
  const pendientes = transactions.filter((t) => !estaPagado(t));
  const pendienteMonto = pendientes.reduce((s, t) => s + saldoDe(t), 0);
  const marginalHoy = state.consumos.filter((c) => dayKeyOf(c.fecha) === today).reduce((s, c) => s + (Number(c.valor) || 0), 0);
  const marginalMes = state.consumos.filter((c) => monthKeyOf(c.fecha) === thisMonth).reduce((s, c) => s + (Number(c.valor) || 0), 0);
  return { total, ocupadas, reservadas, vacias, sucias, ingresosHoy, ingresosMes, pendientes: pendientes.length, pendienteMonto, marginalHoy, marginalMes };
}

function consumosOfTransaction(transactionId) {
  return state.consumos.filter((c) => c.transactionId === transactionId);
}

function consumosTotalOf(transactionId) {
  return consumosOfTransaction(transactionId).reduce((s, c) => s + (Number(c.valor) || 0), 0);
}

function isOverdue(guest) {
  if (!guest || !guest.horaSalida) return false;
  return guest.horaSalida < nowLocalInput();
}

function filteredConsumosForMonth() {
  return state.consumos.filter((c) => monthKeyOf(c.fecha) === state.monthFilter);
}

function marginalTotalsOf(filteredConsumos) {
  const total = filteredConsumos.reduce((s, c) => s + (Number(c.valor) || 0), 0);
  return { total, count: filteredConsumos.length };
}


function filteredTxForMonth() {
  return state.transactions.filter((t) => monthKeyOf(t.horaIngreso) === state.monthFilter);
}

function monthTotalsOf(filteredTx) {
  const total = filteredTx.reduce((s, t) => s + (Number(t.valor) || 0), 0);
  const pagado = filteredTx.reduce((s, t) => s + Math.min(montoPagadoDe(t), Number(t.valor) || 0), 0);
  return { total, pagado, pendiente: total - pagado, count: filteredTx.length };
}

function dailySummaryOf(filteredTx) {
  const map = {};
  filteredTx.forEach((t) => { const key = dayKeyOf(t.horaIngreso); map[key] = (map[key] || 0) + (Number(t.valor) || 0); });
  return Object.keys(map).sort().map((day) => ({ day, label: formatDay(day), total: map[day] }));
}

function paymentSummaryOf(filteredTx, filteredConsumos) {
  const map = {};
  filteredTx.forEach((t) => {
    if (Array.isArray(t.formasPago) && t.formasPago.length > 0) {
      t.formasPago.forEach((p) => { if (p.metodo) map[p.metodo] = (map[p.metodo] || 0) + (Number(p.valor) || 0); });
    } else if (t.formaPago) {
      map[t.formaPago] = (map[t.formaPago] || 0) + (Number(t.valor) || 0);
    }
  });
  (filteredConsumos || []).forEach((c) => {
    const metodo = c.formaPago || "Efectivo";
    map[metodo] = (map[metodo] || 0) + (Number(c.valor) || 0);
  });
  return Object.keys(map).map((name) => ({ name, value: map[name], color: PAYMENT_COLORS[name] || "#7C8496" }));
}

// Reúne, para el usuario que tiene la sesión abierta, todo lo que registró
// (check-ins con pago y ventas de consumos) desde que inició sesión hasta
// ahora. Sirve como base para la pantalla y el Excel de cuadre de caja.
function movimientosDelTurno() {
  if (!state.currentUser) return [];
  const desde = state.currentUser.horaInicioSesion || nowLocalInput();
  const nombreUsuario = state.currentUser.nombre || state.currentUser.usuario;
  const movimientos = [];

  state.transactions.forEach((t) => {
    if (t.usuario === nombreUsuario && t.horaIngreso >= desde) {
      const formas = Array.isArray(t.formasPago) && t.formasPago.length
        ? t.formasPago
        : (Number(t.montoPagado) > 0 ? [{ metodo: "Efectivo", valor: t.montoPagado }] : []);
      formas.forEach((p) => {
        if (Number(p.valor) > 0) {
          movimientos.push({
            fecha: t.horaIngreso, tipo: "Check-in", habitacion: t.roomNumber,
            huesped: t.nombre || "—", detalle: "Pago de habitación",
            formaPago: p.metodo || "Efectivo", valor: Number(p.valor) || 0,
          });
        }
      });
    }
  });

  state.consumos.forEach((c) => {
    if (c.usuario === nombreUsuario && c.fecha >= desde) {
      const tx = state.transactions.find((t) => t.id === c.transactionId);
      movimientos.push({
        fecha: c.fecha, tipo: "Venta", habitacion: c.roomNumber,
        huesped: (tx && tx.nombre) || "—", detalle: c.descripcion || "Consumo",
        formaPago: c.formaPago || "Efectivo", valor: Number(c.valor) || 0,
      });
    }
  });

  // Pagos que este usuario hizo desde la caja: restan del cuadre (valor negativo).
  // Cuenta la hora en que se registró (aunque al pago se le ponga otra fecha).
  state.pagosCaja.forEach((p) => {
    if (p.usuario === nombreUsuario && ((p.registradoEl || p.fecha) >= desde)) {
      movimientos.push({
        fecha: p.fecha, tipo: "Pago de caja", habitacion: "—",
        huesped: p.beneficiario || "—", detalle: p.concepto || "Pago",
        formaPago: p.formaPago || "Efectivo", valor: -(Number(p.valor) || 0),
      });
    }
  });

  return movimientos.sort((a, b) => (a.fecha < b.fecha ? 1 : -1));
}

function resumenPorFormaPago(movimientos) {
  const map = {};
  movimientos.forEach((m) => { map[m.formaPago] = (map[m.formaPago] || 0) + m.valor; });
  return Object.keys(map).map((k) => ({ formaPago: k, total: map[k] }));
}

function exportarTurnoExcel() {
  if (!state.currentUser) return;
  const movimientos = movimientosDelTurno();
  const resumen = resumenPorFormaPago(movimientos);
  const total = movimientos.reduce((s, m) => s + m.valor, 0);

  const data = movimientos.map((m) => ({
    "Hora": formatDateTime(m.fecha),
    "Tipo": m.tipo,
    "Habitación": m.habitacion,
    "Persona/Empresa": m.huesped,
    "Detalle": m.detalle,
    "Forma de pago": m.formaPago,
    "Valor": m.valor,
  }));

  const resumenData = [
    { "Concepto": "Usuario", "Valor": state.currentUser.nombre || state.currentUser.usuario },
    { "Concepto": "Turno desde", "Valor": formatDateTime(state.currentUser.horaInicioSesion) },
    { "Concepto": "Turno hasta", "Valor": formatDateTime(nowLocalInput()) },
    { "Concepto": "", "Valor": "" },
    { "Concepto": "Ingresos (check-ins y ventas)", "Valor": movimientos.filter((m) => m.valor > 0).reduce((s, m) => s + m.valor, 0) },
    { "Concepto": "Pagos desde la caja", "Valor": movimientos.filter((m) => m.tipo === "Pago de caja").reduce((s, m) => s + m.valor, 0) },
    { "Concepto": "", "Valor": "" },
    { "Concepto": "Neto por forma de pago:", "Valor": "" },
  ].concat(
    resumen.map((r) => ({ "Concepto": r.formaPago, "Valor": r.total })),
    [{ "Concepto": "", "Valor": "" }, { "Concepto": "TOTAL NETO DEL TURNO (ingresos - pagos de caja)", "Valor": total }]
  );

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, hojaSegura(resumenData), "Resumen");
  if (data.length) XLSX.utils.book_append_sheet(wb, hojaSegura(data), "Movimientos");

// Calcula cuánto tiempo falta (o cuánto lleva vencida) la hora de salida
// prevista de un huésped, para la sección de Teléfonos de huéspedes.
function tiempoRestante(horaSalida) {
  if (!horaSalida) return { texto: "Sin definir", vencido: false, sinDefinir: true };
  const salida = new Date(horaSalida);
  if (isNaN(salida.getTime())) return { texto: "Sin definir", vencido: false, sinDefinir: true };
  const diffMs = salida.getTime() - Date.now();
  const vencido = diffMs < 0;
  const abs = Math.abs(diffMs);
  const horas = Math.floor(abs / 3600000);
  const minutos = Math.floor((abs % 3600000) / 60000);
  const partes = (horas > 0 ? horas + "h " : "") + minutos + "m";
  const texto = vencido ? "Vencido hace " + partes : partes + " restantes";
  return { texto, vencido, sinDefinir: false };
}

// Teléfonos de todos los huéspedes hospedados ahora mismo, con el tiempo que
// les queda (o que llevan vencidos) según la hora de salida registrada.
function telefonosHospedados() {
  return state.rooms
    .filter((r) => r.status === "ocupada" && r.guest)
    .map((r) => {
      const g = r.guest;
      const t = tiempoRestante(g.horaSalida);
      return {
        habitacion: r.number,
        nombre: g.nombre || "—",
        telefono: g.telefono || "—",
        acompanantes: getAcompanantes(g).filter((a) => a.nombre || a.telefono),
        horaSalida: g.horaSalida || "",
        tiempoTexto: t.texto,
        vencido: t.vencido,
        sinDefinir: t.sinDefinir,
      };
    })
    .sort((a, b) => (a.habitacion > b.habitacion ? 1 : -1));
}

function renderCuentaHuespedModal() {
  const t = state.transactions.find((x) => String(x.id) === String(state.modalCuentaTx));

  const consumos = consumosOfTransaction(t.id).slice().sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
  const totalConsumos = consumos.reduce((s, c) => s + (Number(c.valor) || 0), 0);
  const consumosSinPagar = consumos.filter((c) => c.pagado === false).reduce((s, c) => s + (Number(c.valor) || 0), 0);
  const pagadoHospedaje = montoPagadoDe(t);
  const saldoHospedaje = Math.max(0, d.total - pagadoHospedaje);
  const totalCuenta = d.total + totalConsumos;
  const saldoTotal = saldoHospedaje + consumosSinPagar;
  const pagos = detalleFormasPago(t.formasPago) === "—" && t.formaPago ? t.formaPago : detalleFormasPago(t.formasPago);
  const fila = (etiqueta, valor, clase) => '<div class="pay-summary-row' + (clase ? " " + clase : "") + '"><span>' + etiqueta + '</span><span>' + valor + '</span></div>';
  return (
    '<div class="modal-overlay" data-action="close-overlay">' +
