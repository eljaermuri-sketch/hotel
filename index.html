    const consumosTotal = consumos.reduce((s, c) => s + (Number(c.valor) || 0), 0);
    summaryEl.innerHTML = renderPaySummary({ valor: total, formasPago }, consumos, consumosTotal);
  }
}

function submitGuest(form) {
  if (!puede("editHabitaciones")) return;
  const roomId = form.dataset.roomId;
  const room = state.rooms.find((r) => r.id === roomId);
  if (!room) return;
  const errorEl = document.getElementById("guest-form-error");
  const mostrarError = (msg) => { if (errorEl) errorEl.textContent = msg; };
  mostrarError("");

  const fd = new FormData(form);

  const vNombre = validarTexto(fd.get("nombre"), { etiqueta: "El nombre", maxLength: 100 });
  if (!vNombre.ok) { mostrarError(vNombre.error); return; }
  const vTipoDocumento = validarOpcion(fd.get("tipoDocumento"), opcionesDocumento(DOCUMENT_TYPES, room.guest && room.guest.tipoDocumento), { etiqueta: "El tipo de documento" });
  if (!vTipoDocumento.ok) { mostrarError(vTipoDocumento.error); return; }
  const vCedula = validarCodigo(fd.get("cedula"), { etiqueta: "El número de documento", maxLength: 20 });
  if (!vCedula.ok) { mostrarError(vCedula.error); return; }
  const vNacionalidad = validarTexto(fd.get("nacionalidad"), { etiqueta: "La nacionalidad", maxLength: 60, requerido: false });
  if (!vNacionalidad.ok) { mostrarError(vNacionalidad.error); return; }
  const vCiudad = validarTexto(fd.get("ciudad"), { etiqueta: "La ciudad", maxLength: 60, requerido: false });
  if (!vCiudad.ok) { mostrarError(vCiudad.error); return; }
  const vTelefono = validarCodigo(fd.get("telefono"), { etiqueta: "El teléfono", maxLength: 20, requerido: false, pattern: /^[0-9+\-\s()]{5,20}$/ });
  if (!vTelefono.ok) { mostrarError(vTelefono.error); return; }
  const vPlaca = validarCodigo(String(fd.get("placa") || "").toUpperCase(), { etiqueta: "La placa vehicular", maxLength: 10, requerido: false, pattern: /^[A-Z0-9\-\s]{3,10}$/ });
  if (!vPlaca.ok) { mostrarError(vPlaca.error); return; }
  const vPersonas = validarNumero(fd.get("personas"), { etiqueta: "La cantidad de personas", min: 1, max: 50, porDefecto: 1 });
  if (!vPersonas.ok) { mostrarError(vPersonas.error); return; }
  if (!Number.isInteger(vPersonas.value)) { mostrarError("La cantidad de personas debe ser un número entero."); return; }
  if (vPersonas.value > capacidadDe(room)) {
    mostrarError("La habitación " + room.number + " tiene capacidad para " + capacidadDe(room) + " persona(s). Si necesitas más, aumenta la capacidad en la tarjeta de la habitación.");
    return;
  }

  // Datos de las demás personas: un bloque por cada persona registrada además de la principal.
  const acompanantes = [];
  for (let i = 0; i < vPersonas.value - 1; i++) {
    const cual = "la persona " + (i + 2);
    const vN = validarTexto(fd.get("acN_" + i), { etiqueta: "El nombre de " + cual, maxLength: 100, requerido: false });
    if (!vN.ok) { mostrarError(vN.error); return; }
    const vT = validarOpcion(fd.get("acT_" + i), opcionesDocumento(DOCUMENT_TYPES, ((room.guest && getAcompanantes(room.guest)[i]) || {}).tipoDocumento), { etiqueta: "El tipo de documento de " + cual, requerido: false });
    if (!vT.ok) { mostrarError(vT.error); return; }
    const vC = validarCodigo(fd.get("acC_" + i), { etiqueta: "El documento de " + cual, maxLength: 20, requerido: false });
    if (!vC.ok) { mostrarError(vC.error); return; }
    const vP = validarCodigo(fd.get("acP_" + i), { etiqueta: "El teléfono de " + cual, maxLength: 20, requerido: false, pattern: /^[0-9+\-\s()]{5,20}$/ });
    if (!vP.ok) { mostrarError(vP.error); return; }
    const vNac = validarTexto(fd.get("acNac_" + i), { etiqueta: "La nacionalidad de " + cual, maxLength: 60, requerido: false });
    if (!vNac.ok) { mostrarError(vNac.error); return; }
    const vCiu = validarTexto(fd.get("acCiu_" + i), { etiqueta: "La ciudad de " + cual, maxLength: 60, requerido: false });
    if (!vCiu.ok) { mostrarError(vCiu.error); return; }
    acompanantes.push({ nombre: vN.value, tipoDocumento: vT.value, cedula: vC.value, telefono: vP.value, nacionalidad: vNac.value, ciudad: vCiu.value });
  }
  // Menores de edad (no cuentan para la capacidad; la edad es obligatoria para saber si se cobran).
  const menores = [];
  if (fd.get("hayMenores") === "si") {
    const vCant = validarNumero(fd.get("cantidadMenores"), { etiqueta: "La cantidad de menores", min: 1, max: MAX_MENORES, requerido: true });
    if (!vCant.ok) { mostrarError(vCant.error); return; }
    if (!Number.isInteger(vCant.value)) { mostrarError("La cantidad de menores debe ser un número entero."); return; }
    for (let i = 0; i < vCant.value; i++) {
      const cual = vCant.value === 1 ? "el menor" : "el menor " + (i + 1);
      const vN = validarTexto(fd.get("mnN_" + i), { etiqueta: "El nombre de " + cual, maxLength: 100, requerido: false });
      if (!vN.ok) { mostrarError(vN.error); return; }
      const vE = validarNumero(fd.get("mnE_" + i), { etiqueta: "La edad de " + cual, min: 0, max: 17, requerido: true });
      if (!vE.ok) { mostrarError(vE.error); return; }
      if (!Number.isInteger(vE.value)) { mostrarError("La edad de " + cual + " debe ser un número entero de años."); return; }
      const vT = validarOpcion(fd.get("mnT_" + i), DOCUMENT_TYPES_MENORES, { etiqueta: "El tipo de documento de " + cual, requerido: false });
      if (!vT.ok) { mostrarError(vT.error); return; }
      const vC = validarCodigo(fd.get("mnC_" + i), { etiqueta: "El documento de " + cual, maxLength: 20, requerido: false });
      if (!vC.ok) { mostrarError(vC.error); return; }
      const vNac = validarTexto(fd.get("mnNac_" + i), { etiqueta: "El país de " + cual, maxLength: 60, requerido: false });
      if (!vNac.ok) { mostrarError(vNac.error); return; }
      const vCiu = validarTexto(fd.get("mnCiu_" + i), { etiqueta: "La ciudad de " + cual, maxLength: 60, requerido: false });
      if (!vCiu.ok) { mostrarError(vCiu.error); return; }
      menores.push({ nombre: vN.value, edad: vE.value, tipoDocumento: vT.value, cedula: vC.value, nacionalidad: vNac.value, ciudad: vCiu.value });
    }
  }
  const opcionesFacturarA = ["principal"].concat(acompanantes.map((_, i) => valorFacturarAcomp(i)));
  const vFacturarA = validarOpcion(fd.get("facturarA"), opcionesFacturarA, { etiqueta: "A nombre de quién va el recibo de caja", requerido: false });
  if (!vFacturarA.ok) { mostrarError(vFacturarA.error); return; }
  const vHoraIngreso = validarFechaHora(fd.get("horaIngreso"), { etiqueta: "La hora de ingreso", requerido: true });
  if (!vHoraIngreso.ok) { mostrarError(vHoraIngreso.error); return; }
  const vHoraSalida = validarFechaHora(fd.get("horaSalida"), { etiqueta: "La hora de salida", requerido: false });
  if (!vHoraSalida.ok) { mostrarError(vHoraSalida.error); return; }
  const vValorDia = validarNumero(fd.get("valorDia"), { etiqueta: "El valor por día", min: 0, max: 999999999, requerido: true });
  if (!vValorDia.ok) { mostrarError(vValorDia.error); return; }
  const vMetodo1 = validarOpcion(fd.get("formaPago1"), PAYMENT_METHODS, { etiqueta: "La forma de pago 1" });
  if (!vMetodo1.ok) { mostrarError(vMetodo1.error); return; }
  const vMonto1 = validarNumero(fd.get("montoPago1"), { etiqueta: "El monto de la forma de pago 1", min: 0, max: 999999999 });
  if (!vMonto1.ok) { mostrarError(vMonto1.error); return; }
  const vMetodo2 = validarOpcion(fd.get("formaPago2"), PAYMENT_METHODS, { etiqueta: "La forma de pago 2", requerido: false });
  if (!vMetodo2.ok) { mostrarError(vMetodo2.error); return; }
  const vMonto2 = validarNumero(fd.get("montoPago2"), { etiqueta: "El monto de la forma de pago 2", min: 0, max: 999999999 });
  if (!vMonto2.ok) { mostrarError(vMonto2.error); return; }

  const horaIngreso = vHoraIngreso.value || nowLocalInput();
  const horaSalida = vHoraSalida.value || "";
  // Valor por día FIJO según el tipo de habitación. Una estadía ya registrada conserva
  // el valor y el tipo de tarifa con los que se registró (aunque luego la cambien de
  // habitación). Si el tipo no tiene tarifa, se usa lo que se escribió.
  const tipoTarifa = (room.guest && room.guest.tipoTarifa) || room.tipo;
  const tarifa = tarifaDe(tipoTarifa);
  const valorDiaNum = room.guest && Number(room.guest.valorDia) > 0
    ? Number(room.guest.valorDia)
    : (tarifa ? tarifa.valorDia : vValorDia.value);
  const dias = calcularDias(horaIngreso, horaSalida);
  // Descuento y su motivo: solo el administrador los escribe; para los demás se
  // conservan los que ya tenía la estadía.
  let descuento = room.guest ? (Number(room.guest.descuento) || 0) : 0;
  let motivoDescuento = room.guest ? (room.guest.motivoDescuento || "") : "";
  if (puede("ponerDescuento")) {
    const vDescuento = validarNumero(fd.get("descuento"), { etiqueta: "El descuento", min: 0, max: 999999999, porDefecto: 0 });
    if (!vDescuento.ok) { mostrarError(vDescuento.error); return; }
    descuento = Math.round(vDescuento.value);
    const vMotivo = validarTexto(fd.get("motivoDescuento"), { etiqueta: "El motivo del descuento", maxLength: 150, requerido: false });
    if (!vMotivo.ok) { mostrarError(vMotivo.error); return; }
    motivoDescuento = descuento > 0 ? vMotivo.value : "";
    if (descuento > 0 && !motivoDescuento) { mostrarError("Escribe el motivo del descuento."); return; }
  }
  const calcValor = calcularValorEstadia(valorDiaNum, dias, vPersonas.value, descuento, tipoTarifa, menores);
  const brutoEstadia = calcValor.habitacion + calcValor.valorAdicionales + calcValor.valorMenores;
  if (descuento > brutoEstadia) {
    mostrarError("El descuento no puede ser mayor que el valor de la estadía (" + formatCOP(brutoEstadia) + ").");
    return;
  }
  const valorTotal = calcValor.total;

  const formasPago = [];
  if (vMetodo1.value) formasPago.push({ metodo: vMetodo1.value, valor: vMonto1.value });
  if (vMetodo2.value) formasPago.push({ metodo: vMetodo2.value, valor: vMonto2.value });
  const metodosPago = formasPago.map((p) => p.metodo);

  const montoPagado = formasPago.reduce((s, p) => s + (Number(p.valor) || 0), 0);

  const guestData = {
    nombre: vNombre.value,
    tipoDocumento: vTipoDocumento.value,
    cedula: vCedula.value,
    nacionalidad: vNacionalidad.value,
    ciudad: vCiudad.value,
    telefono: vTelefono.value,
    placa: vPlaca.value.replace(/\s+/g, ""),
    personas: vPersonas.value,
    acompanantes,
    // Primera "otra persona" también en los campos de siempre (compatibilidad con el resto de la app).
    acompNombre: (acompanantes[0] && acompanantes[0].nombre) || "",
    acompTipoDocumento: (acompanantes[0] && acompanantes[0].tipoDocumento) || "",
    acompCedula: (acompanantes[0] && acompanantes[0].cedula) || "",
    acompTelefono: (acompanantes[0] && acompanantes[0].telefono) || "",
    facturarA: vFacturarA.value || "principal",
    horaIngreso,
    horaSalida,
    valorDia: valorDiaNum,
    dias,
    valorHabitacion: calcValor.habitacion,
    valorAdicionales: calcValor.valorAdicionales,
    menores,
    valorMenores: calcValor.valorMenores,
    descuento: calcValor.descuento,
    motivoDescuento,
    tipoTarifa,
    // Ya no se suma IVA: se limpian los campos del cálculo anterior.
    valorSubtotal: null,
    valorIva: null,
    valor: valorTotal,
    formasPago,
    metodosPago,
    montoPagado,
    pagado: montoPagado >= valorTotal && valorTotal > 0,
  };

  const nombreUsuarioActual = state.currentUser ? (state.currentUser.nombre || state.currentUser.usuario) : "";

  if (!room.guest) {
    const transactionId = genId("tx");
    room.status = "ocupada";
    room.guest = Object.assign({}, guestData, { transactionId, usuario: nombreUsuarioActual });
    state.transactions.push(Object.assign({ id: transactionId, roomId: room.id, roomNumber: room.number, tipoHabitacion: room.tipo, estado: "activa", usuario: nombreUsuarioActual }, guestData));
  } else {
    const transactionId = room.guest.transactionId;
    const usuarioOriginal = room.guest.usuario || nombreUsuarioActual;
    room.guest = Object.assign({}, guestData, { transactionId, usuario: usuarioOriginal });
    const tx = state.transactions.find((t) => t.id === transactionId);
    if (tx) Object.assign(tx, guestData, { tipoHabitacion: room.tipo, usuario: usuarioOriginal });
  }
  closeModal();
  persist();
}

function finalizarEstadia(roomId) {
  if (!puede("editHabitaciones")) return;
  const room = state.rooms.find((r) => r.id === roomId);
  if (!room || !room.guest) return;
  const transactionId = room.guest.transactionId;
  const tx = state.transactions.find((t) => t.id === transactionId);
  const horaSalidaFinal = room.guest.horaSalida || nowLocalInput();
  const valorDia = room.guest.valorDia || 0;
  const dias = calcularDias(room.guest.horaIngreso, horaSalidaFinal);
  const calcValor = valorDia ? calcularValorEstadia(valorDia, dias, room.guest.personas, room.guest.descuento, room.guest.tipoTarifa || room.tipo, menoresDe(room.guest)) : null;
  const valorTotal = calcValor ? calcValor.total : room.guest.valor;
  if (tx) {
    tx.estado = "finalizada";
    tx.horaSalida = horaSalidaFinal;
    tx.dias = dias;
    tx.valor = valorTotal;
    if (calcValor) {
      tx.valorHabitacion = calcValor.habitacion;
      tx.valorAdicionales = calcValor.valorAdicionales;
      tx.valorMenores = calcValor.valorMenores;
      tx.valorSubtotal = null;
      tx.valorIva = null;
    }
    tx.usuarioCheckout = state.currentUser ? (state.currentUser.nombre || state.currentUser.usuario) : "";
  }
  // Se genera el recibo de caja con los datos ya cerrados de la estadía (hora de
  // salida y valor final), antes de borrar al huésped de la habitación.
  const guestFinal = Object.assign({}, room.guest, {
    horaSalida: horaSalidaFinal, dias, valor: valorTotal,
    valorHabitacion: calcValor ? calcValor.habitacion : room.guest.valorHabitacion,
    valorAdicionales: calcValor ? calcValor.valorAdicionales : room.guest.valorAdicionales,
    valorMenores: calcValor ? calcValor.valorMenores : room.guest.valorMenores,
  });
  construirReciboPDF(room, guestFinal);
  room.status = "sucia";
  room.limpia = false;
  // Al salir el huésped, la habitación deja de estar lista hasta que la revisen.
  if (state.dbLista) room.lista = false;
  room.guest = null;
  closeModal();
  persist();
}

function cancelarRegistro(roomId) {
  if (!puede("editHabitaciones")) return;
  const room = state.rooms.find((r) => r.id === roomId);
  if (!room || !room.guest) return;
  const transactionId = room.guest.transactionId;
  recordarNombreAntesDeBorrar("transacciones", transactionId);
  state.consumos.filter((c) => c.transactionId === transactionId).forEach((c) => recordarNombreAntesDeBorrar("consumos", c.id));
  registrarActividad("Canceló el registro", (room.guest.nombre || "Huésped") + " (hab. " + room.number + ")");
  state.transactions = state.transactions.filter((t) => t.id !== transactionId);
  state.consumos = state.consumos.filter((c) => c.transactionId !== transactionId);
  room.status = "vacia";
  room.guest = null;
  closeModal();
  persist();
}

function cambiarHabitacion(roomId, nuevaHabitacionId) {
  if (!puede("editHabitaciones")) return;
  const origen = state.rooms.find((r) => r.id === roomId);
  if (!origen || !origen.guest) return;
  if (!nuevaHabitacionId) { alert("Elige la habitación a la que se va a mover el huésped."); return; }
  const destino = state.rooms.find((r) => r.id === nuevaHabitacionId);
  if (!destino) return;
  if (destino.status !== "vacia") { alert("La habitación destino no está disponible."); return; }
  if (!habitacionLista(destino)) { alert("La habitación " + destino.number + " no está lista para recibir huésped."); return; }
  const personasGuest = Number(origen.guest.personas) || 1;
  if (personasGuest > capacidadDe(destino)) {
    alert("La habitación " + destino.number + " tiene capacidad para " + capacidadDe(destino) + " persona(s) y hay " + personasGuest + " hospedadas. Aumenta su capacidad o elige otra habitación.");
    return;
  }
  const confirmado = window.confirm(
    "¿Mover a " + (origen.guest.nombre || "el huésped") + " de la habitación " + origen.number + " a la habitación " + destino.number + "?"
  );
  if (!confirmado) return;

  const transactionId = origen.guest.transactionId;
  const tx = state.transactions.find((t) => t.id === transactionId);

  // Queda registrado el traslado (se ve en Administración).
  state.traslados.push({
    id: genId("traslado"),
    fecha: nowLocalInput(),
    transactionId: transactionId || "",
    huesped: origen.guest.nombre || "",
    deHabitacion: String(origen.number),
    aHabitacion: String(destino.number),
    usuario: state.currentUser ? (state.currentUser.nombre || state.currentUser.usuario) : "",
  });

  destino.guest = origen.guest;
  destino.status = "ocupada";

  origen.guest = null;
  origen.status = "sucia";
  origen.limpia = false;

  if (tx) {
    tx.roomId = destino.id;
    tx.roomNumber = destino.number;
    tx.tipoHabitacion = destino.tipo;
  }
  state.consumos.forEach((c) => {
    if (c.transactionId === transactionId) {
      c.roomId = destino.id;
      c.roomNumber = destino.number;
    }
  });

  state.modalRoomId = destino.id;
  render();
  persist();
}

function markClean(roomId) {
  if (!puede("editLimpieza") && !puede("editHabitaciones")) return;
  const room = state.rooms.find((r) => r.id === roomId);
  if (!room) return;
  room.status = "vacia";
  room.limpia = true;
  render();
  persist();
}

function toggleLimpieza(roomId) {
  if (!puede("editLimpieza") && !puede("editHabitaciones")) return;
  const room = state.rooms.find((r) => r.id === roomId);
  if (!room) return;
  room.limpia = !room.limpia;
  if (room.limpia && room.status === "sucia") room.status = "vacia";
  render();
  persist();
}

function changeRoomType(roomId, tipo) {
  if (!puede("editTipoCapacidad")) return;
  const room = state.rooms.find((r) => r.id === roomId);
  if (!room) return;
  room.tipo = tipo;
  persist();
}

function changeRoomCapacity(roomId, valor) {
  if (!puede("editTipoCapacidad")) return;
  const room = state.rooms.find((r) => r.id === roomId);
  if (!room) return;
  const n = Number(valor);
  if (!Number.isInteger(n) || n < 1 || n > 50) {
    alert("La capacidad debe ser un número entero entre 1 y 50.");
    render();
    return;
  }
  const hospedadas = room.guest ? (Number(room.guest.personas) || 1) : 0;
  if (n < hospedadas) {
    alert("En la habitación " + room.number + " hay " + hospedadas + " persona(s) hospedada(s); la capacidad no puede ser menor.");
    render();
    return;
  }
  room.capacidad = n;
  render();
  persist();
}

// Solo el creador puede eliminar habitaciones (permiso borrarHabitaciones).
function deleteRoom(roomId) {
  if (!puede("borrarHabitaciones")) return;
  const room = state.rooms.find((r) => r.id === roomId);
  if (!room || room.status === "ocupada") return;
  if (!confirm("¿Eliminar la habitación " + room.number + "?\n\nEsta acción no se puede deshacer.")) return;
  recordarNombreAntesDeBorrar("habitaciones", roomId);
  state.rooms = state.rooms.filter((r) => r.id !== roomId);
  render();
  persist();
}

function togglePagado(txId) {
  const tx = state.transactions.find((t) => t.id === txId);
  if (!tx) return;
  tx.pagado = !tx.pagado;
  const room = state.rooms.find((r) => r.guest && r.guest.transactionId === txId);
  if (room) room.guest.pagado = tx.pagado;
  render();
  persist();
}

function addConsumo(form) {
  if (!puede("editHabitaciones")) return;
  const roomId = form.dataset.roomId;
  const room = state.rooms.find((r) => r.id === roomId);
  if (!room || !room.guest) return;
  const fd = new FormData(form);
  const idsValidos = state.inventario.map((i) => i.id).concat(["__manual__"]);
  const vItemId = validarOpcion(fd.get("itemId"), idsValidos, { etiqueta: "El producto" });
  if (!vItemId.ok) { alert(vItemId.error); return; }
  const vCantidad = validarNumero(fd.get("cantidad"), { etiqueta: "La cantidad", min: 1, max: 100000, porDefecto: 1 });
  if (!vCantidad.ok) { alert(vCantidad.error); return; }
  const vFormaPago = validarOpcion(fd.get("formaPago"), PAYMENT_METHODS, { etiqueta: "El modo de pago" });
  if (!vFormaPago.ok) { alert(vFormaPago.value ? vFormaPago.error : "Elige el modo de pago del consumo."); return; }
  const itemId = vItemId.value;
  const cantidad = Math.max(1, vCantidad.value);
  const formaPago = vFormaPago.value;
  let descripcion = "";
  let valorUnit = 0;
  let inventarioId = null;
  let ivaConsumo = 19;

  if (itemId === "__manual__") {
    const vDesc = validarTexto(fd.get("descripcionManual"), { etiqueta: "La descripción", maxLength: 100 });
    if (!vDesc.ok) { alert(vDesc.error); return; }
    const vValorManual = validarNumero(fd.get("valorManual"), { etiqueta: "El valor unitario", min: 0, max: 999999999, requerido: true });
    if (!vValorManual.ok) { alert(vValorManual.error); return; }
    descripcion = vDesc.value;
    valorUnit = vValorManual.value;
  } else {
    const item = state.inventario.find((i) => i.id === itemId);
    if (!item) return;
    if (Number(item.stock) < cantidad) {
      alert("Stock insuficiente de " + item.nombre + ". Disponible: " + item.stock);
      return;
    }
    descripcion = item.nombre;
    valorUnit = Number(item.precio) || 0;
    inventarioId = item.id;
    ivaConsumo = ivaPctProducto(item);
    item.stock = Number(item.stock) - cantidad;
  }

  state.consumos.push({
    id: genId("consumo"),
    transactionId: room.guest.transactionId,
    roomId: room.id,
    roomNumber: room.number,
    inventarioId,
    descripcion,
    cantidad,
    valorUnit,
    valor: valorUnit * cantidad,
    iva: ivaConsumo,
    formaPago,
    pagado: fd.get("consumoPagado") === "on",
    fecha: nowLocalInput(),
    usuario: state.currentUser ? (state.currentUser.nombre || state.currentUser.usuario) : "",
  });
  render();
  persist();
}

function toggleConsumoPagado(consumoId, checked) {
  if (!puede("editHabitaciones")) return;
  const c = state.consumos.find((x) => x.id === consumoId);
  if (!c) return;
  c.pagado = !!checked;
  render();
  persist();
}

function changeConsumoPago(consumoId, metodo) {
  if (!puede("editHabitaciones")) return;
  const c = state.consumos.find((x) => x.id === consumoId);
  if (!c) return;
  const v = validarOpcion(metodo, PAYMENT_METHODS, { etiqueta: "El modo de pago" });
  if (!v.ok) { alert(v.error); render(); return; }
  c.formaPago = v.value;
  render();
  persist();
}

function deleteConsumo(consumoId) {
  if (!puede("editHabitaciones")) return;
  const consumo = state.consumos.find((c) => c.id === consumoId);
  if (consumo) recordarNombreAntesDeBorrar("consumos", consumoId);
  if (consumo && consumo.inventarioId) {
    const item = state.inventario.find((i) => i.id === consumo.inventarioId);
    if (item) item.stock = Number(item.stock) + (Number(consumo.cantidad) || 1);
  }
  state.consumos = state.consumos.filter((c) => c.id !== consumoId);
  render();
  persist();
}

/* ---------- inventario ---------- */
/* ---------- precio de venta = costo + % de utilidad ----------
   Cada producto de venta tiene un COSTO y un PORCENTAJE DE UTILIDAD sobre ese costo;
   el precio de venta se calcula solo: precio = costo × (1 + utilidad / 100).
   Ej.: costo $2.000 con 50 % de utilidad → precio $3.000 (ganancia $1.000).
   Cada cambio de costo o de utilidad queda en el historial del producto, para la
   gráfica de cómo han cambiado el costo, el precio y la ganancia. */
function precioDesdeCosto(costo, utilidad) {
  return Math.round((Number(costo) || 0) * (1 + (Number(utilidad) || 0) / 100));
}
function tieneCosto(item) { return item && item.costo != null && item.costo !== "" && !isNaN(Number(item.costo)); }
function anotarHistorialPrecio(item) {
  const historial = Array.isArray(item.historial) ? item.historial : [];
  item.historial = historial.concat({
    fecha: nowLocalInput(),
    costo: Number(item.costo) || 0,
    utilidad: Number(item.utilidad) || 0,
    precio: Number(item.precio) || 0,
    usuario: state.currentUser ? (state.currentUser.nombre || state.currentUser.usuario) : "",
  }).slice(-200);
}
// Costo que tenía el producto en una fecha (para calcular la ganancia de ventas viejas).
function costoEnFecha(item, fecha) {
  const hist = (Array.isArray(item.historial) ? item.historial : []).filter((h) => h.fecha <= fecha);
  if (hist.length) return Number(hist[hist.length - 1].costo) || 0;
  return tieneCosto(item) ? Number(item.costo) : null;
}
// Cambia el costo y/o el % de utilidad de un producto ya agregado y recalcula su precio.
function actualizarCostoUtilidad(itemId, campo, valor) {
  if (!puede("editInventario")) return;
  const item = state.inventario.find((i) => i.id === itemId);
  if (!item) return;
  const v = campo === "costo"
    ? validarNumero(valor, { etiqueta: "El costo", min: 0, max: 999999999, requerido: true })
    : validarNumero(valor, { etiqueta: "El porcentaje de utilidad", min: 0, max: 1000, requerido: true });
  if (!v.ok) { alert(v.error); renderConservandoPosicion(); return; }
  if (campo === "costo") item.costo = Math.round(v.value); else item.utilidad = Math.round(v.value * 100) / 100;
  if (!tieneCosto(item)) { renderConservandoPosicion(); persist(); return; }
  if (item.utilidad == null) item.utilidad = 0;
  item.precio = precioDesdeCosto(item.costo, item.utilidad);
  anotarHistorialPrecio(item);
  renderConservandoPosicion();
  persist();
}

function addInventarioItem() {

  if (!vCategoria.ok) { errorEl.textContent = vCategoria.error; return; }
  const vCosto = validarNumero(costoEl.value, { etiqueta: "El costo del producto", min: 0, max: 999999999, requerido: true });
  if (!vCosto.ok) { errorEl.textContent = vCosto.error; return; }
  const vUtilidad = validarNumero(utilidadEl.value, { etiqueta: "El porcentaje de utilidad", min: 0, max: 1000, requerido: true });
  if (!vUtilidad.ok) { errorEl.textContent = vUtilidad.error; return; }
  const vStock = validarNumero(stockEl.value, { etiqueta: "El stock", min: 0, max: 999999 });
  if (!vStock.ok) { errorEl.textContent = vStock.error; return; }
  const vMinimo = validarNumero(minimoEl.value, { etiqueta: "El stock mínimo", min: 0, max: 999999 });
  if (!vMinimo.ok) { errorEl.textContent = vMinimo.error; return; }

  const nombre = vNombre.value;
  if (state.inventario.some((i) => i.nombre.toLowerCase() === nombre.toLowerCase())) {
    errorEl.textContent = "Ya existe un producto con ese nombre."; return;

// Cambia el % de IVA de un producto (no cambia su precio: el IVA ya va incluido).
function cambiarIvaProducto(itemId, valor) {
  if (!puede("editInventario")) return;
  const item = state.inventario.find((i) => i.id === itemId);
  if (!item) return;
  const n = Number(valor);
  if (IVA_OPCIONES_PRODUCTO.indexOf(n) === -1) return;
  item.iva = n;
  renderConservandoPosicion();
  persist();
}

function ajustarStock(itemId, delta) {
  if (!puede("editInventario")) return;
  if (delta < 0) return; // el inventario no se puede disminuir manualmente
  const item = state.inventario.find((i) => i.id === itemId);
  if (!item) return;
  item.stock = Math.max(0, Number(item.stock) + delta);
  render();
  persist();
}

function setStock(itemId, value) {
  if (!puede("editInventario")) return;
  const item = state.inventario.find((i) => i.id === itemId);
  if (!item) return;
  const actual = Number(item.stock) || 0;
  const nuevo = Math.max(0, Number(value) || 0);
  if (nuevo < actual) {
    alert("No se puede disminuir el inventario manualmente. El stock solo baja automáticamente cuando un huésped compra un producto en la sección de Habitaciones.");
    render();
    return;
  }
  item.stock = nuevo;
  persist();
}

function normalizeKey(k) {
  return String(k).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
}

// Limpia una celda de un Excel/CSV importado: quita caracteres de control, recorta
// longitud y neutraliza cualquier etiqueta/código sospechoso (no se descarta la fila
// completa por una celda problemática; solo esa celda se reemplaza).
function sanitizeCellValue(v, maxLength) {
  let value = stripControlChars(v == null ? "" : v);
  if (MALICIOUS_PATTERN.test(value)) return "[contenido bloqueado]";
  const max = maxLength || 500;
  if (value.length > max) value = value.slice(0, max);
  return value;
}

function pickField(fila, nombres) {
  const keys = Object.keys(fila);
  for (const n of nombres) {
    const found = keys.find((k) => normalizeKey(k) === n);
    if (found) return fila[found];
  }
  return undefined;
}

function handleImportInventario(file) {
  if (!puede("editInventario")) return;
  const errorEl = document.getElementById("inv-error");
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
      const filas = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
      if (filas.length === 0) { if (errorEl) errorEl.textContent = "El archivo no contiene filas."; return; }
      let nuevos = 0, actualizados = 0, omitidos = 0;
      filas.forEach((fila) => {
        const vNombre = validarTexto(pickField(fila, ["producto", "nombre", "item", "articulo"]), { etiqueta: "nombre", maxLength: 80, requerido: false });
        if (!vNombre.ok || !vNombre.value) { omitidos++; return; }
        const vCategoria = validarTexto(pickField(fila, ["categoria", "tipo"]), { etiqueta: "categoría", maxLength: 40, requerido: false });
        const nombre = vNombre.value;
        const categoria = (vCategoria.ok && vCategoria.value) || "General";
        const precioExcel = Math.min(999999999, Math.max(0, Number(pickField(fila, ["precio", "precio venta", "precio de venta", "valor"])) || 0));
        // Si el Excel trae costo y % de utilidad, el precio se calcula con ellos.
        const costoBruto = pickField(fila, ["costo", "costo unitario", "precio costo", "precio de costo"]);
        const utilBruta = pickField(fila, ["utilidad", "% utilidad", "porcentaje utilidad", "porcentaje de utilidad", "margen"]);
        const costo = costoBruto !== undefined && costoBruto !== "" ? Math.min(999999999, Math.max(0, Math.round(Number(costoBruto) || 0))) : null;
        const utilidad = utilBruta !== undefined && utilBruta !== "" ? Math.min(1000, Math.max(0, Number(String(utilBruta).replace("%", "")) || 0)) : null;
        const stock = Math.min(999999, Math.max(0, Number(pickField(fila, ["stock", "cantidad", "stock actual", "existencias"])) || 0));
        const minimo = Math.min(999999, Math.max(0, Number(pickField(fila, ["stock minimo", "minimo", "min"])) || 0));
        const existente = state.inventario.find((i) => i.nombre.toLowerCase() === nombre.toLowerCase());
        const item = existente || { id: genId("inv"), nombre, historial: [] };
        item.categoria = categoria;
        item.stock = stock;
        item.minimo = minimo || item.minimo || 0;
        if (costo != null) item.costo = costo;
        if (utilidad != null) item.utilidad = utilidad;
        if (tieneCosto(item)) {
          if (item.utilidad == null) item.utilidad = 0;
          item.precio = precioDesdeCosto(item.costo, item.utilidad);
          anotarHistorialPrecio(item);
        } else {
          item.precio = precioExcel || item.precio || 0;
        }
        if (existente) actualizados++;
        else { state.inventario.push(item); nuevos++; }
      });
      render();
      persist();
      const msg = document.getElementById("inv-error");
      if (msg) {
        msg.style.color = "var(--ok)";
        msg.textContent = nuevos + " producto(s) nuevo(s), " + actualizados + " actualizado(s)" + (omitidos ? ", " + omitidos + " fila(s) sin nombre omitida(s)" : "") + ".";
      }
    } catch (err) {
      if (errorEl) errorEl.textContent = "No se pudo leer el archivo. Verifica que sea un Excel o CSV válido.";
    }
  };
  reader.onerror = () => { if (errorEl) errorEl.textContent = "Error al leer el archivo."; };
  reader.readAsArrayBuffer(file);
}

function handleImportFile(file) {
  if (!puede("editContabilidad")) return;
  const errorEl = document.getElementById("import-error");
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
      let agregadas = 0;
      const nombreArchivo = sanitizeCellValue(file.name, 150) || "archivo importado";
      wb.SheetNames.forEach((sheetName) => {
        const filas = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: "" });
        if (filas.length === 0) return;
        const filasLimpias = filas.slice(0, 500).map((fila) => {
          const limpia = {};
          Object.keys(fila).forEach((k) => {
            const key = sanitizeCellValue(k, 60) || k;
            limpia[key] = sanitizeCellValue(fila[k], 500);
          });
          return limpia;
        });
        const nueva = {
          id: genId("hist"),
          nombre: nombreArchivo,
          hoja: sanitizeCellValue(sheetName, 60),
          filas: filasLimpias,
          importadoEl: nowLocalInput(),
        };
        state.historico.push(nueva);
        // Al terminar, la mini sección se abre mostrando la primera hoja importada.
        if (agregadas === 0) { state.historicoAbierto = true; state.hojaHistoricoId = nueva.id; }
        agregadas++;
      });
      if (agregadas === 0) {
        if (errorEl) errorEl.textContent = "El archivo no contiene datos legibles.";
        return;
      }
      if (errorEl) errorEl.textContent = "";
      render();
      persist();
    } catch (err) {
      if (errorEl) errorEl.textContent = "No se pudo leer el archivo. Verifica que sea un Excel o CSV válido.";
    }
  };
  reader.onerror = () => {
    if (errorEl) errorEl.textContent = "Error al leer el archivo.";
  };
  reader.readAsArrayBuffer(file);
}

        "IVA habitación (19% incluido)": d.ivaHabitacion,
        "Personas adicionales": d.personasAdicionales,
        "Menores cobrados (> 8 años)": d.menoresCobrados,
        "Valor personas adicionales": d.adicional,
        "IVA adicionales (19% incluido)": d.ivaAdicional,
        "Descuento": Number(t.descuento) || 0,
        "Motivo del descuento": t.motivoDescuento || "",
        "Total cobrado": d.total,
      };
    });
    if (ivaData.length) {
      const suma = (k) => ivaData.reduce((s, r) => s + (Number(r[k]) || 0), 0);
      ivaData.push({
        "Huésped": "TOTALES", "Habitación": "", "Cédula": "", "Cómo pagó": "",
        "Valor habitación (sin IVA)": suma("Valor habitación (sin IVA)"), "IVA habitación (19% incluido)": suma("IVA habitación (19% incluido)"),
        "Personas adicionales": suma("Personas adicionales"), "Valor personas adicionales": suma("Valor personas adicionales"),
        "IVA adicionales (19% incluido)": suma("IVA adicionales (19% incluido)"), "Descuento": suma("Descuento"), "Motivo del descuento": "",
        "Total cobrado": suma("Total cobrado"),
      });
    }
    XLSX.utils.book_append_sheet(wb, hojaSegura(ivaData.length ? ivaData : [{ "Sin datos": "No hay transacciones en este rango" }]), "Habitación y IVA");
    hojas++;
  }

  if (seleccion.consumos) {
    const consumosData = filteredConsumos.slice().sort((a, b) => (a.fecha < b.fecha ? -1 : 1)).map((c) => ({
      "Fecha": formatDateTime(c.fecha),
      "Habitación": c.roomNumber,
      "Producto": c.descripcion,
      "Cantidad": Number(c.cantidad) || 1,
      "Valor unitario": Number(c.valorUnit != null ? c.valorUnit : c.valor) || 0,
      "Cómo pagó": c.formaPago || "Efectivo",
      "Pagado": c.pagado === false ? "No" : "Sí",
      "% IVA": ivaPctConsumo(c),
      "IVA": ivaIncluidoPct(c.valor, ivaPctConsumo(c)),
      "Valor sin IVA": (Number(c.valor) || 0) - ivaIncluidoPct(c.valor, ivaPctConsumo(c)),
      "Total": Number(c.valor) || 0,
    }));
    XLSX.utils.book_append_sheet(wb, hojaSegura(consumosData.length ? consumosData : [{ "Sin datos": "No hay consumos en este rango" }]), "Consumos extra");
    hojas++;
  }

  if (seleccion.pagosCaja) {
    const pagosData = filteredPagosCaja.slice().sort((a, b) => (a.fecha < b.fecha ? -1 : 1)).map((p) => ({
      "Fecha": formatDateTime(p.fecha),
      "Concepto": p.concepto,
      "Pagado a": p.beneficiario || "",
      "Categoría": p.categoria || "",
      "N° de soporte": p.soporte || "",
      "Modo de pago": p.formaPago || "",
      "Registró": p.usuario || "",
    "Editado por": p.editadoPor ? p.editadoPor + (p.editadoEl ? " (" + formatDateTime(p.editadoEl) + ")" : "") : "",
      "Valor": Number(p.valor) || 0,
    }));
    if (pagosData.length) pagosData.push({ "Fecha": "", "Concepto": "TOTAL PAGOS DE CAJA", "Pagado a": "", "Categoría": "", "N° de soporte": "", "Modo de pago": "", "Registró": "", "Valor": totalPagosCaja(filteredPagosCaja) });
    XLSX.utils.book_append_sheet(wb, hojaSegura(pagosData.length ? pagosData : [{ "Sin datos": "No hay pagos de caja en este rango" }]), "Pagos de caja");
    hojas++;
  }

  if (seleccion.inventario) {
    const inventarioData = state.inventario.map((i) => ({
      "Producto": i.nombre,
      "Categoría": i.categoria || "General",
      "Costo": tieneCosto(i) ? Number(i.costo) : "",
      "% Utilidad": i.utilidad != null ? Number(i.utilidad) : "",
      "Precio de venta": Number(i.precio) || 0, "% IVA": ivaPctProducto(i), "IVA incluido": ivaIncluidoPct(i.precio, ivaPctProducto(i)), "Precio sin IVA": (Number(i.precio) || 0) - ivaIncluidoPct(i.precio, ivaPctProducto(i)),
      "Ganancia por unidad": tieneCosto(i) ? (Number(i.precio) || 0) - Number(i.costo) : "",
      "Stock actual": Number(i.stock) || 0,
      "Stock mínimo": Number(i.minimo) || 0,
      "Valor en stock": (Number(i.precio) || 0) * (Number(i.stock) || 0),
    }));
    XLSX.utils.book_append_sheet(wb, hojaSegura(inventarioData.length ? inventarioData : [{ "Sin datos": "No hay productos" }]), "Inventario");
    hojas++;
  }

  if (seleccion.resumen) {
    const summaryRows = daily.map((d) => ({ "Día": d.label, "Ingresos": d.total }));
    summaryRows.push({ "Día": "", "Ingresos": "" });
    summaryRows.push({ "Día": "Rango exportado", "Ingresos": formatDateTime(desdeKey) + " → " + formatDateTime(hastaKey) });
    summaryRows.push({ "Día": "TOTAL DEL RANGO", "Ingresos": totals.total });
    summaryRows.push({ "Día": "Total pagado", "Ingresos": totals.pagado });
    summaryRows.push({ "Día": "Total pendiente", "Ingresos": totals.pendiente });
    summaryRows.push({ "Día": "Ingresos marginales (consumos extra)", "Ingresos": marginalTotals.total });
    summaryRows.push({ "Día": "Pagos desde la caja (egresos)", "Ingresos": -totalPagosCaja(filteredPagosCaja) });
    XLSX.utils.book_append_sheet(wb, hojaSegura(summaryRows), "Resumen diario");
    hojas++;
  }

  if (hojas === 0) { alert("Elige al menos una tabla para exportar."); return; }

  const nombreArchivo = "contabilidad-hotel-" + desdeKey.slice(0, 10) + "_a_" + hastaKey.slice(0, 10) + ".xlsx";
  XLSX.writeFile(wb, nombreArchivo);
}

function submitExportForm(form) {
  const tipo = form.dataset.tipo || "contabilidad";
  const errorEl = document.getElementById("export-error");
  const fd = new FormData(form);
  const desde = fd.get("desde") || "";

  if (tipo === "inventario") {
    const vDesde = validarFechaHora(desde, { etiqueta: "La fecha 'Desde'", requerido: false });
    if (!vDesde.ok) { if (errorEl) errorEl.textContent = vDesde.error; return; }
    exportInventarioExcel(vDesde.value);
    closeExportModal();
    return;
  }

  if (!puede("exportContabilidad")) return;
  const hasta = fd.get("hasta");
  if (!desde || !hasta) { if (errorEl) errorEl.textContent = "Elige la fecha y hora de inicio y de fin."; return; }
  if (desde > hasta) { if (errorEl) errorEl.textContent = "La fecha 'Desde' no puede ser posterior a 'Hasta'."; return; }
  const seleccion = {
    transacciones: fd.get("tabla_transacciones") === "on",
    deudores: fd.get("tabla_deudores") === "on",
    iva: fd.get("tabla_iva") === "on",
    consumos: fd.get("tabla_consumos") === "on",
    pagosCaja: fd.get("tabla_pagos_caja") === "on",
    inventario: fd.get("tabla_inventario") === "on",
    resumen: fd.get("tabla_resumen") === "on",
  };
  if (!Object.values(seleccion).some(Boolean)) {
    if (errorEl) errorEl.textContent = "Elige al menos una tabla para exportar.";
    return;
  }
  exportExcel(desde, hasta, seleccion);
  closeExportModal();
}

appEl.addEventListener("input", (e) => {
  const form = e.target.closest && e.target.closest("#guest-form");
  if (form && e.target.name && ["valorDia", "horaIngreso", "horaSalida", "montoPago1", "montoPago2", "personas", "descuento"].includes(e.target.name)) {
    updateTotalPreview(form);
  }
  // Menores de edad: mostrar/ocultar sus campos según "¿Va a registrar menores?" y la cantidad.
  if (e.target && (e.target.id === "input-hay-menores" || e.target.id === "input-menores")) {
    const formEl = e.target.closest("#guest-form");
    const hay = formEl.querySelector("#input-hay-menores").value === "si";
    const cantInput = formEl.querySelector("#input-menores");
    let n = Math.floor(Number(cantInput.value)) || 0;
    if (n > MAX_MENORES) { n = MAX_MENORES; cantInput.value = n; }
    if (hay && n < 1) n = 1;
    const box = formEl.querySelector("#menores-box");
    const actuales = leerMenoresDelDOM(box);
    formEl.querySelector("#campo-cantidad-menores").style.display = hay ? "block" : "none";
    box.style.display = hay ? "block" : "none";
    box.innerHTML = hay ? renderMenoresFields(n, actuales) : "";
    updateTotalPreview(formEl);
  }
  if (form && e.target.name && /^mnE_\d+$/.test(e.target.name)) updateTotalPreview(form);
  if (e.target && e.target.id === "input-personas") {
    // No se puede escribir más personas que la capacidad de la habitación.
    const maximo = Number(e.target.max) || 0;
    if (maximo && Number(e.target.value) > maximo) {
      e.target.value = maximo;
      const err = document.getElementById("guest-form-error");
      if (err) err.textContent = "Esta habitación tiene capacidad para " + maximo + " persona(s). No se pueden registrar más.";
    }
    const box = document.getElementById("acompanante-box");
    if (box) {
      const n = Math.max(1, Math.min(50, Math.floor(Number(e.target.value)) || 1));
      const actual = leerAcompanantesDelDOM(box);
      const formEl = e.target.closest("#guest-form");
      const nombrePrincipal = formEl && formEl.elements["nombre"] ? formEl.elements["nombre"].value : "";
      box.style.display = n >= 2 ? "block" : "none";
      box.innerHTML = n >= 2 ? renderAcompanantesFields(n, actual.lista, actual.facturarA, nombrePrincipal) : "";
    }
  }
  if (e.target && e.target.id === "buscador-huespedes") {
    filtrarHabitacionesPorTexto(e.target.value);
  }
  if (e.target && (e.target.id === "inv-costo" || e.target.id === "inv-utilidad" || e.target.id === "inv-iva")) {
    // Vista previa del precio de venta (y su IVA) mientras se escribe el costo y el % de utilidad.
    const costo = Number((document.getElementById("inv-costo") || {}).value);
    const util = Number((document.getElementById("inv-utilidad") || {}).value);
    const pctIva = Number((document.getElementById("inv-iva") || {}).value) || 0;
    const prev = document.getElementById("inv-precio-preview");
    if (prev) {
      const precio = precioDesdeCosto(costo, util || 0);
      const iva = ivaIncluidoPct(precio, pctIva);
      prev.innerHTML = costo > 0
        ? 'Precio de venta: <strong style="color:var(--ink)">' + formatCOP(precio) + '</strong> · ganancia por unidad ' + formatCOP(precio - Math.round(costo)) +
          ' · IVA ' + textoPctIva(pctIva) + ': ' + formatCOP(iva) + ' · precio sin IVA <strong style="color:var(--ink)">' + formatCOP(precio - iva) + '</strong>'
        : "Precio de venta: escribe el costo y el % de utilidad.";
    }
  }
  if (e.target && e.target.id === "buscar-contabilidad") {
    // Se redibuja Contabilidad con el filtro y se devuelve el cursor al buscador.
    const pos = e.target.selectionStart;
    state.buscarContabilidad = e.target.value.slice(0, 60);
    state.ocultarSugerencias = false;
    state.txResaltada = null;
    renderConservandoPosicion();
    const input = document.getElementById("buscar-contabilidad");
    if (input) { input.focus(); try { input.setSelectionRange(pos, pos); } catch (err) { /* sin cursor */ } }
  }
});

// Filtra las tarjetas de habitación por nombre de huésped o número, sin
// volver a renderizar el árbol completo (así el campo de búsqueda nunca
// pierde el foco mientras se escribe).
function filtrarHabitacionesPorTexto(texto) {
  const q = normalizarBusqueda(stripControlChars(texto));
  const grupos = appEl.querySelectorAll("[data-floor-group]");
  grupos.forEach((grupo) => {
    let algunoVisible = false;
    grupo.querySelectorAll("[data-room-card]").forEach((card) => {
      const nombre = card.getAttribute("data-guest") || "";
      const numero = card.getAttribute("data-room-number") || "";
      const visible = !q || nombre.indexOf(q) !== -1 || numero.indexOf(q) !== -1;
      card.style.display = visible ? "" : "none";
      if (visible) algunoVisible = true;
    });
    grupo.style.display = algunoVisible ? "" : "none";
  });
}

/* ---------- inicio ---------- */
(async function boot() {
  await initAuth();
  await loadState();
})();
</script>
