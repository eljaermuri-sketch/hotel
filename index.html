        '</div>' +
        '<p class="modal-sub">Hab. ' + esc(t.roomNumber || "—") + (t.tipoHabitacion ? " · Tipo " + esc(t.tipoHabitacion) : "") +
          ' · ' + esc(docAbbrev(tipoDocumentoDe(t))) + ' ' + esc(t.cedula || "—") +
          ' · ' + (t.estado === "finalizada" ? "Finalizada" : "Activa") + '</p>' +
        '<div class="muted" style="font-size:12.5px;margin-bottom:12px">' +
          'Ingreso: ' + formatDateTime(t.horaIngreso) + ' · Salida: ' + (t.horaSalida ? formatDateTime(t.horaSalida) : "en curso") +
          ' · ' + (t.dias || 1) + ' día(s) × ' + formatCOP(t.valorDia) + ' · ' + (Number(t.personas) || 1) + ' persona(s)' +
        '</div>' +
        '<div class="consumos-title">Hospedaje</div>' +
        fila("Habitación", formatCOP(d.habitacion + (Number(t.descuento) || 0))) +
        (d.adicional > 0 ? fila("Personas adicionales (" + d.textoAdicionales + ")", formatCOP(d.adicional)) : "") +
        (Number(t.descuento) > 0 ? fila("Descuento", "− " + formatCOP(t.descuento)) : "") +
        fila("Total hospedaje", formatCOP(d.total), "total") +
        '<div class="consumos-title" style="margin-top:14px">Gastos / consumos (' + consumos.length + ')</div>' +
        (consumos.length === 0

          : consumos.map((c) =>
              '<div class="pay-summary-row"><span>' + esc(c.descripcion || "Consumo") + (Number(c.cantidad) > 1 ? " ×" + esc(c.cantidad) : "") +
                ' <span class="muted" style="font-size:11px">· ' + formatDateTime(c.fecha) + ' · ' + esc(c.formaPago || "Efectivo") +
                (c.pagado === false ? ' · <strong style="color:var(--bad)">sin pagar</strong>' : "") + '</span></span>' +
                '<span>' + formatCOP(c.valor) + '</span></div>'
            ).join("") + fila("Total consumos", formatCOP(totalConsumos), "total")) +

    { label: "Por limpiar", valor: st.sucias, color: STATUS.sucia.color },
  ];
  const reservas = state.rooms.filter(esReservada)
    .sort((a, b) => (a.guest.horaIngreso < b.guest.horaIngreso ? -1 : 1));
  // Personas hospedadas ahora (sin contar las reservas que aún no llegan).
  const hospedadas = state.rooms.filter((r) => r.status === "ocupada" && r.guest && !esReservada(r));
  const adultos = hospedadas.reduce((s, r) => s + (Number(r.guest.personas) || 1), 0);
  const menores = hospedadas.reduce((s, r) => s + menoresDe(r.guest).length, 0);
  return (
    '<div class="panel ocupacion-box">' +
      '<div>' +
        '<div class="panel-title" style="margin-bottom:6px">Ocupación actual</div>' +
        '<div class="ocupacion-pct">' + pct + '%</div>' +
        '<div class="muted" style="font-size:12px;margin-top:4px">' + st.ocupadas + ' de ' + st.total + ' habitación(es) ocupada(s)</div>' +
        '<div class="personas-hospedadas">' + icon("user", 14) + ' <strong>' + (adultos + menores) + '</strong> persona(s) hospedada(s)' +
          '<span class="muted"> · ' + adultos + ' adulto(s)' + (menores ? ' y ' + menores + ' menor(es)' : "") + '</span></div>' +
        '<div class="ocupacion-barra" role="img" aria-label="Ocupadas ' + st.ocupadas + ', reservadas ' + st.reservadas + ', vacías ' + st.vacias + ', por limpiar ' + st.sucias + '">' +
          partes.filter((p) => p.valor > 0).map((p) => '<span style="width:' + (p.valor / st.total * 100) + '%;background:' + p.color + '" title="' + p.label + ': ' + p.valor + '"></span>').join("") +
        '</div>' +
        '<div class="ocupacion-leyenda">' +
          partes.map((p) => '<span><i style="background:' + p.color + '"></i>' + p.label + ' ' + p.valor + '</span>').join("") +
        '</div>' +
      '</div>' +
      '<div>' +
        '<div class="panel-title" style="margin-bottom:8px">Habitaciones reservadas (' + reservas.length + ')</div>' +
        (reservas.length === 0
          ? '<div class="muted" style="font-size:13px">No hay reservas. Al registrar un huésped con una hora de ingreso futura, la habitación aparece aquí como reservada.</div>'
          : '<div class="reservas-lista">' +
              reservas.map((r) =>
                '<button type="button" class="reserva-item" data-action="ir-a-habitacion" data-num="' + esc(normalizarBusqueda(r.number)) + '">' +
                  '<strong>Hab. ' + esc(r.number) + '</strong>' +
                  '<span>' + esc(r.guest.nombre || "Sin nombre") + '</span>' +
                  '<span class="muted" style="margin-left:auto">' + icon("clock", 12) + ' Llega ' + formatDateTime(r.guest.horaIngreso) + '</span>' +
                '</button>'
              ).join("") +
            '</div>') +
      '</div>' +
    '</div>'
  );
}

/* ---------- pagos desde la caja (egresos) ---------- */
function pagosCajaOrdenados(lista) {
  return lista.slice().sort((a, b) => (a.fecha < b.fecha ? 1 : -1));
}
function totalPagosCaja(lista) {
  return lista.reduce((s, p) => s + (Number(p.valor) || 0), 0);
}
// Explica en palabras simples por qué Supabase no deja usar la tabla pagos_caja.
function motivoTablaPagosCaja() {
  const e = state.errorPagosCaja;
  if (!e) {
    return state.offline
      ? "No se ha podido comprobar porque no hay conexión a internet."
      : "No se ha podido comprobar todavía: la app está usando la copia guardada en este equipo (puede haber cambios pendientes que no se lograron enviar).";
  }
  const texto = (e.code + " " + e.message).toLowerCase();
  if (e.code === "PGRST205" || e.code === "42P01" || texto.includes("schema cache") || texto.includes("does not exist")) {
    return "Supabase dice que no encuentra la tabla. Revisa que se creó con el nombre exacto pagos_caja en el esquema public. Si ya existe, ejecuta en el editor SQL: notify pgrst, 'reload schema';";
  }
  if (e.code === "42501" || texto.includes("permission denied")) {
    return "Supabase niega el permiso para leer la tabla. Ejecuta en el editor SQL: grant select, insert, update, delete on public.pagos_caja to authenticated;";
  }
  if (e.code === "42703" || texto.includes("column")) {
    return "A la tabla le falta alguna columna (por ejemplo fecha). Compárala con el SQL de creación.";
  }
  if (texto.includes("infinite recursion") || texto.includes("policy")) {
    return "Hay un problema con las políticas (RLS) de la tabla. Revisa la política \"pagos_caja por rol\".";
  }
  return "Supabase respondió con un error.";
}

function avisoTablaPagosCaja() {
  if (state.dbPagosCaja) return "";
  const e = state.errorPagosCaja;
  return '<div class="readonly-note" style="background:var(--warn-bg);color:#7A5A12;display:block;border-radius:10px;line-height:1.5;padding:9px 12px">' +
    '<div style="display:flex;align-items:center;gap:6px;font-weight:600">' + icon("alert", 13) + ' Los pagos de caja aún no se pueden guardar en Supabase</div>' +
    '<div style="margin-top:4px">Por ahora se guardan solo en este equipo y se enviarán solos en cuanto se resuelva. ' + esc(motivoTablaPagosCaja()) + '</div>' +
    (e ? '<div style="margin-top:4px;font-family:ui-monospace,monospace;font-size:11px;opacity:.85">Detalle técnico: ' + esc((e.code ? e.code + " — " : "") + e.message) + '</div>' : "") +
    '<button type="button" class="btn-secondary btn-inline" style="margin-top:8px;padding:4px 10px;font-size:12px" data-action="recomprobar-pagos-caja">Comprobar de nuevo</button>' +
  '</div>';
}

// Vuelve a cargar todo desde Supabase (envía primero lo pendiente) para comprobar la tabla.

// Descarga un Excel con los pagos de caja indicados y su total.
function exportarPagosCajaExcel(lista, sufijoArchivo) {
  if (!window.XLSX) { alert("No se pudo cargar el generador de Excel. Revisa tu conexión a internet."); return; }
  const ordenados = lista.slice().sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
  if (ordenados.length === 0) { alert("No hay pagos de caja para exportar."); return; }
  const data = ordenados.map((p) => ({
    "Fecha": formatDateTime(p.fecha),
    "Concepto": p.concepto,
    "Pagado a": p.beneficiario || "",
    "Categoría": p.categoria || "",
    "N° de soporte": p.soporte || "",
    "Modo de pago": p.formaPago || "",
    "Registró": p.usuario || "",
    "Editado por": p.editadoPor ? p.editadoPor + (p.editadoEl ? " (" + formatDateTime(p.editadoEl) + ")" : "") : "",
    "Valor": Number(p.valor) || 0,
  }));
  data.push({ "Fecha": "", "Concepto": "TOTAL", "Pagado a": "", "Categoría": "", "N° de soporte": "", "Modo de pago": "", "Registró": "", "Valor": totalPagosCaja(ordenados) });
  const porCategoria = {};
  ordenados.forEach((p) => { const k = p.categoria || "Otro"; porCategoria[k] = (porCategoria[k] || 0) + (Number(p.valor) || 0); });
  const resumen = Object.keys(porCategoria).sort((a, b) => porCategoria[b] - porCategoria[a]).map((k) => ({ "Categoría": k, "Total": porCategoria[k] }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, hojaSegura(data), "Pagos de caja");
  XLSX.utils.book_append_sheet(wb, hojaSegura(resumen), "Por categoría");
  XLSX.writeFile(wb, "pagos-caja-" + sufijoArchivo + ".xlsx");
}

function addPagoCaja(form) {
  if (!puede("editHabitaciones")) return;
  const errorEl = document.getElementById("pago-caja-error");
  const mostrarError = (msg) => { if (errorEl) errorEl.textContent = msg; };
  const fd = new FormData(form);
  const vConcepto = validarTexto(fd.get("concepto"), { etiqueta: "El concepto", maxLength: 120 });
  if (!vConcepto.ok) { mostrarError(vConcepto.error); return; }
  const vBenef = validarTexto(fd.get("beneficiario"), { etiqueta: "Pagado a", maxLength: 100, requerido: false });
  if (!vBenef.ok) { mostrarError(vBenef.error); return; }
  const vCategoria = validarOpcion(fd.get("categoria"), CATEGORIAS_PAGO_CAJA, { etiqueta: "La categoría" });
  if (!vCategoria.ok) { mostrarError(vCategoria.error); return; }
  const vSoporte = validarCodigo(fd.get("soporte"), { etiqueta: "El N° de soporte", maxLength: 40, requerido: false, pattern: /^[A-Za-z0-9À-ÖØ-öø-ÿñÑ.\-\/#\s]+$/ });
  if (!vSoporte.ok) { mostrarError(vSoporte.error); return; }
  const vValor = validarNumero(fd.get("valor"), { etiqueta: "El valor", min: 1, max: 999999999, requerido: true });
  if (!vValor.ok) { mostrarError(vValor.error); return; }
  const vMetodo = validarOpcion(fd.get("formaPago"), PAYMENT_METHODS, { etiqueta: "El modo de pago" });
  if (!vMetodo.ok) { mostrarError(vMetodo.error); return; }
  const vFecha = validarFechaHora(fd.get("fecha"), { etiqueta: "La fecha", requerido: true });
  if (!vFecha.ok) { mostrarError(vFecha.error); return; }

  // Edición: se cambian los datos del pago, pero se conservan su id, quién lo
  // registró y cuándo (eso no se puede modificar).
  if (state.editandoPagoCajaId) {
    if (!puedeEditarPagosCaja()) return;
    const pago = state.pagosCaja.find((p) => p.id === state.editandoPagoCajaId);
    state.editandoPagoCajaId = null;
    if (!pago) { renderConservandoPosicion(); return; }
    Object.assign(pago, {
      fecha: vFecha.value.slice(0, 16),
      concepto: vConcepto.value,
      beneficiario: vBenef.value,
      categoria: vCategoria.value,
      soporte: vSoporte.value,
      valor: Math.round(vValor.value),
      formaPago: vMetodo.value,
      editadoPor: state.currentUser.nombre || state.currentUser.usuario,
      editadoEl: nowLocalInput(),
    });
    renderConservandoPosicion();
    persist();
    return;
  }

  state.pagosCaja.push({
    id: genId("pagocaja"),
    fecha: vFecha.value.slice(0, 16),
    concepto: vConcepto.value,
    beneficiario: vBenef.value,
    categoria: vCategoria.value,
    soporte: vSoporte.value,
    valor: Math.round(vValor.value),
    formaPago: vMetodo.value,
    usuario: state.currentUser ? (state.currentUser.nombre || state.currentUser.usuario) : "",
    registradoEl: nowLocalInput(),
  });
  renderConservandoPosicion();
  persist();
}



// Quita tildes y pasa a minúsculas, para que buscar "perez" encuentre "Pérez",
// "jose" encuentre "José", etc. Se usa tanto al guardar el atributo de
// búsqueda de cada tarjeta como al leer lo que escribe el recepcionista.
// Lista desplegable bajo el buscador de Contabilidad con los clientes que coinciden
// (una fila por persona, con su estadía más reciente). Al elegir uno, irACliente.
function renderSugerenciasClientes(lista, busqueda) {
  if (!busqueda || state.ocultarSugerencias) return "";
  const vistos = new Map();
  lista.forEach((t) => {
    const clave = normalizarBusqueda(t.cedula) || normalizarBusqueda(t.nombre);
    if (!clave) return;
    if (!vistos.has(clave)) vistos.set(clave, { t, estadias: 0 });
    vistos.get(clave).estadias++;
  });
  const clientes = [...vistos.values()].slice(0, 8);
  return '<div class="sugerencias-clientes" role="listbox">' +
    (clientes.length === 0
      ? '<div class="sugerencia-vacia">Ningún cliente coincide.</div>'
      : clientes.map(({ t, estadias }, i) =>
          '<button type="button" class="sugerencia-cliente' + (i === 0 ? " primera" : "") + '" role="option" data-action="ir-a-cliente" data-id="' + esc(t.id) + '">' +
            '<span class="sugerencia-nombre">' + esc(t.nombre || "Sin nombre") + '</span>' +
            '<span class="sugerencia-detalle">' + esc(docAbbrev(tipoDocumentoDe(t))) + ' ' + esc(t.cedula || "—") +
              ' · Hab. ' + esc(t.roomNumber || "—") + ' · ' + formatDateTime(t.horaIngreso) +
              (estadias > 1 ? ' · ' + estadias + ' estadías' : "") + '</span>' +
          '</button>'
        ).join("") +
        '<div class="sugerencia-ayuda">Enter para ir al primero · Esc para cerrar</div>') +
  '</div>';
}

// Lleva directo al cliente: baja hasta su fila en "Detalle de transacciones",
// la resalta y abre la cajita con su cuenta.
function irACliente(txId) {
  if (!state.transactions.some((t) => String(t.id) === String(txId))) return;
  state.txResaltada = txId;
  state.ocultarSugerencias = true;
  render();
  const fila = document.querySelector('[data-tx-row="' + String(txId).replace(/["\\]/g, "") + '"]');
  if (fila) fila.scrollIntoView({ block: "center" });
  state.modalCuentaTx = txId;
  renderConservandoPosicion();
}

// ¿La estadía (o deudor) coincide con lo buscado? Busca en el nombre y el número de
// documento del cliente principal y de las personas adicionales. "q" ya viene normalizado.
function coincideBusquedaCliente(t, q) {
  if (!q) return true;
  const textos = [t.nombre, t.cedula];
  getAcompanantes(t).forEach((a) => { textos.push(a.nombre, a.cedula); });
  menoresDe(t).forEach((m) => { textos.push(m.nombre, m.cedula); });
  const qSinPuntos = q.replace(/[.\s-]/g, "");
  return textos.some((x) => {
    const n = normalizarBusqueda(x);
    return n && (n.indexOf(q) !== -1 || (qSinPuntos && n.replace(/[.\s-]/g, "").indexOf(qSinPuntos) !== -1));
  });
}

function normalizarBusqueda(str) {
  return String(str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

/* ---------- inventario del hotel (bienes que NO se venden) ----------
   Registro de lo que tiene el hotel (muebles, lencería, equipos…) y en qué estado
   está. Lo editan la aseadora, el creador y el administrador (permiso editActivos);
   el contador solo lo ve. Se guarda en la tabla "activos" (crear-inventario-hotel.sql). */
const CATEGORIAS_ACTIVOS = ["Muebles", "Ropa blanca", "Implementos de aseo", "Baño", "Electrodomésticos", "Electrónica", "Cocina", "Decoración", "Otro"];
// Artículos guardados con la categoría vieja "Lencería y ropa de cama" se muestran
// (y al editarlos se guardan) como "Ropa blanca".
function categoriaActivo(c) { return c === "Lencería y ropa de cama" ? "Ropa blanca" : (c || ""); }
const ESTADOS_ACTIVOS = [
  { key: "Bueno", color: "#4F7A5B", bg: "#EAF1EA" },
  { key: "Regular", color: "#8A6A16", bg: "#F7EFDD" },
  { key: "Dañado", color: "#B4432F", bg: "#F7E9E4" },
  { key: "En reparación", color: "#2E6E86", bg: "#E4EFF3" },
  { key: "Dado de baja", color: "#6B675C", bg: "#ECEEF3" },
];
function estadoActivo(key) { return ESTADOS_ACTIVOS.find((e) => e.key === key) || ESTADOS_ACTIVOS[0]; }
function pillEstadoActivo(key) {
  const e = estadoActivo(key);
  return '<span class="status-pill" style="color:' + e.color + ';background:' + e.bg + '"><span class="dot" style="background:' + e.color + '"></span>' + esc(e.key) + '</span>';
}

        ' La tabla "activos" aún no existe en Supabase: este inventario se guarda solo en este equipo hasta que el administrador ejecute <strong>crear-inventario-hotel.sql</strong>.</div>') +

                    ? '<select class="input estado-activo-select" data-action="cambiar-estado-activo" data-id="' + esc(a.id) + '" title="Cambiar el estado" style="color:' + estadoActivo(a.estado).color + '">' +

                      '</select>'
                    : pillEstadoActivo(a.estado)) + '</td>' +

                    : "") +

      '</div>' +

  );
}

// Descarga en Excel el inventario del hotel: los artículos de la tabla (respeta el
// filtro de estado elegido) y una hoja de resumen por estado y por categoría.
function exportarActivosExcel() {
  if (!puede("verActivos")) return;
  if (!window.XLSX) { alert("No se pudo cargar el generador de Excel. Revisa tu conexión a internet."); return; }
  const filtro = state.filtroEstadoActivo || "";
  const lista = state.activos
    .filter((a) => !filtro || (a.estado || "Bueno") === filtro)
    .slice()
    .sort((a, b) => (a.ubicacion || "").localeCompare(b.ubicacion || "") || a.nombre.localeCompare(b.nombre));
  if (!lista.length) { alert("No hay artículos para exportar."); return; }
  const data = lista.map((a) => ({
    "Artículo": a.nombre,
    "Categoría": categoriaActivo(a.categoria) || "",
    "Ubicación": a.ubicacion || "",
    "Cantidad": Number(a.cantidad) || 0,
    "Estado": a.estado || "Bueno",
    "Observaciones": a.observaciones || "",
    "Última revisión": a.revisadoEl ? formatDateTime(a.revisadoEl) : "",
    "Revisado por": a.actualizadoPor || "",
  }));
  data.push({ "Artículo": "TOTAL DE UNIDADES", "Cantidad": lista.reduce((s, a) => s + (Number(a.cantidad) || 0), 0) });
  const unidades = (clave, valor) => lista.filter((a) => clave(a) === valor).reduce((s, a) => s + (Number(a.cantidad) || 0), 0);
  const resumen = [{ "Resumen": "Exportado el", "Valor": formatDateTime(nowLocalInput()) }];
  if (filtro) resumen.push({ "Resumen": "Filtro de estado", "Valor": filtro });
  resumen.push({ "Resumen": "", "Valor": "" }, { "Resumen": "UNIDADES POR ESTADO", "Valor": "" });
  ESTADOS_ACTIVOS.forEach((e) => resumen.push({ "Resumen": e.key, "Valor": unidades((a) => a.estado || "Bueno", e.key) }));
  resumen.push({ "Resumen": "", "Valor": "" }, { "Resumen": "UNIDADES POR CATEGORÍA", "Valor": "" });
  CATEGORIAS_ACTIVOS.forEach((c) => { const n = unidades((a) => categoriaActivo(a.categoria), c); if (n) resumen.push({ "Resumen": c, "Valor": n }); });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, hojaSegura(data), "Inventario del hotel");
  XLSX.utils.book_append_sheet(wb, hojaSegura(resumen), "Resumen");
  XLSX.writeFile(wb, "inventario-hotel-" + todayKey() + (filtro ? "-" + nombreArchivoSeguro(filtro) : "") + ".xlsx");
}

function guardarActivo(form) {
  if (!puede("editActivos")) return;
  const errorEl = document.getElementById("activo-error");
  const mostrarError = (msg) => { if (errorEl) errorEl.textContent = msg; };
  const fd = new FormData(form);
  const vNombre = validarTexto(fd.get("nombre"), { etiqueta: "El artículo", maxLength: 80 });
  if (!vNombre.ok) { mostrarError(vNombre.error); return; }
  const vCategoria = validarOpcion(fd.get("categoria"), CATEGORIAS_ACTIVOS, { etiqueta: "La categoría" });
  if (!vCategoria.ok) { mostrarError(vCategoria.error); return; }
  const vUbicacion = validarTexto(fd.get("ubicacion"), { etiqueta: "La ubicación", maxLength: 60, requerido: false });
  if (!vUbicacion.ok) { mostrarError(vUbicacion.error); return; }
  const vCantidad = validarNumero(fd.get("cantidad"), { etiqueta: "La cantidad", min: 0, max: 99999, porDefecto: 1 });
  if (!vCantidad.ok || !Number.isInteger(vCantidad.value)) { mostrarError(vCantidad.error || "La cantidad debe ser un número entero."); return; }
  const vEstado = validarOpcion(fd.get("estado"), ESTADOS_ACTIVOS.map((e) => e.key), { etiqueta: "El estado" });
  if (!vEstado.ok) { mostrarError(vEstado.error); return; }
  const vObs = validarTexto(fd.get("observaciones"), { etiqueta: "Las observaciones", maxLength: 200, requerido: false });
  if (!vObs.ok) { mostrarError(vObs.error); return; }
  const datos = {
    nombre: vNombre.value, categoria: vCategoria.value, ubicacion: vUbicacion.value,
    cantidad: vCantidad.value, estado: vEstado.value, observaciones: vObs.value,
    revisadoEl: nowLocalInput(), actualizadoPor: state.currentUser.nombre || state.currentUser.usuario,
  };
  const existente = state.editandoActivoId ? state.activos.find((a) => a.id === state.editandoActivoId) : null;
  if (existente) Object.assign(existente, datos);
  else state.activos.push(Object.assign({ id: genId("activo") }, datos));
  state.editandoActivoId = null;
  renderConservandoPosicion();
  persist();
}

function cambiarEstadoActivo(id, estado) {
  if (!puede("editActivos")) return;
  const a = state.activos.find((x) => x.id === id);
  if (!a || !ESTADOS_ACTIVOS.some((e) => e.key === estado)) { renderConservandoPosicion(); return; }
  a.estado = estado;
  a.revisadoEl = nowLocalInput();
  a.actualizadoPor = state.currentUser.nombre || state.currentUser.usuario;
  renderConservandoPosicion();
  persist();
}

function editarActivo(id) {
  if (!puede("editActivos") || !state.activos.some((a) => a.id === id)) return;
  state.editandoActivoId = id;
  renderConservandoPosicion();
  const form = document.getElementById("activo-form");
  if (form) { form.scrollIntoView({ behavior: "smooth", block: "center" }); form.nombre.focus(); }
}

function eliminarActivo(id) {
  if (!puede("editActivos")) return;
  const a = state.activos.find((x) => x.id === id);
  if (!a) return;
  if (!confirm("¿Eliminar \"" + a.nombre + "\" del inventario del hotel?\n\nSi solo se dañó o se dio de baja, es mejor cambiar su estado para conservar el registro.")) return;
  recordarNombreAntesDeBorrar("activos", id);
  state.activos = state.activos.filter((x) => x.id !== id);
  if (state.editandoActivoId === id) state.editandoActivoId = null;
  renderConservandoPosicion();
  persist();
}

/* ---------- gráficas de utilidad del inventario de venta ---------- */
// Ganancia real que dejó cada producto en sus ventas: (precio cobrado − costo que
// tenía ese día) × cantidad. Solo cuenta productos con costo registrado.
function gananciaPorProducto() {
  const util = {};
  state.consumos.forEach((c) => {
    if (!c.inventarioId) return;
    const it = state.inventario.find((i) => i.id === c.inventarioId);
    if (!it) return;
    const costo = costoEnFecha(it, c.fecha || "");
    if (costo == null) return;
    util[it.id] = (util[it.id] || 0) + ((Number(c.valorUnit) || 0) - costo) * (Number(c.cantidad) || 1);
  });
  return state.inventario.filter((i) => util[i.id] != null).map((i) => ({ label: i.nombre, valor: Math.round(util[i.id]) }));
}

function renderGraficasUtilidad() {
  const conCosto = state.inventario.filter(tieneCosto);
  if (!state.inventario.length) return "";
  const pareto = gananciaPorProducto().filter((x) => x.valor > 0);
  const elegido = state.inventario.find((i) => i.id === state.productoGrafica) ||
    conCosto.slice().sort((a, b) => (b.historial || []).length - (a.historial || []).length)[0];
  return (
    '<div class="grid-2" style="margin-top:18px">' +
      '<div class="panel">' +
        '<div class="panel-title">Diagrama de Pareto — ganancia por producto</div>' +
        '<div class="panel-sub">Barras: lo que aporta cada producto a la ganancia total de las ventas. Línea: el porcentaje acumulado. Los productos a la izquierda de la línea del 80 % son los que más ganancia dejan.</div>' +
        vizPareto(pareto, { vacio: conCosto.length ? "Aún no hay ventas de productos con costo registrado." : "Registra el costo de los productos para ver su ganancia." }) +
      '</div>' +
      '<div class="panel">' +
        '<div class="panel-title" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">Precio de venta, costo y ganancia en el tiempo' +
          (conCosto.length
            ? '<select class="input" data-action="grafica-producto" style="width:auto;margin-left:auto;padding:4px 8px;font-size:12.5px">' +
                conCosto.map((i) => '<option value="' + esc(i.id) + '"' + (elegido && elegido.id === i.id ? " selected" : "") + '>' + esc(i.nombre) + '</option>').join("") +
              '</select>'
            : "") +
        '</div>' +
        '<div class="panel-sub">Cada punto es un cambio de costo o de % de utilidad. La distancia entre el precio y el costo es la ganancia por unidad.</div>' +
        (elegido
          ? vizLineasEscalon([
              { label: "Precio de venta", color: VIZ.habitaciones, puntos: (elegido.historial || []).map((h) => ({ fecha: h.fecha, valor: Number(h.precio) || 0, extra: h })) },
              { label: "Costo", color: VIZ.consumos, puntos: (elegido.historial || []).map((h) => ({ fecha: h.fecha, valor: Number(h.costo) || 0, extra: h })) },
              { label: "Ganancia por unidad", color: "#1baf7a", puntos: (elegido.historial || []).map((h) => ({ fecha: h.fecha, valor: (Number(h.precio) || 0) - (Number(h.costo) || 0), extra: h })) },
            ], { vacio: "Este producto aún no tiene historial de precios." })
          : vizVacio("Registra el costo de los productos para ver cómo cambian sus precios.")) +
      '</div>' +
    '</div>'
  );
}

// Diagrama de Pareto en un solo eje (%): barras = % de la ganancia total de cada
// producto (de mayor a menor) y línea = % acumulado. A partir del producto 12 se
// agrupan en "Otros".
function vizPareto(items, opts) {
  opts = opts || {};
  let lista = items.slice().sort((a, b) => b.valor - a.valor);
  if (lista.length > 12) {
    const resto = lista.slice(11);
    lista = lista.slice(0, 11).concat({ label: "Otros (" + resto.length + ")", valor: resto.reduce((s, x) => s + x.valor, 0) });
  }
  const total = lista.reduce((s, x) => s + x.valor, 0);
  if (!lista.length || total <= 0) return vizVacio(opts.vacio);
  const W = 640, H = 250, pad = { top: 14, right: 14, bottom: 54, left: 40 };
  const innerW = W - pad.left - pad.right, innerH = H - pad.top - pad.bottom;
  const slot = innerW / lista.length, bw = Math.min(24, Math.max(6, slot * 0.6));
  const yDe = (pct) => pad.top + innerH * (1 - pct / 100);
  let grid = "", barras = "", etiquetas = "", zonas = "", acumulado = 0;
  [0, 25, 50, 75, 100].forEach((v) => {
    grid += '<line x1="' + pad.left + '" x2="' + (W - pad.right) + '" y1="' + yDe(v) + '" y2="' + yDe(v) + '" stroke="' + (v === 0 ? VIZ.base : VIZ.grid) + '" stroke-width="1"/>' +
      '<text x="' + (pad.left - 6) + '" y="' + (yDe(v) + 3) + '" font-size="10" fill="' + VIZ.muted + '" text-anchor="end">' + v + '%</text>';
  });
  // Línea de referencia del 80 %.
  grid += '<line x1="' + pad.left + '" x2="' + (W - pad.right) + '" y1="' + yDe(80) + '" y2="' + yDe(80) + '" stroke="' + VIZ.muted + '" stroke-width="1" stroke-opacity="0.6"/>' +
    '<text x="' + (W - pad.right) + '" y="' + (yDe(80) - 4) + '" font-size="10" fill="' + VIZ.muted + '" text-anchor="end">80 %</text>';
  const puntos = [];
  lista.forEach((x, i) => {
    const pct = (x.valor / total) * 100;
    acumulado += pct;
    const cx = pad.left + i * slot + slot / 2;
    const y = yDe(pct);
    barras += '<path d="' + barraPath(cx - bw / 2, y, bw, yDe(0) - y, true) + '" fill="' + VIZ.unaSerie + '"/>';
    puntos.push([cx, yDe(acumulado), acumulado]);
    const corto = x.label.length > 11 ? x.label.slice(0, 10) + "…" : x.label;
    etiquetas += '<text x="' + cx + '" y="' + (H - pad.bottom + 14) + '" font-size="10" fill="' + VIZ.muted + '" text-anchor="end" transform="rotate(-35 ' + cx + ' ' + (H - pad.bottom + 14) + ')">' + esc(corto) + '</text>';
    zonas += '<rect class="viz-hit" x="' + (pad.left + i * slot) + '" y="' + pad.top + '" width="' + slot + '" height="' + innerH + '" fill="transparent" data-tip="' +
      esc(x.label + "\nGanancia: " + formatCOP(x.valor) + "\nAporta: " + pct.toFixed(1) + " % del total\nAcumulado: " + acumulado.toFixed(1) + " %") + '"/>';
  });
  const linea = puntos.map((p, i) => (i ? "L" : "M") + p[0] + "," + p[1]).join("");
  const marcadores = puntos.map((p) => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="' + VIZ.consumos + '" stroke="#fff" stroke-width="2"/>').join("");
  return vizLeyenda([{ label: "Ganancia de cada producto (% del total)", color: VIZ.unaSerie }, { label: "% acumulado", color: VIZ.consumos }]) +
    '<svg class="viz-svg" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Diagrama de Pareto de la ganancia por producto">' +
      grid + barras +
      '<path d="' + linea + '" fill="none" stroke="' + VIZ.consumos + '" stroke-width="2" stroke-linejoin="round"/>' + marcadores +
      etiquetas + zonas +
    '</svg>' +
    '<div class="muted" style="font-size:12px;margin-top:4px">Ganancia total de las ventas: <strong style="color:var(--ink)">' + formatCOP(total) + '</strong></div>';
}

// Líneas "en escalón": cada valor se mantiene hasta su siguiente cambio y la última
// llega hasta "Hoy". Cada cambio ocupa el mismo espacio a lo ancho (aunque haya
// pasado poco o mucho tiempo entre ellos) y lleva su fecha debajo. Todas las series
// comparten el mismo eje en pesos.
function vizLineasEscalon(series, opts) {
  opts = opts || {};
  // Los puntos de cada serie vienen en orden (uno por cada cambio del historial):
  // el cambio número i ocupa la posición i, y la última posición es "Hoy".
  const n = Math.max(0, ...series.map((s) => s.puntos.length));
  if (!n) return vizVacio(opts.vacio);
  const todos = series.flatMap((s) => s.puntos);
  const W = 640, H = 236, pad = { top: 14, right: 16, bottom: 32, left: 56 };
  const innerW = W - pad.left - pad.right, innerH = H - pad.top - pad.bottom;
  const esc_ = escalaBonita(Math.max(1, ...todos.map((p) => p.valor)));
  const xDe = (pos) => pad.left + (pos / n) * innerW;
  const yDe = (v) => pad.top + innerH * (1 - Math.max(0, v) / esc_.max);
  let grid = "";
  for (let v = 0; v <= esc_.max + 1e-9; v += esc_.paso) {
    grid += '<line x1="' + pad.left + '" x2="' + (W - pad.right) + '" y1="' + yDe(v) + '" y2="' + yDe(v) + '" stroke="' + (v === 0 ? VIZ.base : VIZ.grid) + '" stroke-width="1"/>' +
      '<text x="' + (pad.left - 6) + '" y="' + (yDe(v) + 3) + '" font-size="10" fill="' + VIZ.muted + '" text-anchor="end">' + formatEje(v) + '</text>';
  }
  // Fecha debajo de cada cambio (si son muchos, solo algunas para que no se encimen) y "Hoy" al final.
  const base = series[0].puntos;
  const fechaCorta = (f) => { const d = new Date(f); return isNaN(d.getTime()) ? "" : d.getDate() + "/" + (d.getMonth() + 1); };
  const cadaCuanto = Math.ceil(n / 8);
  const etiquetas = base.map((p, i) => (i % cadaCuanto === 0
    ? '<text x="' + xDe(i) + '" y="' + (H - 12) + '" font-size="10" fill="' + VIZ.muted + '" text-anchor="' + (i === 0 ? "start" : "middle") + '">' + fechaCorta(p.fecha) + '</text>'
    : "")).join("") +
    '<text x="' + xDe(n) + '" y="' + (H - 12) + '" font-size="10" fill="' + VIZ.muted + '" text-anchor="end">Hoy</text>';
  let lineas = "";
  series.forEach((s) => {
    const pts = s.puntos;
    if (!pts.length) return;
    let d = "M" + xDe(0) + "," + yDe(pts[0].valor);
    for (let i = 1; i < pts.length; i++) d += "H" + xDe(i) + "V" + yDe(pts[i].valor);
    d += "H" + xDe(n);
    lineas += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2" stroke-linejoin="round"/>' +
      pts.map((p, i) => '<circle cx="' + xDe(i) + '" cy="' + yDe(p.valor) + '" r="4" fill="' + s.color + '" stroke="#fff" stroke-width="2"/>').join("");
    const ult = pts[pts.length - 1];
    lineas += '<text x="' + (xDe(n) - 4) + '" y="' + (yDe(ult.valor) - 6) + '" font-size="10.5" font-weight="600" fill="' + VIZ.ink + '" text-anchor="end">' + formatCOP(ult.valor) + '</text>';
  });
  // Zonas para el detalle: una por cada cambio registrado.
  let zonas = "";
  base.forEach((p, i) => {
    const lineasTip = ["Cambio " + (i + 1) + " · " + formatDateTime(p.fecha)]
      .concat(series.map((s) => (s.puntos[i] ? s.label + ": " + formatCOP(s.puntos[i].valor) : null)).filter(Boolean));
    if (p.extra) lineasTip.push("Utilidad: " + (Number(p.extra.utilidad) || 0) + " %" + (p.extra.usuario ? " · " + p.extra.usuario : ""));
    zonas += '<rect class="viz-hit" x="' + xDe(i) + '" y="' + pad.top + '" width="' + (xDe(i + 1) - xDe(i)) + '" height="' + innerH + '" fill="transparent" data-tip="' + esc(lineasTip.join("\n")) + '"/>';
  });
  return vizLeyenda(series) +
    '<svg class="viz-svg" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Precio de venta, costo y ganancia en el tiempo">' +
      grid + lineas + etiquetas + zonas +
    '</svg>';
}

/* ---------- Administración ----------
   La ven el creador y el administrador; SOLO el creador puede editar (permiso
   editAdministracion). Tiene tres partes: habitaciones (con su contenido y quién
   las ocupa), gráficos de habitaciones y traslados, y la actividad de los usuarios.
   La política de tratamiento de datos está en el menú "Legal y privacidad". */
const AMENIDADES_HABITACION = ["Baño privado", "Agua caliente", "TV", "Wi-Fi", "Aire acondicionado", "Ventilador", "Nevera / minibar", "Closet", "Escritorio", "Balcón / ventana"];
const ID_POLITICA_DATOS = "politica_privacidad";

function detallesDe(room) {
  const d = (room && room.detalles) || {};
  return {
    camasDobles: Number(d.camasDobles) || 0,
    camasSencillas: Number(d.camasSencillas) || 0,
    camarotes: Number(d.camarotes) || 0,
    sofaCama: Number(d.sofaCama) || 0,
    amenidades: Array.isArray(d.amenidades) ? d.amenidades.filter((a) => AMENIDADES_HABITACION.indexOf(a) !== -1) : [],
    notas: d.notas || "",
  };
}
function totalCamas(d) { return d.camasDobles + d.camasSencillas + d.camarotes + d.sofaCama; }
function textoCamas(d) {
  const partes = [];
  if (d.camasDobles) partes.push(d.camasDobles + " doble" + (d.camasDobles > 1 ? "s" : ""));
  if (d.camasSencillas) partes.push(d.camasSencillas + " sencilla" + (d.camasSencillas > 1 ? "s" : ""));
  if (d.camarotes) partes.push(d.camarotes + " camarote" + (d.camarotes > 1 ? "s" : ""));
  if (d.sofaCama) partes.push(d.sofaCama + " sofá cama");
  return partes.length ? partes.join(" · ") : "Sin camas registradas";
}

function renderAdministracion() {
  if (!puede("verAdministracion")) return "";
  const pestanas = [
    { key: "habitaciones", label: "Habitaciones", icon: "door" },
    { key: "graficos", label: "Gráficos y traslados", icon: "coin" },
    { key: "actividad", label: "Actividad", icon: "user" },
  ];
  // La política de datos ahora está en el menú "Legal y privacidad".
  const sub = pestanas.some((p) => p.key === state.adminTab) ? state.adminTab : "habitaciones";
  return (
    '<div class="section-title"><h2>Administración</h2></div>' +
    (puede("editAdministracion") ? "" : '<div class="readonly-note">' + icon("alert", 13) + ' Puedes ver esta sección; solo el creador puede editarla.</div>') +
    '<div class="sheet-chips" style="margin-bottom:16px">' +
      pestanas.map((p) =>
        '<button class="sheet-chip' + (sub === p.key ? " btn-activo" : "") + '" data-action="admin-tab" data-tab="' + p.key + '">' + icon(p.icon, 13) + ' ' + esc(p.label) + '</button>'
      ).join("") +
    '</div>' +
    (sub === "habitaciones" ? renderAdminHabitaciones() : "") +
    (sub === "graficos" ? renderAdminGraficos() : "") +
    (sub === "actividad" ? renderAdminActividad() : "")
  );
}

// Descarga de Supabase quién está conectado y los últimos cambios. Lo que Supabase
// devuelve ya viene filtrado por las reglas (el administrador no recibe al creador).
let cargandoActividad = false;
async function cargarActividad() {
  if (cargandoActividad || !puede("verAdministracion")) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) return;
  cargandoActividad = true;
  try {
    const [pres, act] = await Promise.all([
      supabaseClient.from("presencia").select("*").order("ultima_actividad", { ascending: false }),
      supabaseClient.from("actividad").select("*").order("creado_el", { ascending: false }).limit(300),
    ]);
    state.actividadDatos = {
      presencia: pres.error ? [] : (pres.data || []),
      actividad: act.error ? [] : (act.data || []),
      faltanTablas: tablaNoExiste(pres.error) || tablaNoExiste(act.error),
      error: (!tablaNoExiste(pres.error) && pres.error) || (!tablaNoExiste(act.error) && act.error) || null,
      cargadoEl: nowLocalInput(),
    };
    if (pres.error || act.error) console.warn("Actividad:", pres.error || act.error);
  } catch (e) {
    /* sin internet: se intenta en el siguiente ciclo */
  } finally {
    cargandoActividad = false;
  }
  if (state.tab === "administracion" && state.adminTab === "actividad") renderSiSePuede();
}

// "hace 5 min", "hace 2 h"… a partir de una fecha ISO.
function haceCuanto(iso) {
  const d = new Date(iso);
  if (!iso || isNaN(d.getTime())) return "—";
  const min = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
  if (min < 1) return "ahora";
  if (min < 60) return "hace " + min + " min";
  const h = Math.round(min / 60);
  if (h < 24) return "hace " + h + " h";
  return "hace " + Math.round(h / 24) + " día(s)";
}

function guardarDetallesHabitacion(form) {
  if (!puede("editAdministracion") || !state.dbDetallesHab) return;
  const room = state.rooms.find((r) => String(r.id) === String(form.dataset.roomId));
  if (!room) return;
  const fd = new FormData(form);
  const errorEl = document.getElementById("detalles-hab-error");
  const num = (campo, etiqueta) => validarNumero(fd.get(campo), { etiqueta, min: 0, max: 20, porDefecto: 0 });
  const campos = [["camasDobles", "Camas dobles"], ["camasSencillas", "Camas sencillas"], ["camarotes", "Camarotes"], ["sofaCama", "Sofá cama"]];
  const detalles = {};
  for (const [campo, etiqueta] of campos) {
    const v = num(campo, etiqueta);
    if (!v.ok || !Number.isInteger(v.value)) { if (errorEl) errorEl.textContent = v.error || etiqueta + " debe ser un número entero."; return; }
    detalles[campo] = v.value;
  }
  const vNotas = validarTexto(fd.get("notas"), { etiqueta: "Las notas", maxLength: 200, requerido: false });
  if (!vNotas.ok) { if (errorEl) errorEl.textContent = vNotas.error; return; }
  detalles.amenidades = AMENIDADES_HABITACION.filter((_, i) => fd.get("amenidad_" + i) === "on");
  detalles.notas = vNotas.value;
  room.detalles = detalles;
  state.editandoDetallesHab = false;
  render();
  persist();
}

// % de noches ocupadas de cada habitación en los días dados.
function ocupacionPorHabitacion(dias) {
  const hoy = todayKey();
  return state.rooms.map((r) => {
    let noches = 0;
    dias.forEach((k) => {
      const ocupada = state.transactions.some((t) => {
        if (String(t.roomNumber) !== String(r.number)) return false;
        const ini = dayKeyOf(t.horaIngreso);
        if (!ini) return false;
        const fin = t.estado === "finalizada" ? (dayKeyOf(t.horaSalida) || ini) : (k <= hoy ? "9999-12-31" : ini);
        return ini <= k && (k < fin || k === ini);
      });
      if (ocupada) noches++;
    });
    return { label: "Hab. " + r.number, valor: dias.length ? Math.round((noches / dias.length) * 100) : 0, detalle: noches + " de " + dias.length + " noches" };
  });
}

// Cuántas estadías empezaron (o terminaron) en cada hora del día (0 a 23).
function conteoPorHora(fechas) {
  const horas = Array.from({ length: 24 }, () => 0);
  fechas.forEach((f) => {
    const m = /T(\d{2}):/.exec(String(f || ""));
    if (m) horas[Number(m[1])]++;
  });
  return horas;
}
function horaPico(horas) {
  const max = Math.max(...horas);
  if (!max) return null;
  const h = horas.indexOf(max);
  return { hora: h, cantidad: max, texto: pad(h) + ":00 – " + pad((h + 1) % 24) + ":00" };
}

function renderGraficasHoras() {
  const ingresos = conteoPorHora(state.transactions.map((t) => t.horaIngreso));
  const salidas = conteoPorHora(state.transactions.filter((t) => t.estado === "finalizada").map((t) => t.horaSalida));
  const columnas = (horas, clave) => horas.map((n, h) => ({
    label: h + "h", titulo: pad(h) + ":00 – " + pad((h + 1) % 24) + ":00", valores: { [clave]: n },
  }));
  const picoIn = horaPico(ingresos), picoOut = horaPico(salidas);
  return (

// Tabla de las estadías a las que se les hizo descuento, con su causa.
function renderTablaDescuentos() {
  const lista = state.transactions.filter((t) => Number(t.descuento) > 0)
    .slice().sort((a, b) => (a.horaIngreso < b.horaIngreso ? 1 : -1));
  const total = lista.reduce((s, t) => s + (Number(t.descuento) || 0), 0);
  return (
    '<div class="panel table-scroll" style="margin-bottom:16px">' +
      '<div class="panel-title">Habitaciones con descuento</div>' +
      (lista.length === 0
        ? '<div class="muted" style="font-size:13px">Aún no se han hecho descuentos.</div>'
        : '<div class="historico-scroll" style="max-height:360px"><table class="tx-table" style="min-width:640px"><thead><tr><th>Ingreso</th><th>Hab.</th><th>Huésped</th><th>Descuento</th><th>Motivo</th><th>Total cobrado</th><th>Registró</th></tr></thead><tbody>' +
            lista.map((t) =>
              '<tr><td>' + formatDateTime(t.horaIngreso) + '</td>' +
                '<td>Hab. ' + esc(t.roomNumber || "—") + (t.tipoHabitacion ? ' <span class="muted" style="font-size:11px">(' + esc(t.tipoHabitacion) + ')</span>' : "") + '</td>' +
                '<td>' + esc(t.nombre || "—") + '</td>' +
                '<td style="color:var(--bad);font-weight:600">− ' + formatCOP(t.descuento) + '</td>' +
                '<td style="white-space:normal;min-width:180px">' + esc(t.motivoDescuento || "—") + '</td>' +
                '<td>' + formatCOP(t.valor) + '</td>' +
                '<td>' + esc(t.usuario || "—") + '</td></tr>'
            ).join("") +
            '<tr style="font-weight:700"><td colspan="3">Total de descuentos (' + lista.length + ')</td><td style="color:var(--bad)">− ' + formatCOP(total) + '</td><td colspan="3"></td></tr>' +
          '</tbody></table></div>') +
    '</div>'
  );
}

function guardarDocumentoLegal(form) {
  if (!puede("editLegal")) return;
  const doc = DOCUMENTOS_LEGALES.find((d) => d.id === form.dataset.doc);
  if (!doc) return;
  const contenido = stripControlChars(new FormData(form).get("contenido") || "").replace(/\r/g, "").slice(0, 30000).trim();
  if (!contenido) { alert("El documento no puede quedar vacío."); return; }
  const datos = { contenido, actualizadoPor: state.currentUser.nombre || state.currentUser.usuario, actualizadoEl: nowLocalInput() };
  const reg = state.configuracion.find((c) => c.id === doc.id);
  if (reg) Object.assign(reg, datos);
  else state.configuracion.push(Object.assign({ id: doc.id }, datos));
  state.editandoLegal = false;
  renderConservandoPosicion();
  persist();
}

function renderContabilidad() {
  const filteredTx = filteredTxForMonth();
  const totals = monthTotalsOf(filteredTx);
  const filteredConsumos = filteredConsumosForMonth();
  const byPayment = paymentSummaryOf(filteredTx, filteredConsumos);
  // Buscador de clientes: con texto, las tablas de transacciones, deudores e IVA
  // muestran las estadías de TODAS las fechas que coinciden (nombre o documento);
  // las tarjetas y los gráficos siguen mostrando el mes elegido.
  const busqueda = normalizarBusqueda(stripControlChars(state.buscarContabilidad || ""));
  const txTablas = busqueda ? state.transactions.filter((t) => coincideBusquedaCliente(t, busqueda)) : filteredTx;
  const sortedTx = txTablas.slice().sort((a, b) => (a.horaIngreso < b.horaIngreso ? 1 : -1));
  const marginalTotals = marginalTotalsOf(filteredConsumos);
  const sortedConsumos = filteredConsumos.slice().sort((a, b) => (a.fecha < b.fecha ? 1 : -1));
  const pagosCajaMes = pagosCajaOrdenados(state.pagosCaja.filter((p) => monthKeyOf(p.fecha) === state.monthFilter));
  const flujoMes = flujoPorDia(diasDelMes(state.monthFilter));
  const ingresosTotalesMes = totals.total + marginalTotals.total;
  const balanceMes = ingresosTotalesMes - totalPagosCaja(pagosCajaMes);

  return (
    '<div class="section-title">' +
      '<h2>Contabilidad</h2>' +
      '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        '<input id="month-filter" class="input" type="month" value="' + esc(state.monthFilter) + '" style="width:auto" />' +
        (puede("exportContabilidad")
          ? '<button class="btn-primary btn-inline" data-action="open-export-modal">' + icon("download", 15) + ' Exportar a Excel</button>'
          : "") +
      '</div>' +
    '</div>' +
    '<div class="search-row" style="margin-bottom:12px">' +
      '<div class="search-wrap" style="max-width:460px">' + icon("search", 15) +
        '<input id="buscar-contabilidad" class="input" maxlength="60" autocomplete="off" placeholder="Buscar cliente por nombre o número de documento…" value="' + esc(state.buscarContabilidad || "") + '" />' +
        renderSugerenciasClientes(sortedTx, busqueda) +
      '</div>' +
      (busqueda
        ? '<span class="muted" style="font-size:12.5px">' + sortedTx.length + ' estadía(s) encontradas en todas las fechas</span>' +
          '<button class="btn-secondary btn-inline" style="padding:5px 11px;font-size:12.5px" data-action="limpiar-busqueda-contabilidad">Quitar búsqueda</button>'
        : "") +
    '</div>' +
    renderSeccionHistorico() +
    '<div class="stat-grid">' +
      statCard("Ingresos del mes", formatCOP(totals.total), null, "var(--gold)") +
      statCard("Pagado", formatCOP(totals.pagado), null, STATUS.vacia.color) +
      statCard("Pendiente", formatCOP(totals.pendiente), null, STATUS.ocupada.color) +
      statCard("Registros", totals.count, null, "var(--ink-deep)") +
      statCard("Ingresos marginales", formatCOP(marginalTotals.total), marginalTotals.count + " consumo(s) extra", "#2E6E86") +
      statCard("Pagos de caja (egresos)", formatCOP(totalPagosCaja(pagosCajaMes)), pagosCajaMes.length + " pago(s) en el mes", "var(--bad)") +
      statCard("Balance del mes", formatCOP(balanceMes), "Ingresos + consumos − pagos de caja", balanceMes >= 0 ? STATUS.vacia.color : "var(--bad)") +
    '</div>' +
    '<div class="panel" style="margin-bottom:16px">' +
      '<div class="panel-title">Flujo de caja diario del mes</div>' +
      '<div class="panel-sub">Ingresos hacia arriba (habitaciones y consumos); pagos desde la caja hacia abajo. Pasa el mouse sobre un día para ver el neto.</div>' +
      vizColumnas(flujoMes, [
        { key: "habitaciones", label: "Habitaciones", color: VIZ.habitaciones },
        { key: "consumos", label: "Consumos extra", color: VIZ.consumos },
        { key: "egresos", label: "Pagos de caja", color: VIZ.egresos },
      ], { serieAbajo: { key: "egresos", color: VIZ.egresos }, alto: 240, titulo: "Flujo de caja diario", vacio: "Sin movimientos en este mes." }) +
    '</div>' +
    '<div class="grid-3">' +
      '<div class="panel">' +
        '<div class="panel-title">Ingresos por forma de pago</div>' +
        vizBarrasH(byPayment.map((d) => ({ label: d.name, valor: d.value })), { vacio: "Sin pagos en este mes." }) +
      '</div>' +
      '<div class="panel">' +
        '<div class="panel-title">Ingresos por tipo de habitación</div>' +
        vizBarrasH(sumarPor(filteredTx, (t) => "Tipo " + (t.tipoHabitacion || "—"), (t) => t.valor), { vacio: "Sin estadías en este mes." }) +
      '</div>' +
      '<div class="panel">' +
        '<div class="panel-title">Productos más vendidos</div>' +
        vizBarrasH(sumarPor(filteredConsumos, (c) => c.descripcion || "Otro", (c) => c.valor), { vacio: "Sin consumos en este mes.", max: 6 }) +
      '</div>' +
      '<div class="panel">' +
        '<div class="panel-title">Pagos de caja por categoría</div>' +
        vizBarrasH(sumarPor(pagosCajaMes, (p) => p.categoria || "Otro", (p) => p.valor), { vacio: "Sin pagos de caja en este mes.", color: VIZ.egresos }) +
      '</div>' +

      '<div class="panel-title">Detalle de transacciones</div>' +
      (sortedTx.length === 0
        ? '<div style="font-size:13px;color:var(--muted)">' + (busqueda ? "Ningún cliente coincide con la búsqueda." : "No hay transacciones registradas en este mes.") + '</div>'
        : '<table class="tx-table"><thead><tr><th>Hab.</th><th>Tipo</th><th>Huésped</th><th>Documento</th><th>País</th><th>Ciudad</th><th>Placa</th><th>Personas</th><th>Ingreso</th><th>Salida</th><th>Días</th><th>Valor</th><th>Cómo pagó</th><th>Pagado</th><th>Saldo</th><th>Estado</th></tr></thead><tbody>' +

            return '<table class="tx-table"><thead><tr><th>Huésped</th><th>Hab.</th><th>Cédula</th><th>Cómo pagó</th>' +

                  '<td>' + esc(docAbbrev(tipoDocumentoDe(t))) + ' ' + esc(t.cedula) + '</td>' +
                  '<td>' + esc(detalleFormasPago(t.formasPago) === "—" && t.formaPago ? t.formaPago : detalleFormasPago(t.formasPago)) + '</td>' +
                  '<td>' + formatCOP(d.baseHabitacion) + '</td>' +
                  '<td>' + formatCOP(d.ivaHabitacion) + '</td>' +
                  '<td>' + (d.adicional > 0 ? formatCOP(d.adicional) + ' <span class="muted" style="font-size:11px">(' + d.textoAdicionales + ')</span>' : "—") + '</td>' +

                  '<td' + (Number(t.descuento) > 0 ? ' style="color:var(--bad)" title="' + esc(t.motivoDescuento || "") + '"' : "") + '>' + (Number(t.descuento) > 0 ? "− " + formatCOP(t.descuento) : "—") + '</td>' +

                '<td>' + formatCOP(suma("adicional")) + '</td><td>' + formatCOP(suma("ivaAdicional")) + '</td>' +

                '<td>' + formatCOP(suma("total")) + '</td></tr>' +

    '<div class="panel table-scroll" style="margin-top:18px">' +
      '<div class="panel-title">Consumos extra (ingresos marginales)</div>' +

        : '<table class="tx-table"><thead><tr><th>Fecha</th><th>Hab.</th><th>Producto</th><th>Cant.</th><th>Valor unit.</th><th>Cómo pagó</th><th>Pagado</th><th>IVA</th><th>Valor sin IVA</th><th>Total</th></tr></thead><tbody>' +
          sortedConsumos.map((c) => {
            const pct = ivaPctConsumo(c);
            const iva = ivaIncluidoPct(c.valor, pct);
            return '<tr>' +
              '<td>' + formatDateTime(c.fecha) + '</td>' +
              '<td>' + esc(c.roomNumber) + '</td>' +

              '<td>' + (Number(c.cantidad) || 1) + '</td>' +
              '<td>' + formatCOP(c.valorUnit != null ? c.valorUnit : c.valor) + '</td>' +
              '<td>' + esc(c.formaPago || "Efectivo") + '</td>' +

              '<td>' + formatCOP(iva) + ' <span class="muted" style="font-size:11px">(' + textoPctIva(pct) + ')</span></td>' +

            const total = sortedConsumos.reduce((s, c) => s + (Number(c.valor) || 0), 0);
            return '<tr style="font-weight:700"><td colspan="7">Totales del mes</td><td>' + formatCOP(totalIva) + '</td><td>' + formatCOP(total - totalIva) + '</td><td>' + formatCOP(total) + '</td></tr>';
          })() +

      ) +
    '</div>' +
    '<div class="panel table-scroll" style="margin-top:18px">' +
      '<div class="panel-title" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">Pagos desde la caja (egresos del mes)' +
        (pagosCajaMes.length && puede("exportContabilidad")

          : "") +

      (pagosCajaMes.length === 0
        ? '<div style="font-size:13px;color:var(--muted)">No hay pagos desde la caja registrados en este mes.</div>'
        : '<table class="tx-table"><thead><tr><th>Fecha</th><th>Concepto</th><th>Pagado a</th><th>Categoría</th><th>Soporte</th><th>Modo de pago</th><th>Registró</th><th>Valor</th></tr></thead><tbody>' +
          pagosCajaMes.map((p) =>
            '<tr>' +
              '<td>' + formatDateTime(p.fecha) + '</td>' +
              '<td>' + esc(p.concepto) + textoEditado(p) + '</td>' +

        '</tbody></table>'
      ) +

  );
}

// Hojas importadas (contabilidad anterior a la app): mini sección plegable al
// PRINCIPIO de Contabilidad, con el botón para subir archivos. Está cerrada por
// defecto y, abierta, muestra UNA hoja a la vez en un recuadro con su propio scroll.
function renderSeccionHistorico() {
  const hojas = state.historico.filter((h) => h.filas && h.filas.length);
  const editable = puede("editContabilidad");
  if (!hojas.length && !editable) return "";
  const abierta = !!state.historicoAbierto && hojas.length > 0;
  const sel = hojas.find((h) => h.id === state.hojaHistoricoId) || hojas[0];
  return (
    '<div class="panel" id="hojas-importadas" style="margin-bottom:18px;scroll-margin-top:20px">' +
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
        '<button type="button" class="historico-toggle" style="flex:1;width:auto" data-action="toggle-historico" aria-expanded="' + (abierta ? "true" : "false") + '"' + (hojas.length ? "" : " disabled") + '>' +
          '<span class="historico-flecha">' + (abierta ? "▾" : "▸") + '</span>' +
          icon("box", 14) + ' Hojas importadas <span class="sheet-chip-meta">' + hojas.length + '</span>' +
          '<span class="muted" style="font-weight:400;font-size:12px;margin-left:auto">' + (hojas.length ? (abierta ? "Ocultar" : "Ver") : "Aún no hay hojas") + '</span>' +
        '</button>' +
        (editable
          ? '<input type="file" id="import-excel" accept=".xlsx,.xls,.csv" style="display:none" />' +
            '<button class="btn-secondary btn-inline" style="padding:5px 11px;font-size:12.5px" data-action="trigger-import" title="Sube un Excel o CSV con la contabilidad de meses anteriores al uso de la app. Se muestra aparte, sin mezclarse con los registros actuales.">' + icon("upload", 13) + ' Subir archivo</button>'
          : "") +
      '</div>' +
      (editable ? '<div id="import-error" class="error-text" style="margin:4px 0 0;min-height:0"></div>' : "") +
      (abierta
        ? '<div class="sheet-chips" style="margin:12px 0 10px">' +
            hojas.map((h) =>
              '<button class="sheet-chip' + (h.id === sel.id ? " btn-activo" : "") + '" data-action="ver-hoja" data-id="' + esc(h.id) + '">' +
                esc(h.hoja) + ' <span class="sheet-chip-meta">' + h.filas.length + '</span>' +
                (editable ? '<span class="sheet-chip-x" data-action="delete-historico" data-id="' + esc(h.id) + '" title="Quitar esta hoja">✕</span>' : "") +
              '</button>'
            ).join("") +
          '</div>' +
          renderHistoricoTable(sel)
        : "") +
    '</div>'
  );
}

function renderHistoricoTable(h) {
  if (!h.filas || h.filas.length === 0) return "";
  const columnas = Object.keys(h.filas[0]);
  return (
    '<div id="hoja-' + esc(h.id) + '">' +
      '<div class="muted" style="font-size:12px;margin-bottom:6px">' + esc(h.nombre) + ' · ' + esc(h.hoja) + ' · ' + h.filas.length + ' fila(s)</div>' +
      '<div class="historico-scroll">' +
        '<table class="tx-table"><thead><tr>' +
          columnas.map((c) => '<th>' + esc(c) + '</th>').join("") +
        '</tr></thead><tbody>' +
          h.filas.map((fila) =>
            '<tr>' + columnas.map((c) => '<td>' + esc(fila[c] != null ? String(fila[c]) : "") + '</td>').join("") + '</tr>'
          ).join("") +
        '</tbody></table>' +
      '</div>' +
    '</div>'
  );
}

/* ---------- CAPTCHA del inicio de sesión (Cloudflare Turnstile) ----------
   La librería se carga solo cuando se muestra la pantalla de entrada. La pantalla se
   redibuja seguido (por ejemplo al mostrar un error), así que cada vez se vuelve a
   montar la verificación en su recuadro. */
let tokenCaptcha = "";
let widgetCaptcha = null;
let cargandoLibCaptcha = false;
function montarCaptcha() {
  if (!CAPTCHA_SITE_KEY) return;
  const contenedor = document.getElementById("captcha-login");
  if (!contenedor) return;
  if (typeof turnstile === "undefined") {
    if (!cargandoLibCaptcha) {
      cargandoLibCaptcha = true;
      const s = document.createElement("script");
      s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
      s.async = true;
      s.onload = () => { cargandoLibCaptcha = false; montarCaptcha(); };
      s.onerror = () => {
        cargandoLibCaptcha = false;
        const c = document.getElementById("captcha-login");
        if (c) c.innerHTML = '<div class="error-text" style="margin:0">No se pudo cargar la verificación de seguridad. Revisa tu conexión y recarga la página.</div>';
      };
      document.head.appendChild(s);
    }
    contenedor.innerHTML = '<div class="muted" style="font-size:12px">Cargando verificación de seguridad…</div>';
    return;
  }
  if (widgetCaptcha !== null) { try { turnstile.remove(widgetCaptcha); } catch (e) { /* ya no existe */ } }
  contenedor.innerHTML = "";
  tokenCaptcha = "";
  widgetCaptcha = turnstile.render(contenedor, {
    sitekey: CAPTCHA_SITE_KEY,
    language: "es",
    theme: "light",
    callback: (token) => {
      tokenCaptcha = token;
      // Si había un aviso sobre la verificación, ya no aplica.
      const aviso = document.getElementById("login-error");
      if (aviso && /verificación de seguridad/.test(aviso.textContent)) { aviso.textContent = ""; state.loginError = ""; }
    },
    "expired-callback": () => { tokenCaptcha = ""; },
    "error-callback": () => { tokenCaptcha = ""; },
  });
}

async function login(email, clave) {
  state.loginError = "";
  const normalizedEmail = stripControlChars(email).trim().toLowerCase().slice(0, 254);
  const password = stripControlChars(clave).slice(0, 200);
  if (!normalizedEmail || !password) {
    state.loginError = "Ingresa correo y contraseña.";
    render();
    return;
  }
  if (MALICIOUS_PATTERN.test(normalizedEmail) || !EMAIL_PATTERN.test(normalizedEmail)) {
    state.loginError = "Ingresa un correo electrónico válido.";
    render();
    return;
  }

  // Con CAPTCHA activo, primero hay que pasar la verificación.
  const captchaToken = CAPTCHA_SITE_KEY ? tokenCaptcha : "";
  if (CAPTCHA_SITE_KEY && !captchaToken) {
    state.loginError = typeof turnstile !== "undefined"
      ? "Completa la verificación de seguridad antes de entrar."
      : cargandoLibCaptcha
        ? "Espera un momento: se está cargando la verificación de seguridad."
        : "No se pudo cargar la verificación de seguridad. Revisa tu conexión a internet y recarga la página.";
    render();
    return;
  }
  // Cada respuesta del CAPTCHA sirve una sola vez: se descarta y, si hay que
  // reintentar, la pantalla pide una nueva verificación.
  tokenCaptcha = "";

  const { data: datosSesion, error } = await supabaseClient.auth.signInWithPassword({
    email: normalizedEmail,
    password,
    ...(captchaToken ? { options: { captchaToken } } : {}),
  });
  // Cada inicio de sesión registra la hora real de entrada (empieza un turno nuevo),
  // aunque la sesión anterior no se haya cerrado con "Salir".
  const usuarioNuevo = datosSesion && datosSesion.user;
  if (!error && usuarioNuevo) {
    try { localStorage.setItem(claveTurno(usuarioNuevo.id), nowLocalInput()); } catch (e) { /* sin localStorage */ }
    if (state.currentUser && state.currentUser.id === usuarioNuevo.id) state.currentUser.horaInicioSesion = "";
  }

  if (error) {
    const esCaptcha = error.code === "captcha_failed" || /captcha/i.test(String(error.message || ""));
    state.loginError = esErrorDeRed(error)
      ? "Sin conexión a internet: no se puede iniciar sesión ahora. Si ya habías iniciado sesión en este equipo, recarga la página para trabajar sin internet."
      : esCaptcha
        ? (CAPTCHA_SITE_KEY
            ? "La verificación de seguridad no fue válida o expiró. Vuelve a completarla e inténtalo de nuevo."
            : "Supabase exige verificación de seguridad (CAPTCHA), pero falta CAPTCHA_SITE_KEY en config.js.")
        : "Correo o contraseña incorrectos.";
    render();
    return;
  }

  const ok = await loadCurrentProfile();
  if (!ok) {
    state.loginError = "No fue posible cargar tu perfil.";
    render();
    return;
  }
  state.loginSelectedUser = null;
  state.tab = ROLES[state.currentUser.rol].tabs[0] || "habitaciones";
  registrarActividad("Inició sesión", "");
  // Carga los datos del hotel (y la foto de sincronización) al iniciar sesión.
  await loadState();
}

function loginBack() {

  state.loginError = "";
  render();

async function logout() {
  const pendientes = contarCambiosPendientes();
  if (pendientes > 0) {
    const ok = confirm(
      "Hay " + pendientes + " cambio(s) que todavía no se han enviado al servidor (falta internet).\n\n" +
      "Si cierras sesión ahora SE PERDERÁN. Te recomendamos esperar a tener internet.\n\n¿Cerrar sesión de todas formas?"
    );
    if (!ok) return;
  }
  // Se registra la salida y se marca al usuario como desconectado ANTES de cerrar la
  // sesión (después ya no hay permiso para escribir). Si no hay internet, no espera.
  registrarActividad("Cerró sesión", "");
  await conLimiteDeTiempo(Promise.all([enviarActividadPendiente(), actualizarPresencia(false)]), 4000).catch(() => {});
  try { await supabaseClient.auth.signOut(); } catch (e) { /* sin internet: se cierra igual en este equipo */ }
  if (state.currentUser) terminarTurno(state.currentUser.id);
  state.currentUser = null;
  state.offline = false;
  state.saveError = false;
  // Borra de la pantalla y de este equipo los datos del hotel del usuario que salió.
  state.rooms = []; state.transactions = []; state.consumos = []; state.inventario = []; state.historico = []; state.pagosCaja = []; state.activos = []; state.traslados = []; state.configuracion = [];
  state.erroresSync = []; state.ultimaSincronizacion = ""; state.actividadDatos = null;
  TABLAS_SYNC.forEach((t) => { fotoSincronizada[t] = new Map(); });
  await borrarCacheLocal();
  state.modalRoomId = null;
  state.modalUsuarios = false;
  state.loginError = "";
  state.loginSelectedUser = null;
  state.users = [];
  render();
}

// Genera el recibo de caja de la habitación en PDF y lo descarga organizado en
// Recibos de caja/<AAAA-MM>/... El navegador decide dónde queda esa carpeta "Recibos de caja"
// (normalmente dentro de Descargas); en Chrome y Edge de escritorio, además,
// crea de verdad las subcarpetas por mes. En otros navegadores puede que solo
// guarde el archivo con ese nombre completo, sin crear las carpetas.
function generarReciboPDF(roomId) {
  if (!puede("generarRecibos")) return;
  const room = state.rooms.find((r) => String(r.id) === String(roomId));
  if (!room || !room.guest) { alert("Esta habitación no tiene un huésped activo."); return; }
  construirReciboPDF(room, room.guest);
}

// Construye y descarga el PDF del recibo de caja a partir de una habitación y
// una "foto" de los datos del huésped (puede ser room.guest en vivo, o una
// copia con la hora de salida y el valor ya cerrados al momento del check-out).
function construirReciboPDF(room, g) {
  // Cada recibo gasta un número del consecutivo: solo lo generan los roles autorizados.
  if (!puede("generarRecibos")) return;
  if (!window.jspdf || !window.jspdf.jsPDF) {
    alert("No se pudo cargar el generador de PDF. Revisa tu conexión a internet e inténtalo de nuevo.");
    return;
  }

  const consumos = consumosOfTransaction(g.transactionId);
  const consumosTotal = consumosTotalOf(g.transactionId);
  const totalCuenta = (Number(g.valor) || 0) + consumosTotal;
  const ahora = new Date();
  const pad2 = (n) => String(n).padStart(2, "0");
  const numeroRecibo = siguienteConsecutivoRecibo();
  const nombreUsuario = state.currentUser ? (state.currentUser.nombre || state.currentUser.usuario || "") : "";

  // Si el cobro se hizo a nombre de otra persona (acompañante), el recibo de caja
  // se imprime con los datos de esa persona (nombre, documento, teléfono).
  // Si algún dato de la otra persona quedó vacío, se completa con el de la
  // persona principal para no dejar el recibo de caja con campos en blanco.
  const idxAcomp = indiceAcompDeFacturarA(g.facturarA);
  const acompRecibo = idxAcomp >= 0 ? (getAcompanantes(g)[idxAcomp] || null) : null;
  const nombreFactura = acompRecibo ? (acompRecibo.nombre || g.nombre) : g.nombre;
  const tipoDocFactura = acompRecibo ? (acompRecibo.tipoDocumento || g.tipoDocumento) : g.tipoDocumento;
  const documentoFactura = acompRecibo ? (acompRecibo.cedula || g.cedula) : g.cedula;
  const telefonoFactura = acompRecibo ? (acompRecibo.telefono || g.telefono) : g.telefono;
  const ciudadFactura = acompRecibo ? (acompRecibo.ciudad || g.ciudad) : g.ciudad;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });
  const anchoPagina = doc.internal.pageSize.getWidth();
  const centroX = anchoPagina / 2;
  const marginX = 70;
  let y = 60;

  // Encabezado del hotel, centrado, igual que en un recibo de caja impreso.
  doc.setFont("helvetica", "bold");
  doc.setFontSize(14);
  doc.text(HOTEL_NOMBRE.toUpperCase(), centroX, y, { align: "center" });
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10);
  if (HOTEL_DIRECCION) { y += 16; doc.text(HOTEL_DIRECCION, centroX, y, { align: "center" }); }
  if (HOTEL_TELEFONO) { y += 15; doc.text(HOTEL_TELEFONO, centroX, y, { align: "center" }); }
  if (HOTEL_CIUDAD) { y += 15; doc.text(HOTEL_CIUDAD.toUpperCase(), centroX, y, { align: "center" }); }

  y += 34;
  doc.setFont("helvetica", "bold");
  doc.setFontSize(11);
  doc.text("RECIBO DE CAJA No:  " + numeroRecibo, marginX, y);

  y += 30;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10.5);

  function filaDato(etiqueta, valor, negritaValor) {
    doc.setFont("helvetica", "normal");
    doc.text(etiqueta, marginX, y);
    doc.setFont("helvetica", negritaValor ? "bold" : "normal");
    doc.text(String(valor || "—"), marginX + 92, y);
    y += 19;
  }

  filaDato("Fecha:", formatFechaCorta(g.horaIngreso));
  filaDato("CLIENTE:", (nombreFactura || "—").toUpperCase());
  filaDato("NIT:", documentoFactura || "—");
  filaDato("Dirección:", (ciudadFactura || "—").toUpperCase());
  filaDato("Teléfono:", telefonoFactura || "—");
  filaDato("No Hab:", room.number, true);

  y += 8;
  doc.setFont("helvetica", "bold");
  doc.text("Tipo " + (room.tipo || "—"), marginX, y);

  // Espacio en blanco antes del valor total, igual que en el recibo impreso.
  y += 70;

  doc.setFont("helvetica", "normal");
  doc.setFontSize(11);
  doc.text("Valor Total:", marginX + 60, y);
  doc.setFont("helvetica", "bold");
  doc.text(Math.round(totalCuenta).toLocaleString("es-CO"), marginX + 160, y);

  y += 36;
  doc.setFont("helvetica", "normal");
  doc.setFontSize(10.5);
  doc.text("Suma en letras:", marginX, y);
  y += 18;
  doc.text("SON:  " + numeroALetras(totalCuenta) + " PESOS M/L", marginX, y, { maxWidth: anchoPagina - marginX * 2 });

  // El IVA ya está incluido en el valor del hospedaje: solo se informa cuánto es.
  const desglose = desgloseCobro(g);
  if (desglose.total > 0) {
    y += 24;
    doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text(
      "(Hospedaje " + formatCOP(desglose.habitacion + (Number(g.descuento) || 0)) +
      (desglose.adicional > 0 ? " + personas adicionales " + formatCOP(desglose.adicional) : "") +
      (Number(g.descuento) > 0 ? " - descuento " + formatCOP(g.descuento) : "") +
      ". Incluye IVA 19%: " + formatCOP(desglose.ivaHabitacion + desglose.ivaAdicional) + ")",
      marginX, y, { maxWidth: anchoPagina - marginX * 2 }
    );
    doc.setTextColor(0, 0, 0);
  }

  y += 70;
  doc.setDrawColor(0);
  doc.line(marginX, y, marginX + 260, y);
  y += 15;
  doc.setFontSize(10.5);
  doc.text("Firma Huésped", marginX, y);

  y += 55;
  doc.line(marginX, y, marginX + 260, y);
  y += 15;
  doc.text("Usuario: " + nombreUsuario.toUpperCase(), marginX, y);

  const blob = doc.output("blob");
  const url = URL.createObjectURL(blob);
  const mesKey = ahora.getFullYear() + "-" + pad2(ahora.getMonth() + 1);
  const nombreArchivo = "Recibos de caja/" + mesKey + "/recibo_" + numeroRecibo + "_" + nombreArchivoSeguro(room.number) + "_" + nombreArchivoSeguro(nombreFactura) + ".pdf";
  const a = document.createElement("a");
  a.href = url;
  a.download = nombreArchivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function openTimePicker(targetId) {
  const target = document.getElementById(targetId);
  if (!target) return;

  const raw = target.value || nowLocalInput();
  const partes = raw.split("T");
  const fecha0 = partes[0] || todayKey();
  const horaMin = (partes[1] || "00:00").split(":");
  let horaSel = horaMin[0] || "00";
  let minutoSel = horaMin[1] || "00";

  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.style.zIndex = "999";

  const horasHtml = Array.from({ length: 24 }, (_, i) => pad(i))
    .map((h) => '<button type="button" class="tp-item" data-hora="' + h + '">' + h + '</button>').join("");
  const minutosHtml = Array.from({ length: 60 }, (_, i) => pad(i))
    .map((m) => '<button type="button" class="tp-item" data-minuto="' + m + '">' + m + '</button>').join("");

  overlay.innerHTML =
    '<div class="modal" style="max-width:340px">' +
      '<div class="modal-head">' +
        '<div class="modal-head-title">' + icon("clock", 18) + '<h3>Elegir fecha y hora</h3></div>' +
        '<button type="button" class="icon-btn" id="tp-cerrar">' + icon("x", 18) + '</button>' +
      '</div>' +
      '<div class="field"><label>Fecha</label><input class="input" type="date" id="tp-fecha" value="' + esc(fecha0) + '" /></div>' +
      '<div class="tp-clock-display" id="tp-display">' + horaSel + ':' + minutoSel + '</div>' +
      '<div class="muted" style="font-size:11.5px;text-align:center;margin-top:-8px">Desliza y toca, como al poner una alarma</div>' +
      '<div class="tp-columns">' +
        '<div class="tp-col" id="tp-col-horas">' + horasHtml + '</div>' +
        '<div class="tp-col-sep">:</div>' +
        '<div class="tp-col" id="tp-col-minutos">' + minutosHtml + '</div>' +
      '</div>' +
      '<div class="btn-row"><button type="button" class="btn-primary" id="tp-usar">' + icon("check", 15) + ' Usar esta hora</button></div>' +
    '</div>';

  // Este selector vive fuera del sistema de render() de la app (se agrega
  // directo al body) para no borrar lo que el usuario ya haya escrito en el
  // formulario que sigue abierto detrás.
  document.body.appendChild(overlay);

  const colHoras = overlay.querySelector("#tp-col-horas");
  const colMinutos = overlay.querySelector("#tp-col-minutos");
  const display = overlay.querySelector("#tp-display");
  const fechaInput = overlay.querySelector("#tp-fecha");

  function marcarSeleccion() {
    colHoras.querySelectorAll(".tp-item").forEach((btn) => btn.classList.toggle("selected", btn.dataset.hora === horaSel));
    colMinutos.querySelectorAll(".tp-item").forEach((btn) => btn.classList.toggle("selected", btn.dataset.minuto === minutoSel));
    display.textContent = horaSel + ":" + minutoSel;
  }
  marcarSeleccion();

  requestAnimationFrame(() => {
    const hSel = colHoras.querySelector(".selected");
    const mSel = colMinutos.querySelector(".selected");
    if (hSel) hSel.scrollIntoView({ block: "center" });
    if (mSel) mSel.scrollIntoView({ block: "center" });
  });

  colHoras.addEventListener("click", (e) => {
    const btn = e.target.closest(".tp-item");
    if (!btn) return;
    horaSel = btn.dataset.hora;
    marcarSeleccion();
  });
  colMinutos.addEventListener("click", (e) => {
    const btn = e.target.closest(".tp-item");
    if (!btn) return;
    minutoSel = btn.dataset.minuto;
    marcarSeleccion();
  });

  function cerrar() { overlay.remove(); }

  overlay.querySelector("#tp-cerrar").addEventListener("click", cerrar);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) cerrar(); });

  overlay.querySelector("#tp-usar").addEventListener("click", () => {
    const fecha = fechaInput.value || fecha0;
    target.value = fecha + "T" + horaSel + ":" + minutoSel;
    target.dispatchEvent(new Event("input", { bubbles: true }));
    target.dispatchEvent(new Event("change", { bubbles: true }));
    cerrar();
  });
}

// "$ 245.000 · 3 día(s) x $ 75.000 + 1 persona(s) adicional(es) x $ 15.000"

    (calc.adicionales > 0 ? " + " + calc.adicionales + " persona(s) adicional(es) " + formatCOP(calc.valorAdicionales) : "") +
    (calc.menoresCobrados > 0 ? " + " + calc.menoresCobrados + " menor(es) de más de " + EDAD_MENOR_COBRO + " años " + formatCOP(calc.valorMenores) : "") +
    (calc.descuento > 0 ? " − descuento " + formatCOP(calc.descuento) : "");
}

function updateTotalPreview(form) {

  const tipoForm = roomForm ? ((roomForm.guest && roomForm.guest.tipoTarifa) || roomForm.tipo) : "";
  const calc = calcularValorEstadia(valorDia, dias, personasInput ? personasInput.value : 1, descuentoInput ? descuentoInput.value : 0, tipoForm, menoresDelFormulario(form));
  const total = calc.total;

  }

  if (summaryEl) {
    const formasPago = [];

    const v1 = Number(form.querySelector('[name="montoPago1"]').value) || 0;

    const m2 = form.querySelector('[name="formaPago2"]');
